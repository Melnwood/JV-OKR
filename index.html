let bUnit = null, bType = "", bQuery = "";

LENS.browse = () => {
  const el = document.getElementById("view");

  if(!bUnit){
    const q = bQuery.toLowerCase();
    const match = u => !q || String(f(u,"Name")).toLowerCase().includes(q)
      || unitObjectives(u.id).some(o=>String(f(o,"Title")||"").toLowerCase().includes(q));
    const roots = unitsSorted(unitRoots().filter(u=>(!bType || f(u,"Type")===bType)));
    const shown = roots.filter(u => match(u) || unitTree(u.id).some(id=>{const c=rec("units",id); return c && match(c);}));

    el.innerHTML = `
      <div class="head">
        <div><h1>Browse JV</h1>
          <div class="sub">Every country, division, department and team. Look around all you like — nothing here can be changed.</div></div>
        <div class="filters">
          <select class="sm" id="bt"><option value="">Countries &amp; divisions</option>
            <option ${bType==="Country"?"selected":""}>Country</option>
            <option ${bType==="Division"?"selected":""}>Division</option></select>
          <input class="sm" id="bq" placeholder="Search units or objectives…" value="${esc(bQuery)}" style="width:230px"/>
        </div>
      </div>
      ${["Country","Division"].filter(t=>!bType||t===bType).map(t=>{
        const gs = shown.filter(u=>f(u,"Type")===t);
        if(!gs.length) return "";
        return `<div style="margin-bottom:20px">
          <div class="eyebrow" style="margin-bottom:8px">${t==="Country"?"COUNTRIES":"DIVISIONS"}</div>
          <div class="lib">${gs.map(unitCard).join("")}</div>
        </div>`;}).join("") || `<div class="card empty">No org units yet. A leader can add them under <b>Org</b>.</div>`}`;

    document.getElementById("bt").onchange = e=>{bType=e.target.value; render();};
    const qb = document.getElementById("bq");
    qb.oninput = e=>{ bQuery=e.target.value; render();
      const n=document.getElementById("bq"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
    document.querySelectorAll("[data-unit]").forEach(c=>c.onclick=()=>{bUnit=c.dataset.unit; render(); scrollTo(0,0);});
    return;
  }

  /* --- one unit, read-only, with its children --- */
  const U = rec("units", bUnit);
  if(!U){ bUnit=null; return render(); }
  const kids = unitsSorted(unitChildren(U.id));
  const own = live(DB.objectives.filter(o=>one(o,"Org Unit")===U.id));   // this unit's own objectives
  const all = unitObjectives(U.id);                                       // including everything beneath
  const people = DB.people.filter(p=>one(p,"Org Unit")===U.id);
  const avg = all.length ? Math.round(all.reduce((a,o)=>a+objProgress(o),0)/all.length*100) : 0;
  const parent = unitParent(U);

  el.innerHTML = `
    <div class="head">
      <div>
        <div class="eyebrow">${esc(unitCrumb(U))}</div>
        <h1>${esc(f(U,"Name"))}</h1>
        <div class="sub">${esc(f(U,"Type")||"")} · ${all.length} objective${all.length===1?"":"s"} across this unit and everything under it · ${avg}% average · read-only</div>
      </div>
      <div class="filters">
        ${parent?`<button class="btn ghost" data-up="${parent.id}">↑ ${esc(f(parent,"Name"))}</button>`:""}
        <button class="btn ghost" id="bback">← All of JV</button>
      </div>
    </div>

    ${kids.length?`<div class="card">
      <h2>Inside ${esc(f(U,"Name"))}</h2>
      <div class="cap">Departments and teams. Click to go down a level.</div>
      <div class="lib">${kids.map(unitCard).join("")}</div>
    </div>`:""}

    ${people.length?`<div class="card"><h2>Who's here</h2>
      <div class="roster" style="margin-top:8px">${people.map(p=>`<span class="p">${esc(f(p,"Name"))}${f(p,"Role")?` · ${esc(f(p,"Role"))}`:""}</span>`).join("")}</div>
    </div>`:""}

    ${own.length ? own.map(objCardRO).join("")
      : `<div class="card empty">${esc(f(U,"Name"))} hasn't written any objectives of its own${kids.length?" — look inside the units above":""}.</div>`}`;

  document.getElementById("bback").onclick = ()=>{bUnit=null; render(); scrollTo(0,0);};
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{bUnit=b.dataset.up; render(); scrollTo(0,0);});
  document.querySelectorAll("[data-unit]").forEach(c=>c.onclick=()=>{bUnit=c.dataset.unit; render(); scrollTo(0,0);});
};

function unitCard(u){
  const objs = unitObjectives(u.id);
  const avg = objs.length ? Math.round(objs.reduce((a,o)=>a+objProgress(o),0)/objs.length*100) : 0;
  const mix = ["On track","At risk","Off track"].map(c=>objs.filter(o=>f(o,"Confidence")===c).length);
  const quiet = objs.filter(isStale).length;
  const kids = unitChildren(u.id);
  return `<div class="res" style="cursor:pointer" data-unit="${u.id}">
    <span class="mono">${esc(f(u,"Type")||"")}</span>
    <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:16px;margin-top:5px">${esc(f(u,"Name"))}</div>
    <div class="mono">${objs.length} objective${objs.length===1?"":"s"}${kids.length?` · ${kids.length} unit${kids.length===1?"":"s"} inside`:""}${unitPeople(u.id).length?` · ${unitPeople(u.id).length} people`:""}</div>
    <div class="prog" style="margin-top:9px"><span style="width:${avg}%;background:var(--jv-deep)"></span></div>
    <div class="mono" style="margin-top:5px">${avg}% average</div>
    <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap">
      ${mix[0]?`<span class="pill p-on">${mix[0]} on</span>`:""}
      ${mix[1]?`<span class="pill p-risk">${mix[1]} risk</span>`:""}
      ${mix[2]?`<span class="pill p-off">${mix[2]} off</span>`:""}
      ${quiet?`<span class="pill p-stale">${quiet} quiet</span>`:""}
      ${!objs.length?`<span class="pill p-none">nothing written</span>`:""}
    </div>
  </div>`;
}

function objCardRO(o){
  const krs = objKrs(o.id), c = f(o,"Confidence")||"Not started", p = pct(objProgress(o));
  const k = ladderKr(o), decs = DB.decisions.filter(d=>lnk(d,"Objective").includes(o.id));
  const last = objCheckins(o.id)[0];
  return `<div class="card">
    <div class="eyebrow">${alignLine(o)}</div>
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:4px">
      <h2>${esc(f(o,"Title"))}</h2><span class="pill ${cls(c)}">${c}</span>
    </div>
    <div class="mono">${esc(nm("people",one(o,"Owner"))||"unowned")} · ${esc(nm("cycles",one(o,"Cycle")))} · ${p}%
      ${isStale(o)?` · <span style="color:var(--indigo)">◆ ${staleDays(o)}d since a check-in</span>`:""}</div>
    <div class="prog"><span style="width:${p}%;background:${col(c)}"></span></div>
    ${krs.length ? `<div style="margin-top:12px">${krs.map(kr=>{
      const kp = pct(f(kr,"Progress")), kc = f(kr,"Confidence")||"Not started";
      const ts = krTasks(kr.id), done = ts.filter(t=>f(t,"Status")==="Done").length;
      return `<div style="padding:9px 0;border-top:1px dashed var(--rule)">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <span style="font-weight:600;font-size:13.5px">${esc(f(kr,"Title"))}</span>
          <span class="mono">${f(kr,"Current value")??0} / ${f(kr,"Target value")??0}${esc(f(kr,"Unit")||"")} · ${kp}%</span>
        </div>
        <div class="prog"><span style="width:${kp}%;background:${col(kc)}"></span></div>
        ${ts.length?`<div class="mono" style="margin-top:5px">${done} of ${ts.length} tasks done${ts.filter(isLate).length?` · ${ts.filter(isLate).length} overdue`:""}</div>`:""}
        ${f(kr,"Target changed")?`<div class="mono" style="color:var(--indigo);margin-top:4px">◆ ${esc(f(kr,"Target changed"))}</div>`:""}
      </div>`;}).join("")}</div>` : `<div class="empty" style="margin-top:10px">No key results yet.</div>`}
    ${last?`<div class="next" style="margin-top:12px"><span class="mono">Last check-in ${fmt(f(last,"Date"))} · ${esc(nm("people",one(last,"Person")))}</span>
      <div style="margin-top:3px">${esc(f(last,"What moved")||"")}</div></div>`:""}
    ${decs.length?`<div style="margin-top:12px">
      <div class="eyebrow" style="margin-bottom:6px">Decisions on this objective</div>
      ${decs.map(d=>`<div class="mono" style="margin-bottom:4px">◆ ${esc(f(d,"Decision"))} — ${esc((f(d,"Why")||"").slice(0,90))}${(f(d,"Why")||"").length>90?"…":""}</div>`).join("")}
    </div>`:""}
  </div>`;
}

/* ============================ ORG (leaders only) ============================ */
V.org = () => {
  const el = document.getElementById("view");
  const rows = u => {
    const kids = unitsSorted(unitChildren(u.id));
    return `<div class="row" style="padding-left:${(unitPath(u).length-1)*22}px">
        <div><strong>${esc(f(u,"Name"))}</strong>
          <div class="mono">${esc(f(u,"Type")||"")}${one(u,"Leader")?` · led by ${esc(nm("people",one(u,"Leader")))}`:""} · ${unitObjectives(u.id).length} objectives</div></div>
        <button class="btn dash" style="font-size:11.5px;padding:4px 8px" data-addchild="${u.id}">+ inside</button>
      </div>${kids.map(rows).join("")}`;
  };
  el.innerHTML = `
    <div class="head"><div><h1>Org</h1>
      <div class="sub">Countries, divisions, departments and teams. A department can sit under a country or a division; a team under either, or under a department.</div></div></div>
    <div class="two">
      <div class="card">
        <h2>The tree</h2><div class="cap">Everything JV is made of.</div>
        ${unitsSorted(unitRoots()).map(rows).join("") || `<div class="empty">Nothing yet. Add your first country or division →</div>`}
      </div>
      <div class="card">
        <h2>Add a unit</h2>
        <div class="field"><label>Name</label><input id="uN" placeholder="Poland / Staff Care / Youth Ministry"/></div>
        <div class="field"><label>Type</label>
          <select id="uT">${["Country","Division","Department","Team"].map(t=>`<option>${t}</option>`).join("")}</select></div>
        <div class="field"><label>Inside which unit?</label>
          <select id="uP"><option value="">— top level (a country or division) —</option>
            ${unitsSorted(DB.units).map(u=>`<option value="${u.id}">${esc(unitCrumb(u))}</option>`).join("")}</select></div>
        <div class="field"><label>Leader</label>
          <select id="uL"><option value="">— nobody yet —</option>
            ${DB.people.map(p=>`<option value="${p.id}">${esc(f(p,"Name"))}</option>`).join("")}</select></div>
        <button class="btn wide" id="uGo">Add unit</button>
      </div>
    </div>`;
  const add = async (parentId)=>{
    const name = document.getElementById("uN").value.trim();
    if(!name) return toast("Give it a name", true);
    await post(T.units, [{fields:{Name:name, Type:document.getElementById("uT").value, Active:true,
      ...(parentId?{"Parent unit":[parentId]}:{}),
      ...(document.getElementById("uL").value?{Leader:[document.getElementById("uL").value]}:{})}}]);
    await reload("units"); toast("Unit added"); render();
  };
  document.getElementById("uGo").onclick = ()=>add(document.getElementById("uP").value);
  document.querySelectorAll("[data-addchild]").forEach(b=>b.onclick=()=>{
    document.getElementById("uP").value = b.dataset.addchild;
    document.getElementById("uN").focus();
    toast(`New unit will sit inside ${nm("units", b.dataset.addchild)}`);
  });
};

/* ============================ MY WORK (leader view) ============================ */
let leaderId = null;
let mineKr = null, mineNotesOpen = null, mineDoneOpen = false, mineTasksOpen = false, mineNotesFull = new Set();   // My OKR page state
const fmtNote = line => {
  const m = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}) · (.+?) — ([\s\S]*)$/);
  return m ? `<span class="n-when">${esc(fmt(m[1]))} ${esc(m[1].slice(11))}</span> <b>${esc(m[2].split(" ")[0])}</b> — ${esc(m[3])}` : esc(line);
};
const PROG_WORD = p => p>=100 ? "done" : p>=70 ? "nearly there" : p>=35 ? "underway" : p>0 ? "just started" : "not started";

V.mine = () => {
  const L = ME;
  const el = document.getElementById("view");
  const first = (f(L,"Name")||"").split(" ")[0];
  const hr = new Date().getHours();
  const greet = hr<12 ? "Morning" : hr<18 ? "Afternoon" : "Evening";
  const mine = myOkrs(L.id);
  const people = DB.people.filter(p=>f(p,"Active")!==false).sort((a,b)=>(f(a,"Name")||"").localeCompare(f(b,"Name")||""));

  // tasks handed to me that I haven't accepted yet — they wait at the door
  const asks = DB.tasks.filter(t=>lnk(t,"Owner").includes(L.id) && !f(t,"Seen")
    && f(t,"Status")!=="Done" && one(t,"Created by") && one(t,"Created by")!==L.id);
  const accepted = t => f(t,"Seen") || !one(t,"Created by") || one(t,"Created by")===L.id;
  const myOpen = DB.tasks.filter(t=>lnk(t,"Owner").includes(L.id) && f(t,"Status")!=="Done")
    .sort((a,b)=>(f(a,"Due date")||"9999")<(f(b,"Due date")||"9999")?-1:1);

  const duePhrase = t => {
    const d = f(t,"Due date"); if(!d) return "no date on it";
    if(d<iso(TODAY)) return `meant for ${fmt(d)}`;
    if(d===iso(TODAY)) return "due today";
    return `due ${fmt(d)}`;
  };
  const krOf = t => rec("krs", one(t,"Key Result"));
  const noteLines = t => (f(t,"Notes")||"").split("\n").filter(x=>x.trim());

  const slider = t => `
    <input type="range" class="tprog" data-tprog="${t.id}" min="0" max="100" step="10" value="${pct(f(t,"Progress"))}" style="--p:${pct(f(t,"Progress"))}%" title="Slide it — just started to nearly there"/>
    <span class="sliderword" id="tw-${t.id}">${PROG_WORD(pct(f(t,"Progress")))}</span>`;

  const noteBox = t => { if(mineNotesOpen!==t.id) return "";
    const ls = noteLines(t), full = mineNotesFull.has(t.id), show = full ? ls : ls.slice(-1);
    return `<div class="notes">
      <div class="addrow" style="margin:0 0 8px"><input type="text" id="nnt-${t.id}" placeholder="Jot a note — it's signed with your name"/><button class="btn dash" data-noteadd="${t.id}">Add</button></div>
      ${ls.length>1 ? `<div class="donehead" style="margin:0 0 6px" data-morenotes="${t.id}">${full?"▾ hide earlier notes":`▸ ${ls.length-1} earlier note${ls.length>2?"s":""}`}</div>` : ""}
      ${show.map(n=>`<div class="noteline">${fmtNote(n)}</div>`).join("") || `<div class="cap">Notes are how the team talks — first one's yours.</div>`}
    </div>`; };

  const row = (t, showOwner, markMine) => `
    <div class="task ${isLate(t)?"late":""} ${markMine && lnk(t,"Owner").includes(L.id)?"minerow":""}">
      <input type="checkbox" data-mtask="${t.id}"/>
      <span class="t">${esc(f(t,"Title"))}${!f(t,"Seen") && one(t,"Created by") && one(t,"Created by")!==one(t,"Owner") ? ` <span class="pill p-risk" style="font-size:9px">new · from ${esc((nm("people",one(t,"Created by"))||"").split(" ")[0])}</span>` : ""}
        <div class="mono" style="color:var(--ink-3);cursor:pointer" data-notes="${t.id}">${!markMine && krOf(t)?esc(f(krOf(t),"Title"))+" · ":""}${duePhrase(t)}${noteLines(t).length?` · ${noteLines(t).length} note${noteLines(t).length>1?"s":""} ▾`:" · + note"}</div>
      </span>
      ${slider(t)}
      ${showOwner ? `<select class="towner" data-towner="${t.id}" title="Who's carrying this">${people.map(p=>`<option value="${p.id}" ${p.id===one(t,"Owner")?"selected":""}>${esc((f(p,"Name")||"").split(" ")[0])}</option>`).join("")}</select>` : ""}
      <input type="date" class="tdue" data-tdue="${t.id}" value="${f(t,"Due date")||""}" title="Due date"/>
      <span class="m xdel" data-tdel="${t.id}" title="Delete">✕</span>
    </div>${noteBox(t)}`;

  // one sentence of why any of this matters — from the first objective that has key results
  const primary = mine.find(o=>objKrs(o.id).length) || mine[0];
  let orient = "";
  if(primary){
    const lk = ladderKr(primary);
    orient = `Your team is working toward <b>${esc(f(primary,"Title"))}</b>` +
      (lk ? ` — part of JV seeing <b>${esc(f(lk,"Title"))}</b>.` :
       supportsJv(primary) ? ` — supporting JV 2030 in its own way.` :
       ` — standing on its own, and that's honest.`);
  }

  // the full workspace inside an opened key result
  const workspace = kr => {
    const all = krTasks(kr.id);
    const open = all.filter(t=>f(t,"Status")!=="Done")
      .sort((a,b)=>(f(a,"Due date")||"9999")<(f(b,"Due date")||"9999")?-1:1);
    const dones = all.filter(t=>f(t,"Status")==="Done").sort((a,b)=>(f(b,"Done date")||"")<(f(a,"Done date")||"")?-1:1);
    const cur = f(kr,"Current value")??0, tgt = f(kr,"Target value")??0, unit = f(kr,"Unit")||"";
    const conf = f(kr,"Confidence")||"Not started", p = pct(f(kr,"Progress"));
    const tp = all.length ? Math.round(all.reduce((s,t)=>s+(f(t,"Status")==="Done"?1:(f(t,"Progress")||0)),0)/all.length*100) : 0;
    const numline = unit==="%" && tgt===100 ? `<b>${cur}%</b> of the way there`
                  : `${cur} of ${tgt}${esc(unit)} so far — <b>${p}%</b> of the way`;
    return `
      <div class="orient" style="margin:2px 0 4px">${numline}. <span class="pill ${cls(conf)}" style="vertical-align:1px">${esc(conf)}</span></div>
      ${(()=>{ const st2=f(kr,"Start value")||0, tv=(f(kr,"Target value")??0);
        const uo = rec("units", one(rec("objectives", one(kr,"Objective"))||{},"Org Unit"));
        const midD = uo && f(uo,"Midterm date"), retD = uo && f(uo,"Retro date");
        const marks=(f(kr,"History")||"").split("\n").filter(x=>/^\d{4}-\d{2}-\d{2}/.test(x))
          .map(l=>{const i=l.indexOf(" · "); return {d:l.slice(0,10), v:+l.slice(i+3)};})
          .filter(m=>!isNaN(m.v));
        // the first value-change on/after each meeting date wears the meeting's ring
        const flag=(date,name)=>{ if(!date || date>iso(TODAY)) return; const m=marks.find(x=>x.d>=date); if(m && !m.kind) m.kind=name; };
        flag(midD,"midterm"); flag(retD,"retro");
        const shown = marks.slice(-5).map(m=>({...m, pos:pct((m.v-st2)/((tv-st2)||1))}));
        return `<div class="prog big hist ${shown.some(m=>m.kind)?"hasmeet":""}"><span style="width:${p}%;background:${col(conf)}"></span>
          ${shown.map(m=>m.kind
            ? `<i class="hmark hmeet" style="left:${m.pos}%" title="${m.v} on ${esc(fmt(m.d))}"></i><b class="hlabel" style="left:${m.pos}%">${m.kind} · ${esc(fmt(m.d))}</b>`
            : `<i class="hmark" style="left:${m.pos}%" title="${m.v} on ${esc(fmt(m.d))}"></i>`).join("")}</div>
        ${shown.some(m=>!m.kind)?`<div class="hdates">${shown.filter(m=>!m.kind).map(m=>`<span style="left:${m.pos}%">${esc(fmt(m.d))}</span>`).join("")}</div>`:""}`; })()}
      <div class="krviz-sub">The work under it: ${dones.length} of ${all.length} finished <div class="prog"><span style="width:${tp}%;background:var(--jv)"></span></div></div>
      <div class="addrow" style="margin:14px 0 10px">
        <input type="text" id="mnt" placeholder="Add a task — small and real beats big and vague"/>
        <select class="sm" id="mnw" title="Who's carrying it">${people.map(pp=>`<option value="${pp.id}" ${pp.id===L.id?"selected":""}>${esc(f(pp,"Name"))}</option>`).join("")}</select>
        <input type="date" class="tdue" id="mnd" title="By when"/>
        <button class="btn dash" id="madd">Add</button>
      </div>
      ${open.map(t=>row(t,true,true)).join("") || `<div class="empty">No open tasks here${dones.length?" — everything's in the record below":""}. Add the next one above.</div>`}
      ${dones.length ? `
        <div class="donehead" data-donetog>${mineDoneOpen?"▾":"▸"} What's already moved (${dones.length})</div>
        ${mineDoneOpen ? dones.map(t=>`<div class="task done">
          <input type="checkbox" checked data-mundo="${t.id}" title="Bring it back"/>
          <span class="t">${esc(f(t,"Title"))}</span>
          <span class="m">${esc((nm("people",one(t,"Owner"))||"").split(" ")[0])} · ${fmt(f(t,"Done date"))||"done"}</span>
        </div>`).join("") : ""}` : ""}
      <div class="cap" style="margin-top:18px">Notes on this key result — say it here and the team sees it</div>
      <div class="addrow" style="margin:6px 0 8px"><input type="text" id="knt" placeholder="Something about this key result, not one task? Write it — it's signed and kept"/><button class="btn dash" data-krnote="${kr.id}">Add</button></div>
      ${(()=>{ const ls=(f(kr,"Notes")||"").split("\n").filter(x=>x.trim()), kk="kr:"+kr.id, full=mineNotesFull.has(kk), show=full?ls:ls.slice(-1);
        return (ls.length>1 ? `<div class="donehead" style="margin:0 0 6px" data-morenotes="${kk}">${full?"▾ hide earlier notes":`▸ ${ls.length-1} earlier note${ls.length>2?"s":""}`}</div>` : "")
          + show.map(n=>`<div class="noteline">${fmtNote(n)}</div>`).join(""); })()}`;
  };

  el.innerHTML = `
    <div class="head"><div><h1>${greet}, ${esc(first)}.</h1>
      ${orient?`<div class="orient">${orient}</div>`:`<div class="orient">You're not on any key results yet — when your team's OKRs have them, this page comes alive.</div>`}</div></div>

    ${!localStorage.getItem("jvMineIntro") ? `<div class="intro">
      This page is your corner of the team's work. Your tasks are up top, and each key result opens into the full workspace.
      Notes are how you talk to each other, and they're kept. Nothing here is a grade.
      <div style="margin-top:8px"><button class="btn dash" data-intro>Got it</button></div>
    </div>` : ""}

    ${asks.map(t=>{ const k2=krOf(t);
      return `<div class="newtask"><span style="color:var(--jv-deep)">✦</span>
        <div class="nt-main"><b>${esc(nm("people",one(t,"Created by")).split(" ")[0])} asked you to pick up:</b> ${esc(f(t,"Title"))}
          <div class="cap">${duePhrase(t)}${k2?` · under ${esc(f(k2,"Title"))}`:""}</div></div>
        <button class="btn dash" data-seen="${t.id}" data-krto="${k2?k2.id:""}">I've got it</button></div>`;}).join("")}

    <div class="wobj ${mineTasksOpen?"open":""}">
      <div class="wobj-top" data-mytog>
        <span class="chev">▶</span>
        <div class="wobj-main"><div class="wobj-title">My open tasks</div></div>
        <div class="wobj-side"><span class="pill ${myOpen.some(isLate)?"p-off":"p-none"}">${myOpen.length} open${myOpen.filter(isLate).length?` · ${myOpen.filter(isLate).length} overdue`:""}</span></div>
      </div>
      <div class="wobj-body">
        ${mineTasksOpen ? (myOpen.map(t=>row(t,false,false)).join("") || `<div class="empty">Nothing on your plate. Open a key result below and add a task — or take the quiet as a gift.</div>`) : ""}
      </div>
    </div>

    ${mine.map(o=>{
      const krs = objKrs(o.id); if(!krs.length) return "";
      return `<div class="unit-label" style="margin-top:18px">${esc(f(o,"Title"))}</div>
        ${krs.map(k=>{
          const kc = f(k,"Confidence")||"Not started", kp = pct(f(k,"Progress"));
          const openN = krTasks(k.id).filter(t=>f(t,"Status")!=="Done").length;
          const isOpen = mineKr===k.id;
          return `<div class="wobj ${isOpen?"open":""}">
            <div class="wobj-top" data-krtog="${k.id}">
              <span class="chev">▶</span>
              <div class="wobj-main">
                <div class="wobj-title">${esc(f(k,"Title"))}</div>
                <div class="prog" style="max-width:220px;margin-top:6px"><span style="width:${kp}%;background:${col(kc)}"></span></div>
              </div>
              <div class="wobj-side">
                <span class="pill p-none">${openN} open task${openN===1?"":"s"}</span>
                <span class="wobj-pct">${kp}%</span>
              </div>
            </div>
            <div class="wobj-body">${isOpen ? workspace(k) : ""}</div>
          </div>`;}).join("")}`;
    }).join("") || `<div class="empty" style="margin-top:14px">No team OKRs yet. That's the conversation to have.</div>`}`;

  // ── wiring ──────────────────────────────────────────────────
  el.querySelectorAll("[data-intro]").forEach(b=>b.onclick=()=>{ localStorage.setItem("jvMineIntro","1"); V.mine(); });
  el.querySelectorAll("[data-mytog]").forEach(h=>h.onclick=()=>{ mineTasksOpen=!mineTasksOpen; V.mine(); });
  el.querySelectorAll("[data-krtog]").forEach(h=>h.onclick=()=>{
    mineKr = mineKr===h.dataset.krtog ? null : h.dataset.krtog; mineNotesOpen=null; V.mine(); });
  el.querySelectorAll(".wobj-body input, .wobj-body .addrow, .wobj-body select").forEach(n=>n.addEventListener("click",e=>e.stopPropagation()));
  el.querySelectorAll("[data-seen]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.krto) mineKr=b.dataset.krto;
    await patch(T.tasks,[{id:b.dataset.seen, fields:{Seen:true}}]);
    await reload("tasks"); toast("It's on your page now"); V.mine(); });

  const finish = async id => {
    await patch(T.tasks,[{id, fields:{Status:"Done","Done date":iso(TODAY),Progress:1}}]);
    await reload("tasks"); toast("Done — it's in the record"); V.mine();
  };
  el.querySelectorAll("input[data-mtask]").forEach(c=>c.onchange=()=>finish(c.dataset.mtask));
  el.querySelectorAll("input[data-mundo]").forEach(c=>c.onchange=async()=>{
    await patch(T.tasks,[{id:c.dataset.mundo, fields:{Status:"Open","Done date":null}}]);
    await reload("tasks"); toast("Back on the plate"); V.mine(); });

  el.querySelectorAll("input[data-tprog]").forEach(s=>{
    s.oninput = ()=>{ s.style.setProperty("--p", s.value+"%"); const w=document.getElementById("tw-"+s.dataset.tprog); if(w) w.textContent=PROG_WORD(+s.value); };
    s.onchange = async()=>{
      await patch(T.tasks,[{id:s.dataset.tprog, fields:{Progress:+s.value/100}}]);
      await reload("tasks"); V.mine();
    };
  });
  el.querySelectorAll("[data-towner]").forEach(s=>s.onchange=async()=>{
    const who=s.value;
    await patch(T.tasks,[{id:s.dataset.towner, fields:{Owner:[who], Seen: who===L.id}}]);
    await reload("tasks"); toast(who===L.id?"Yours now":`Handed to ${nm("people",who).split(" ")[0]} — they'll be asked on their page`); V.mine(); });
  el.querySelectorAll("input[data-tdue]").forEach(d=>{ if(d.id==="mnd") return; d.onchange=async()=>{
    await patch(T.tasks,[{id:d.dataset.tdue, fields:{"Due date":d.value||null}}]);
    await reload("tasks"); toast(d.value?"Due "+fmt(d.value):"Date cleared"); V.mine(); }; });
  el.querySelectorAll("[data-tdel]").forEach(x=>x.onclick=async()=>{
    if(!confirm(`Delete "${nm("tasks",x.dataset.tdel)}"?`)) return;
    try{ await del(T.tasks,[x.dataset.tdel]); await reload("tasks"); toast("Gone"); V.mine(); }
    catch(e){ toast(e.message,true); }
  });
  el.querySelectorAll("[data-morenotes]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.morenotes; mineNotesFull.has(k)?mineNotesFull.delete(k):mineNotesFull.add(k); V.mine(); });
  el.querySelectorAll("[data-notes]").forEach(n=>n.onclick=()=>{
    mineNotesOpen = mineNotesOpen===n.dataset.notes ? null : n.dataset.notes; V.mine(); });

  const noteStamp = txt => {
    const now=new Date();
    return `${iso(now)} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")} · ${f(L,"Name")} — ${txt}`;
  };
  const saveNote = async (tid, inp) => {
    const txt=(inp.value||"").trim(); if(!txt) return;
    const prev=f(rec("tasks",tid),"Notes")||"";
    await patch(T.tasks,[{id:tid, fields:{Notes: prev?prev+"\n"+noteStamp(txt):noteStamp(txt)}}]);
    await reload("tasks"); toast("Noted"); V.mine();
  };
  el.querySelectorAll("[data-noteadd]").forEach(b=>{
    const inp=document.getElementById("nnt-"+b.dataset.noteadd);
    b.onclick=()=>saveNote(b.dataset.noteadd, inp);
    if(inp) inp.addEventListener("keydown",e=>{ if(e.key==="Enter") saveNote(b.dataset.noteadd, inp); });
  });

  el.querySelectorAll("[data-krnote]").forEach(b=>{
    const inp=document.getElementById("knt");
    const saveKr = async () => {
      const txt=(inp.value||"").trim(); if(!txt) return;
      const prev=f(rec("krs",b.dataset.krnote),"Notes")||"";
      await patch(T.krs,[{id:b.dataset.krnote, fields:{Notes: prev?prev+"\n"+noteStamp(txt):noteStamp(txt)}}]);
      await reload("krs"); toast("Noted — the team will see it"); V.mine();
    };
    b.onclick=saveKr;
    if(inp) inp.addEventListener("keydown",e=>{ if(e.key==="Enter") saveKr(); });
  });

  const addTask = async () => {
    const inp=document.getElementById("mnt"), title=inp.value.trim();
    if(!title) return;
    const who=document.getElementById("mnw").value;
    await post(T.tasks,[{fields:{Title:title, Status:"Open", "Key Result":[mineKr], Owner:[who],
      "Due date":document.getElementById("mnd").value||null, Seen: who===L.id}}]);
    await reload("tasks"); toast(who===L.id?"On your plate":`${nm("people",who).split(" ")[0]} will be asked on their page`); V.mine();
  };
  const madd=document.getElementById("madd");
  if(madd){ madd.onclick=addTask;
    document.getElementById("mnt").addEventListener("keydown",e=>{ if(e.key==="Enter") addTask(); }); }
  const dt=el.querySelector("[data-donetog]");
  if(dt) dt.onclick=()=>{ mineDoneOpen=!mineDoneOpen; V.mine(); };
};

/* ============================ TEAM — the rhythm page ============================ */
let TC = null, seasonOpen = false;   // team check-in in progress · season accordion

const teamUnit = () => rec("units", one(ME,"Org Unit"));
const teamObjectives = () => { const u = teamUnit(); return u ? live(DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year" && one(o,"Org Unit")===u.id)) : []; };
const teamCycle = () => {
  const cyc = teamObjectives().map(o=>rec("cycles", one(o,"Cycle"))).filter(Boolean);
  return cyc.find(c=>f(c,"Type")==="Trimester") || cyc[0] || null;
};

V.team = () => {
  const el = document.getElementById("view");
  const u = teamUnit();
  if(!u){ el.innerHTML = `<div class="head"><div><h1>Team</h1><div class="sub">You're not on a team yet — ask ${nm("people", null)||"Mike or Mel"} to put you on one in Org.</div></div></div>`; return; }
  const objs = teamObjectives();
  const cycle = teamCycle();
  const mates = myTeammates(ME.id);
  const leaderName = nm("people", one(u,"Leader")) || "";
  const mid = f(u,"Midterm date"), ret = f(u,"Retro date");
  const cs = cycle && f(cycle,"Start"), ce = cycle && f(cycle,"End");
  const canSetDates = iAmLeader();

  // where are we in the season?
  const posOf = d => { if(!cs||!ce||!d) return null;
    const a=new Date(cs).getTime(), b=new Date(ce).getTime(), x=new Date(d).getTime();
    if(b<=a) return null; return Math.max(0, Math.min(100, Math.round((x-a)/(b-a)*100))); };
  const todayPos = posOf(iso(TODAY)), midPos = posOf(mid), retPos = posOf(ret);

  const meetingCard = (label, val, field, past) => `
    <div class="meet ${past?"past":""}">
      <div class="cap">${label}</div>
      <div class="meet-date">${val ? fmt(val)+" "+new Date(val).getFullYear() : "not set yet"}</div>
      ${canSetDates ? `<input type="date" class="tdue" data-udate="${field}" value="${val||""}" title="Set the date"/>`
        : (val ? "" : `<div class="cap">${leaderName?esc(leaderName)+" sets this":"your leader sets this"}</div>`)}
    </div>`;

  const seasonBar = cs&&ce ? `<div class="season-bar">
      <span class="season-fill" style="width:${todayPos??0}%"></span>
      ${midPos!==null?`<span class="season-dot" style="left:${midPos}%"></span><b class="hlabel" style="left:${midPos}%;top:-19px">midterm${mid?" · "+esc(fmt(mid)):""}</b>`:""}
      ${retPos!==null?`<span class="season-dot" style="left:${retPos}%"></span><b class="hlabel" style="left:${retPos}%;top:-19px">retro${ret?" · "+esc(fmt(ret)):""}</b>`:""}
      ${todayPos!==null?`<span class="season-today" style="left:${todayPos}%" title="Today"></span>`:""}
    </div>` : "";
  const openReviews = DB.reviews.filter(r=>f(r,"Status")!=="Closed" && objs.some(o=>o.id===one(r,"Objective")));

  el.innerHTML = `
    <div class="head"><div><h1>${esc(f(u,"Name"))}</h1>
      <div class="sub">${mates.length} of us${leaderName?` · led by ${esc(leaderName)}`:""}${cycle?` · ${esc(f(cycle,"Name"))}`:""} · one team, one rhythm.</div></div></div>

    <div class="wobj ${seasonOpen?"open":""}">
      <div class="wobj-top" data-seasontog>
        <span class="chev">▶</span>
        <div class="wobj-main"><div class="wobj-title">The season</div>
          ${seasonBar?`<div class="season" style="margin:26px 6px 4px 0">${seasonBar}</div>`:""}</div>
        ${!mid&&!ret?`<div class="wobj-side"><span class="pill p-none">meeting dates not set</span></div>`:""}
      </div>
      <div class="wobj-body">${seasonOpen ? `
        ${cs&&ce ? `<div class="cap">${fmt(cs)} to ${fmt(ce)} — the darker line is how far we are.</div>`
          : `<div class="cap">This cycle has no start and end dates yet — once it does, the season line appears here.</div>`}
        <div class="meets">
          ${meetingCard("Midterm review", mid, "Midterm date", mid && mid<iso(TODAY))}
          ${meetingCard("Retrospective", ret, "Retro date", ret && ret<iso(TODAY))}
        </div>` : ""}
      </div>
    </div>

    <div class="card">
      <h2>This week's meeting</h2>
      <div class="cap">One sitting, every key result — where is each one, honestly?</div>
      ${objs.map(o=>`<div class="row"><div><strong>${esc(f(o,"Title"))}</strong>
          <div class="why">${objKrs(o.id).length} key result${objKrs(o.id).length===1?"":"s"} · last check-in ${staleDays(o)===999?"never":staleDays(o)+"d ago"}</div></div>
        <span class="pill ${cls(f(o,"Confidence")||"Not started")}">${esc(f(o,"Confidence")||"Not started")}</span></div>`).join("")
        || `<div class="empty">No objectives on this team yet.</div>`}
      ${objs.length?`<div style="margin-top:12px"><button class="btn jv" id="teamci">Run this week's check-in →</button></div>`:""}
    </div>

    ${openReviews.length ? `<div class="card">
      <h2>Before the next review meeting</h2>
      ${openReviews.map(r=>{
        const answered = mates.map(p=>({p, done: DB.responses.some(x=>lnk(x,"Review").includes(r.id) && lnk(x,"Person").includes(p.id))}));
        return `<div class="row"><div><strong>${esc(f(r,"Type")||"Review")} — ${esc(nm("objectives",one(r,"Objective")))}</strong>
          <div class="why">${answered.filter(a=>a.done).length} of ${mates.length} answered: ${answered.map(a=>`${a.done?"✓":"·"} ${esc((f(a.p,"Name")||"").split(" ")[0])}`).join("  ")}</div></div>
          <button class="btn ghost" data-rev="${r.id}">${answered.find(a=>a.p.id===ME.id&&a.done)?"Read":"Answer"} →</button></div>`;}).join("")}
    </div>` : ""}

    <div class="card">
      <h2>The record</h2><div class="cap">What this team has said, week by week.</div>
      ${(()=>{ const feed = DB.checkins.filter(c=>objs.some(o=>lnk(c,"Objective").includes(o.id)))
          .sort((a,b)=>new Date(f(b,"Date"))-new Date(f(a,"Date"))).slice(0,12);
        return feed.length ? feed.map(c=>`<div style="border-left:2px solid ${col(f(c,"Confidence"))};padding:4px 0 4px 11px;margin-bottom:11px">
            <div class="mono">${fmt(f(c,"Date"))} · ${esc(nm("people",one(c,"Person")))} · ${esc(f(c,"Confidence")||"")}</div>
            <div style="font-size:13.5px">${esc(f(c,"What moved")||"")}</div></div>`).join("")
          : `<div class="empty">No check-ins yet. The first weekly meeting starts the story.</div>`; })()}
    </div>`;

  el.querySelectorAll("[data-seasontog]").forEach(h=>h.onclick=()=>{ seasonOpen=!seasonOpen; V.team(); });
  el.querySelectorAll("[data-udate]").forEach(d=>d.onchange=async()=>{
    await patch(T.units,[{id:u.id, fields:{[d.dataset.udate]: d.value||null}}]);
    await reload("units"); toast(d.value?`${d.dataset.udate==="Midterm date"?"Midterm":"Retro"} set — ${fmt(d.value)}`:"Date cleared"); V.team();
  });
  const tci = document.getElementById("teamci");
  if(tci) tci.onclick = ()=>{ TC=null; VIEW="teamcheckin"; drawChrome(); render(); scrollTo(0,0); };
  el.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>{ revId=b.dataset.rev; VIEW="reviews"; drawChrome(); render(); scrollTo(0,0); });
};

/* ── the weekly meeting: every key result, one pass ── */
V.teamcheckin = () => {
  const el = document.getElementById("view");
  const u = teamUnit(), objs = teamObjectives();
  if(!u || !objs.length){ VIEW="team"; return V.team(); }
  if(!TC){
    TC = {vals:{}, conf:{}, moved:{}, block:{}};
    objs.forEach(o=>objKrs(o.id).forEach(k=>{ TC.vals[k.id]=f(k,"Current value")??0; TC.conf[k.id]=f(k,"Confidence")||"On track"; }));
  }
  const worst = list => list.includes("Off track") ? "Off track" : list.includes("At risk") ? "At risk" : "On track";

  el.innerHTML = `
    <div class="head"><div><h1>This week's check-in</h1>
      <div class="sub">${esc(f(u,"Name"))} · ${fmt(iso(TODAY))} · go around the room — every number gets a look, every voice gets a say.</div></div>
      <div class="filters"><button class="btn ghost" id="tcback">← Team</button></div></div>
    ${objs.map(o=>{
      const krs = objKrs(o.id);
      const lastCi = objCheckins(o.id)[0];
      const since = lastCi ? f(lastCi,"Date") : iso(new Date(TODAY.getTime()-7*864e5));
      return `<div class="card">
        <h2>${esc(f(o,"Title"))}</h2>
        ${lastCi?`<div class="cap" style="margin:2px 0 4px">Last meeting · ${fmt(f(lastCi,"Date"))} · ${esc(f(lastCi,"Confidence")||"")}</div>`:""}
        ${krs.map(k=>{
          const prev = f(k,"Current value")??0, unit = f(k,"Unit")||"";
          const ts = krTasks(k.id);
          const open = ts.filter(t=>f(t,"Status")!=="Done");
          const doneSince = ts.filter(t=>f(t,"Status")==="Done" && (f(t,"Done date")||"")>=since);
          const notesSince = [];
          (f(k,"Notes")||"").split("\n").filter(x=>x.slice(0,10)>=since).forEach(l=>notesSince.push(l));
          ts.forEach(t=>(f(t,"Notes")||"").split("\n").filter(x=>x.slice(0,10)>=since).forEach(l=>notesSince.push(l)));
          return `<div class="krwin">
            <div class="tckr" style="border-bottom:none;padding:0 0 2px">
              <div style="flex:1"><div style="font-size:13.5px;font-weight:650">${esc(f(k,"Title"))}</div>
                <div class="mono" id="tcd-${k.id}">was ${prev}${esc(unit)} last time</div></div>
              <input type="number" class="tcnum" data-tckr="${k.id}" data-prev="${prev}" data-unit="${esc(unit)}" value="${TC.vals[k.id]}"/>
              <span class="mono" style="width:52px">/ ${f(k,"Target value")??0}${esc(unit)}</span>
            </div>
            ${open.length||doneSince.length||notesSince.length ? `<div class="since" style="margin:8px 0 10px">
              ${open.length?`<div class="cap">Being worked on</div>${open.map(t=>`<div style="font-size:12.5px;padding:2px 0">• ${esc(f(t,"Title"))} <span class="mono" style="color:var(--ink-3)">${esc((nm("people",one(t,"Owner"))||"").split(" ")[0])} · ${PROG_WORD(pct(f(t,"Progress")))}${isLate(t)?" · overdue":""}</span></div>`).join("")}`:""}
              ${doneSince.length?`<div class="cap" style="margin-top:6px">Finished this week</div>${doneSince.map(t=>`<div style="font-size:12.5px;padding:2px 0">✓ ${esc(f(t,"Title"))} <span class="mono" style="color:var(--ink-3)">${esc((nm("people",one(t,"Owner"))||"").split(" ")[0])} · ${fmt(f(t,"Done date"))}</span></div>`).join("")}`:""}
              ${notesSince.length?`<div class="cap" style="margin-top:6px">Talked about</div>${notesSince.sort().slice(-6).map(l=>`<div class="noteline">${fmtNote(l)}</div>`).join("")}`:""}
            </div>`:`<div class="cap" style="margin:6px 0 8px">Nothing logged on this one since last meeting.</div>`}
            <div class="addrow" style="margin:6px 0 4px"><input type="text" data-tcmoved="${k.id}" placeholder="What moved on this one — a sentence is enough" value="${esc(TC.moved[k.id]||"")}"/></div>
            <div class="addrow" style="margin:0 0 10px"><input type="text" data-tcblock="${k.id}" placeholder="What's in the way, if anything" value="${esc(TC.block[k.id]||"")}"/></div>
            <div class="confs">${["On track","At risk","Off track"].map(c=>
              `<button class="conf ${c==="On track"?"on":c==="At risk"?"risk":"off"}" data-tcconf="${k.id}" data-c="${c}" aria-pressed="${TC.conf[k.id]===c}">${c}</button>`).join("")}</div>
          </div>`;}).join("") || `<div class="cap">No key results here yet.</div>`}
      </div>`;}).join("")}
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn jv" id="tcsend">Log the team check-in</button>
      <span class="cap">One record per objective, signed by you for the team.</span>
    </div>`;

  document.getElementById("tcback").onclick = ()=>{ VIEW="team"; drawChrome(); render(); scrollTo(0,0); };
  el.querySelectorAll("input[data-tckr]").forEach(i=>i.oninput=()=>{
    TC.vals[i.dataset.tckr] = i.value;
    const d = +i.value - +i.dataset.prev, lab = document.getElementById("tcd-"+i.dataset.tckr);
    lab.textContent = d>0?`+${Math.round(d*10)/10}${i.dataset.unit} since last time`:d<0?`${Math.round(d*10)/10}${i.dataset.unit} since last time`:`was ${i.dataset.prev}${i.dataset.unit} last time`;
    lab.style.color = d>0?"var(--moss)":d<0?"var(--clay)":"var(--ink-2)";
  });
  el.querySelectorAll("[data-tcconf]").forEach(b=>b.onclick=()=>{
    TC.conf[b.dataset.tcconf]=b.dataset.c;
    el.querySelectorAll(`[data-tcconf="${b.dataset.tcconf}"]`).forEach(x=>x.setAttribute("aria-pressed", x===b));
  });
  el.querySelectorAll("[data-tcmoved]").forEach(i=>i.oninput=()=>TC.moved[i.dataset.tcmoved]=i.value);
  el.querySelectorAll("[data-tcblock]").forEach(i=>i.oninput=()=>TC.block[i.dataset.tcblock]=i.value);
  document.getElementById("tcsend").onclick = async () => {
    const btn=document.getElementById("tcsend"); btn.disabled=true; btn.textContent="Saving…";
    try{
      for(const o of objs){
        const krs = objKrs(o.id);
        if(krs.length) await patch(T.krs, krs.map(k=>{
          const v = +TC.vals[k.id]||0, fields = {"Current value": v, Confidence: TC.conf[k.id]};
          if(v !== (f(k,"Current value")??0)) fields.History = ((f(k,"History")||"")+"\n"+iso(TODAY)+" · "+v).trim();
          return {id:k.id, fields};
        }));
        const oc = worst(krs.map(k=>TC.conf[k.id]));
        const tag = k => { const t=f(k,"Title")||""; return t.includes(":") ? t.split(":")[0] : t.slice(0,30); };
        const movedTxt = krs.map(k=>{const m=(TC.moved[k.id]||"").trim(); return m?`${tag(k)}: ${m}`:null;}).filter(Boolean).join("\n");
        const blockTxt = krs.map(k=>{const m=(TC.block[k.id]||"").trim(); return m?`${tag(k)}: ${m}`:null;}).filter(Boolean).join("\n");
        await post(T.checkins,[{fields:{Summary:`${f(o,"Title")} — ${fmt(iso(TODAY))}`, Date: iso(TODAY),
          "What moved": movedTxt, Blockers: blockTxt,
          Confidence: oc, Objective:[o.id], Person:[ME.id]}}]);
        await patch(T.objectives,[{id:o.id, fields:{Confidence: oc}}]);
      }
      await Promise.all([reload("krs"), reload("checkins"), reload("objectives")]);
      TC=null; toast("Logged — the week is on the record"); VIEW="team"; drawChrome(); render(); scrollTo(0,0);
    }catch(e){ btn.disabled=false; btn.textContent="Log the team check-in"; }
  };
};

/* ============================ CHECK-IN WORKSPACE ============================ */
let ciObj = null, ciVals = {}, ciConf = "On track";
V.checkin = () => {
  const mine = DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year");
  if(!ciObj) ciObj = (ownedBy(ME.id)[0] || mine[0])?.id;
  const o = rec("objectives", ciObj);
  if(!o){ document.getElementById("view").innerHTML = `<div class="card empty">No objectives to check in on yet.</div>`; return; }
  const krs = objKrs(o.id);

  document.querySelectorAll("input[data-kr]").forEach(s=>s.oninput=()=>{
    const k = rec("krs", s.dataset.kr), v = +s.value, prev = f(k,"Current value")??0, u = f(k,"Unit")||"";

async function sendCheckin(o, krs){
  const moved = document.getElementById("ciMoved").value.trim();
  const before = {}; krs.forEach(k=>before[k.id] = f(k,"Current value") ?? 0);
  const btn = document.getElementById("ciSend"); btn.disabled = true; btn.textContent = "Saving…";
  try{
    if(krs.length) await patch(T.krs, krs.map(k=>{
      const v = ciVals[k.id], fields = {"Current value": v};
      if(v !== (f(k,"Current value")??0)) fields.History = ((f(k,"History")||"")+"\n"+iso(TODAY)+" · "+v).trim();
      return {id:k.id, fields};
    }));
    await post(T.checkins, [{fields:{
      Summary: `${f(o,"Title")} — ${fmt(TODAY)}`, Date: iso(TODAY),
      "What moved": moved, Blockers: document.getElementById("ciBlock").value.trim(),
      Confidence: ciConf, Objective:[o.id], Person:[ME.id]}}]);
    await patch(T.objectives, [{id:o.id, fields:{Confidence: ciConf}}]);
    await Promise.all([reload("krs"), reload("checkins"), reload("objectives")]);
    ripple(o, krs, before);
  }catch(e){ toast("Couldn't save: "+e.message, true); btn.disabled=false; btn.textContent="Log check-in"; }
}

function ripple(o, krs, before){
  const jv = ladderKr(o);
  const gained = krs.reduce((s,k)=>s + ((ciVals[k.id]??0) - before[k.id]), 0);
  const box = document.getElementById("ripple");
  document.querySelectorAll(".wrap .card, #ciSend, .head select").forEach(e=>e.classList.add("hidden"));
  box.classList.remove("hidden");
  box.innerHTML = `
    <div class="eyebrow">Check-in logged · ${fmt(TODAY)}</div>
    <div class="headline" id="hl">${gained>0?"You moved it.":"Logged. Thank you for being honest."}</div>
    <div class="card">
      ${krs.map((k,i)=>{
        const now = ciVals[k.id]??0, p = pct(f(k,"Target value") ? (now - (f(k,"Start value")||0))/((f(k,"Target value")||1)-(f(k,"Start value")||0)) : 0);
        return `<div class="rung" id="r${i}">
          <div style="display:flex;justify-content:space-between;gap:10px"><span style="font-weight:600;font-size:13px">${esc(f(k,"Title"))}</span>
            <span class="mono">${before[k.id]} → <b style="color:var(--ink)">${now}</b> / ${f(k,"Target value")??0}</span></div>
          <div class="prog"><span style="width:0;background:var(--moss)" data-w="${p}"></span></div>
        </div>`;}).join("")}
      <div style="color:#B8C2CB;margin:0 0 8px 6px">↳</div>
      <div class="rung" id="ro">
        <div style="display:flex;justify-content:space-between"><span style="font-weight:600;font-size:13px">${esc(f(o,"Title"))}</span>
          <span class="mono">${pct(objProgress(o))}%</span></div>
        <div class="prog"><span style="width:0;background:var(--moss)" data-w="${pct(objProgress(o))}"></span></div>
      </div>
      ${jv?`<div style="color:#B8C2CB;margin:0 0 8px 6px">↳</div>
      <div class="rung" id="rj"><div class="jvbox">
        <div class="eyebrow">JV five-year key result</div>
        <div style="display:flex;justify-content:space-between;margin-top:4px">
          <span style="font-weight:600;font-size:13px">${esc(f(jv,"Title"))}</span>
          <span class="mono">${f(jv,"Current value")??0} / ${f(jv,"Target value")??0}</span></div>
        <div class="prog"><span style="width:0;background:var(--indigo)" data-w="${pct(f(jv,"Progress"))}"></span></div>
        <div class="hint">Your number feeds this. Update the JV key result at the leadership level when the roll-up is agreed.</div>
      </div></div>`:""}
    </div>
    <button class="btn wide" onclick="ciVals={};render();">Back to my objectives</button>`;
  const rungs = [...box.querySelectorAll(".rung")];
  setTimeout(()=>document.getElementById("hl").classList.add("show"), 120);
  rungs.forEach((r,i)=>setTimeout(()=>{
    r.classList.add("show");
    r.querySelectorAll(".prog span").forEach(s=>s.style.width = s.dataset.w+"%");
  }, 400 + i*750));
  toast("Check-in saved");
}

function teamFor(objId){
  const o = rec("objectives", objId); if(!o) return DB.people;
  const u = one(o,"Org Unit");
  const t = u ? DB.people.filter(p=>unitTree(u).includes(one(p,"Org Unit")) && f(p,"Active")!==false) : [];
  return t.length ? t : DB.people.filter(p=>areaName(p)===areaName(o) && f(p,"Active")!==false);
}
function newReviewForm(){
  const objs = DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year");
  return `<div class="grid2">
    <div class="field"><label>Objective</label><select id="nrObj">${objs.map(o=>`<option value="${o.id}" ${o.id===rvNewObj?"selected":""}>${esc(areaName(o)||"")} — ${esc(f(o,"Title"))}</option>`).join("")}</select></div>

    <div class="field"><label>Cycle</label><select id="nrCyc">${DB.cycles.map(c=>`<option value="${c.id}">${esc(f(c,"Name"))}</option>`).join("")}</select></div>

function wireNewReview(){
  const b = document.getElementById("nrGo"); if(!b) return;
  b.onclick = async()=>{
    const o = document.getElementById("nrObj").value, ty = document.getElementById("nrType").value;
    const j = await post(T.reviews, [{fields:{ Name:`${nm("objectives",o)} — ${ty}`, Type:ty,
      Objective:[o], Cycle:[document.getElementById("nrCyc").value],
      "Meeting date": document.getElementById("nrDate").value || null, Status:"Collecting responses"}}]);
    await reload("reviews"); revId = j.records[0].id; toast("Review created"); render();
  };
}
function facilitator(R, set, resp){
  const scores = resp.map(r=>f(r,"Confidence 1-10")).filter(Boolean);
  const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : "—";
  const spread = scores.length ? Math.max(...scores)-Math.min(...scores) : 0;
  const bars = [...Array(10)].map((_,i)=>{
    const n = scores.filter(s=>s===i+1).length;
    return `<div class="${n?"hit":""}" style="height:${n?12+n*15:5}px"></div>`;}).join("");
  const block = q => `<div class="card"><h3>${esc(q.q)}</h3>
    ${resp.map(r=>{ const a=f(r,q.k); return a ? `<div class="ans"><div class="who">${esc(nm("people",one(r,"Person")))}</div><p>${esc(a)}</p></div>`:"";}).join("") || `<div class="empty">No answers.</div>`}</div>`;
  return `
    ${scores.length?`<div class="card"><h3>Are we going to hit this?</h3>
      <div class="spread">${bars}</div>
      <div class="mono" style="display:flex;justify-content:space-between"><span>No chance</span><span>Certain</span></div>
      <div style="margin-top:8px"><strong>Average ${avg}/10 — spread of ${spread} points.</strong></div>
      <div class="hint">${spread>=3?"That gap is the meeting. Someone believes something the others don't — start there, don't average it away.":"The team is aligned on this one."}</div>
    </div>`:""}
    ${set.filter(q=>q.t!=="scale").map(block).join("")}
    <div class="card"><h3>Record the outcome</h3>
      <div class="cap">What the team decided goes on the objective, not in a meeting note.</div>
      <button class="btn" onclick="selObj='${one(R,"Objective")}';VIEW='objective';drawChrome();render();scrollTo(0,0)">Record a decision on this objective →</button>
    </div>`;
}

  document.getElementById("obacklist").onclick = ()=>{ openObj=selObj; VIEW="okrs"; drawChrome(); render(); scrollTo(0,0); };

    try{

      await Promise.all([reload("krs"), reload("tasks")]);
      toast("Key result deleted"); render();

  document.getElementById("krGo").onclick = async()=>{
    const t = document.getElementById("krT").value.trim(); if(!t) return;

    const c = document.getElementById("krC").value, x = document.getElementById("krX").value;
    await post(T.krs, [{fields:{Title:t, Unit:document.getElementById("krU").value, Type:"Number",
      "Start value":+document.getElementById("krS").value, "Current value":+document.getElementById("krS").value,
      "Target value":g, "Original target":g,
      ...(c!==""?{Commit:+c}:{}), ...(x!==""?{Stretch:+x}:{}),
      Confidence:"Not started", Objective:[o.id], Owner:lnk(o,"Owner")}}]);

  };
  document.getElementById("dGo").onclick = async()=>{
    const what = document.getElementById("dWhat").value.trim(), why = document.getElementById("dWhy").value.trim();
    if(!what || !why) return toast("A decision needs both what and why", true);
    const krId = document.getElementById("dKr").value, tgt = document.getElementById("dTgt").value;
    await post(T.decisions, [{fields:{Decision:what, Type:document.getElementById("dType").value,
      From:document.getElementById("dFrom").value, To:document.getElementById("dTo").value, Why:why,
      Source:document.getElementById("dSrc").value, "Decided by":document.getElementById("dBy").value,

    toast("Decision recorded"); render();

  document.querySelectorAll("[data-reply]").forEach(b=>b.onclick=async()=>{
    const txt = prompt("Your reply — the thing that makes them write a second check-in:");

    await reload("checkins"); toast("Replied"); render();
  });

function wireObjForm(){
  const b = document.getElementById("oGo"); if(!b) return;
  const al = document.getElementById("oAl");
  if(al) al.onchange = ()=>{
    document.getElementById("oPBox").classList.toggle("hidden", al.value!==ALIGN.LADDER);
    document.getElementById("oJBox").classList.toggle("hidden", al.value!==ALIGN.SUPPORT);
  };
  wireSoundingBoard();
  b.onclick = async()=>{
    const t = document.getElementById("oT").value.trim(); if(!t) return toast("Give it a title", true);
    const uid = document.getElementById("oU").value;
    const u = rec("units", uid);
    if(!u) return toast("Add an org unit first, under Org", true);
    const align = document.getElementById("oAl").value;
    const j = await post(T.objectives, [{fields:{Title:t,
      Scope: f(u,"Type")==="Department" ? "Team" : f(u,"Type"),   // Scope is legacy; the unit is the truth
      "Org Unit":[uid], Area:f(u,"Name"), Alignment: align,
      Confidence:"Not started", Status:"Active",
      Owner:[document.getElementById("oO").value], Cycle:[document.getElementById("oC").value],
      ...(align===ALIGN.LADDER ? {"Parent Key Result":[document.getElementById("oP").value]} : {}),
      ...(align===ALIGN.SUPPORT ? {"Supports JV objective":[document.getElementById("oJ").value]} : {})}}]);

  };
}

/* ---- The Sounding Board: think out loud, it builds on what you write ---- */
let sbQuestions = [];
async function sbCall(payload){
  const r = await fetch(`${API}?action=sounding`, {method:"POST", headers:authHeaders({"Content-Type":"application/json"}), body:JSON.stringify(payload)});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error||"Sounding Board unavailable");
  return j.result;
}
function wireSoundingBoard(){
  const toggle = document.getElementById("sbToggle"); if(!toggle) return;
  toggle.onclick = ()=>{
    const body = document.getElementById("sbBody");
    body.classList.toggle("hidden");
    toggle.textContent = body.classList.contains("hidden") ? "Use it" : "Hide";
  };
  const go = document.getElementById("sbGo");
  go.onclick = async()=>{
    const objective = document.getElementById("sbObj").value.trim();
    if(!objective) return toast("Write the objective first", true);
    const out = document.getElementById("sbOut");
    out.innerHTML = `<div class="sb-load"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Reading it the way a ministry mind would…</div>`;
    go.disabled = true;
    try{
      const r = await sbCall({round:1, objective, keyResults:[]});
      sbQuestions = r.questions||[];
      renderSbRound1(objective, r);
    }catch(e){ out.innerHTML = `<div class="sb-err">${esc(e.message)}</div>`; }
    go.disabled = false;
  };
}
function renderSbRound1(objective, r){
  const vcls = {building:"v-build",mixed:"v-mixed",behavioral:"v-good"}[r.verdict]||"v-mixed";
  const vlab = {building:"A building season — real work",mixed:"Worth pointing further",behavioral:"This already names change"}[r.verdict]||"Let's look";
  let h = `<div class="sb-verdict ${vcls}">${vlab}</div><div class="sb-read">${esc(r.read)}</div>`;
  if(r.horizon) h += `<div class="sb-horizon"><span class="lab">↗ Leads toward</span> ${esc(r.horizon)}</div>`;
  h += `<div class="cap" style="margin:12px 0 4px">Write what comes — even aspirationally. It reads what you write.</div>`;
  (r.questions||[]).forEach((q,i)=>{
    h += `<div class="sb-q">${esc(q)}</div><textarea class="sb-ans" id="sbA${i}" rows="2" placeholder="Your thinking…"></textarea>`;
  });
  h += `<button class="btn" id="sbGo2" type="button">It reads what I wrote →</button>`;
  document.getElementById("sbOut").innerHTML = h;
  document.getElementById("sbGo2").onclick = async()=>{
    const answers = sbQuestions.map((q,i)=>({q, a:(document.getElementById("sbA"+i)?.value||"").trim()}));
    if(!answers.some(x=>x.a)) return toast("Write a little under at least one question", true);
    const btn = document.getElementById("sbGo2"); btn.disabled=true;
    document.getElementById("sbOut").insertAdjacentHTML("beforeend", `<div class="sb-load" id="sbL"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Reading what you wrote…</div>`);
    try{
      const r2 = await sbCall({round:2, objective, keyResults:[], answers});
      document.getElementById("sbL")?.remove();
      renderSbRound2(r2);
    }catch(e){ document.getElementById("sbL")?.remove(); document.getElementById("sbOut").insertAdjacentHTML("beforeend", `<div class="sb-err">${esc(e.message)}</div>`); }
  };
}
function renderSbRound2(r){
  let h = `<div class="sb-bless"><span class="lab">✦ Building on what you wrote</span>${esc(r.blessing)}</div>`;
  if(r.horizon) h += `<div class="sb-horizon"><span class="lab">↗ Leads toward</span> ${esc(r.horizon)}</div>`;
  if(r.objective){
    h += `<div class="sb-rw"><span class="lab">Your objective, sharpened</span><div class="txt" id="sbRW">${esc(r.objective)}</div>`;
    if((r.rewrittenKRs||[]).length) h += `<span class="lab" style="margin-top:10px;display:block">Key results to consider</span>${r.rewrittenKRs.map(k=>`<div class="txt" style="margin-top:4px">• ${esc(k)}</div>`).join("")}`;
    h += `<button class="btn accent" id="sbUse" type="button" style="margin-top:12px">Use this as my title</button></div>`;
  }
  h += `<div class="cap" style="margin-top:10px">This came from your words. Yours to keep shaping — or push back and write more.</div>`;
  document.getElementById("sbOut").insertAdjacentHTML("beforeend", h);
  const use = document.getElementById("sbUse");
  if(use) use.onclick = ()=>{
    document.getElementById("oT").value = r.objective;
    document.getElementById("sbObj").scrollIntoView({behavior:"smooth",block:"center"});
    toast("Dropped into the title — edit it freely");
  };
}

       + (f(p,"Overdue for a 1:1") ? 3 : 0)
       + (objs.length===0 && ["Country leader","Division leader","Team leader"].includes(f(p,"Role")) ? 4 : 0);
};

function buildReport(){
  const kind = document.getElementById("rpKind").value;
  const objs = DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year");
  const off = objs.filter(o=>f(o,"Confidence")==="Off track");
  const risk = objs.filter(o=>f(o,"Confidence")==="At risk");
  const on = objs.filter(o=>f(o,"Confidence")==="On track");
  const stale = objs.filter(isStale);
  const late = objs.flatMap(o=>objTasks(o.id)).filter(isLate).length;
  const orphanKrs = jvKrs().filter(k=>!childObjectives(k.id).length);
  const line = o => `• ${areaName(o)||""} — ${f(o,"Title")} (${pct(objProgress(o))}%)`;
  let out;

  if(kind==="Leadership summary"){
    out = `JV OKR — ${fmt(TODAY)}

WHERE WE ARE
${on.length} on track · ${risk.length} at risk · ${off.length} off track · ${late} overdue tasks.
${objs.length?Math.round(objs.filter(o=>staleDays(o)<=7).length/objs.length*100):0}% of objectives were checked in this week.

NEEDS A DECISION
${off.map(o=>`${line(o)} — off track, ${staleDays(o)}d since last check-in.`).join("\n") || "• Nothing off track."}

WATCH LIST
${risk.map(line).join("\n") || "• Nothing at risk."}

GONE QUIET (no check-in in ${STALE}+ days)
${stale.map(o=>`${line(o)} — ${staleDays(o)}d.`).join("\n") || "• None."}

DECISIONS MADE THIS CYCLE
${DB.decisions.slice(-6).map(d=>`• ${f(d,"Decision")} — ${(f(d,"Why")||"").slice(0,110)}`).join("\n") || "• None recorded."}

NOTHING POINTED AT THESE JV KEY RESULTS
${orphanKrs.map(k=>`• ${f(k,"Title")}`).join("\n") || "• Every JV key result has work laddering to it."}

WORK THAT DOESN'T LADDER (${unlanded().length})
${unlanded().map(o=>`• ${areaName(o)} — ${f(o,"Title")} (${supportsJv(o)?"supports JV":"standalone"})`).join("\n") || "• None."}`;
  } else if(kind==="Coaching digest (private)"){
    const pool = DB.people.filter(p=>["Country leader","Division leader","Team leader"].includes(f(p,"Role")));
    out = `COACHING DIGEST — private to the OKR director
${fmt(TODAY)}

OVERDUE FOR A CONVERSATION
${pool.filter(p=>f(p,"Overdue for a 1:1")).map(p=>`• ${f(p,"Name")} (${areaName(p)||""}) — ${f(p,"Days since 1:1")===999?"never talked":f(p,"Days since 1:1")+"d"}, cadence ${cadence(p)}d.`).join("\n") || "• Everyone's current."}

FOLLOW-UPS YOU COMMITTED TO
${DB.notes.filter(n=>f(n,"Next step") && !f(n,"Follow-up done"))
  .map(n=>`• ${nm("people",one(n,"Person"))} — ${f(n,"Next step")}${f(n,"Follow-up due")?` (due ${fmt(f(n,"Follow-up due"))})`:""}`).join("\n") || "• None open."}

NO OBJECTIVES WRITTEN
${pool.filter(p=>!ownedBy(p.id).length).map(p=>`• ${f(p,"Name")} (${areaName(p)||""})`).join("\n") || "• Everyone has objectives."}

RESOURCES SENT BUT NEVER OPENED
${DB.shares.filter(s=>!f(s,"Opened")).map(s=>`• ${nm("people",one(s,"Person"))} — ${nm("resources",one(s,"Resource"))} (sent ${fmt(f(s,"Shared on"))})`).join("\n") || "• None."}`;
  } else {
    out = `To: owners of objectives that have gone quiet
Subject: Quick OKR check-in

Hi —

Your objective hasn't had a check-in in over ${STALE} days, or has tasks past due. Two minutes:

• What moved since last time?
• What's in the way?
• Still on track, at risk, or off track?

[Log check-in →]

Going to: ${stale.map(o=>nm("people",one(o,"Owner"))).filter(Boolean).join(", ") || "nobody — everyone's current"}`;
  }
  document.getElementById("rpOut").textContent = out;
}

/* ============================ ARCHIVE ============================ */
// Finished work doesn't vanish and doesn't clutter. It comes here, by cycle,
// with what it achieved and why it ended the way it did.
let aCycle = "";
V.archive = () => {
  const done = DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year" && ARCHIVED(o));
  const shown = done.filter(o=>!aCycle || lnk(o,"Cycle").includes(aCycle));
  const cycles = DB.cycles.filter(c=>done.some(o=>lnk(o,"Cycle").includes(c.id)));
  const krsArch = DB.krs.filter(KR_ARCHIVED);

  const byCycle = {};
  shown.forEach(o=>{ const c = one(o,"Cycle") || "none"; (byCycle[c] ||= []).push(o); });

  document.getElementById("view").innerHTML = `
    <div class="head">
      <div><h1>Archive</h1>
        <div class="sub">Closed and abandoned work, by cycle. Nothing is deleted — this is what JV tried, and how it went.</div></div>
      <div class="filters">
        <select class="sm" id="ac"><option value="">All cycles</option>
          ${cycles.map(c=>`<option value="${c.id}" ${aCycle===c.id?"selected":""}>${esc(f(c,"Name"))}</option>`).join("")}</select>
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="v">${done.length}</div><div class="l">Archived objectives</div></div>
      <div class="tile b-ok"><div class="v">${done.filter(o=>f(o,"Status")==="Closed").length}</div><div class="l">Closed</div></div>
      <div class="tile b-off"><div class="v">${done.filter(o=>f(o,"Status")==="Abandoned").length}</div><div class="l">Abandoned</div></div>
      <div class="tile b-ind"><div class="v">${krsArch.length}</div><div class="l">Retired key results</div></div>
    </div>

    ${Object.entries(byCycle).map(([cid, list])=>`
      <div style="margin-bottom:22px">
        <div class="eyebrow" style="margin-bottom:8px">${esc(cid==="none" ? "NO CYCLE" : nm("cycles",cid).toUpperCase())}</div>
        ${list.map(o=>{
          const krs = objKrsAll(o.id);
          const decs = DB.decisions.filter(d=>lnk(d,"Objective").includes(o.id));
          const retro = DB.reviews.find(r=>lnk(r,"Objective").includes(o.id) && f(r,"Type")==="Retrospective");
          const hit = krs.length ? Math.round(krs.reduce((a,k)=>a+(f(k,"Progress")||0),0)/krs.length*100) : 0;
          return `<div class="card" style="opacity:.92">
            <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap">
              <div>
                <div class="eyebrow">${esc(areaName(o)||"")} · ${esc(nm("people",one(o,"Owner")))}</div>
                <h2 style="margin-top:3px">${esc(f(o,"Title"))}</h2>
              </div>
              <div style="display:flex;gap:6px;align-items:center">
                <span class="pill ${f(o,"Status")==="Abandoned"?"p-off":"p-none"}">${esc(f(o,"Status"))}</span>
                <button class="btn ghost" style="padding:5px 10px;font-size:12px" data-reopen="${o.id}">Reopen</button>
              </div>
            </div>
            <div class="mono">${alignLine(o)}</div>
            <div class="prog" style="margin-top:8px"><span style="width:${hit}%;background:#93A0AB"></span></div>
            <div class="mono" style="margin-top:4px">finished at ${hit}%</div>

            ${krs.length?`<div style="margin-top:11px">
              ${krs.map(k=>`<div class="task"><span class="t">${esc(f(k,"Title"))}</span>
                <span class="m">${f(k,"Current value")??0} / ${f(k,"Target value")??0}${esc(f(k,"Unit")||"")} · ${pct(f(k,"Progress"))}%</span></div>`).join("")}
            </div>`:""}

            ${decs.length?`<div style="margin-top:12px">
              <div class="eyebrow" style="margin-bottom:6px">Decisions along the way</div>
              ${decs.map(d=>`<div class="dec ${esc(f(d,"Type")||"")}" style="margin-bottom:7px">
                <div class="what" style="margin:0">${esc(f(d,"Decision"))}</div>
                <div class="why2">${esc(f(d,"Why")||"")}</div>
                <div class="mono" style="margin-top:5px">${esc(f(d,"Source")||"")} · ${fmt(f(d,"Date"))}</div>
              </div>`).join("")}
            </div>`:""}

            ${retro && f(retro,"Outcome")?`<div class="next" style="margin-top:10px">
              <strong>From the retro:</strong> ${esc(f(retro,"Outcome"))}</div>`:""}
          </div>`;}).join("")}
      </div>`).join("") || `<div class="card empty">Nothing archived yet. When an objective closes, it lands here.</div>`}

    ${krsArch.length?`<div class="card">
      <h2>Retired key results</h2>
      <div class="cap">Measures that stopped being the right measure. Their objective may still be running.</div>
      ${krsArch.map(k=>`<div class="row">
        <div><strong>${esc(f(k,"Title"))}</strong>
          <div class="mono">${esc(nm("objectives", one(k,"Objective")))} · finished at ${pct(f(k,"Progress"))}%</div></div>
        <button class="btn ghost" style="padding:5px 10px;font-size:12px" data-unarch="${k.id}">Restore</button>
      </div>`).join("")}
    </div>`:""}`;

  document.getElementById("ac").onchange = e=>{aCycle=e.target.value; render();};
  document.querySelectorAll("[data-reopen]").forEach(b=>b.onclick=async()=>{
    await patch(T.objectives, [{id:b.dataset.reopen, fields:{Status:"Active"}}]);
    await reload("objectives"); toast("Reopened — it's back on the dashboard"); render();
  });
  document.querySelectorAll("[data-unarch]").forEach(b=>b.onclick=async()=>{
    await patch(T.krs, [{id:b.dataset.unarch, fields:{Archived:false}}]);
    await reload("krs"); toast("Key result restored"); render();
  });
};

/* ============================ FILE DROP ============================ */
function dropzone(el, cb){
  if(!el) return;
  const inp = document.createElement("input");
  inp.type="file"; inp.multiple=true; inp.style.display="none"; el.appendChild(inp);
  el.onclick = e => { if(e.target!==inp) inp.click(); };
  inp.onchange = () => cb([...inp.files]);
  el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
  el.ondragleave = () => el.classList.remove("over");
  el.ondrop = e => { e.preventDefault(); el.classList.remove("over"); cb([...e.dataTransfer.files]); };
}

/* ============================ SIGN IN ============================ */
// Google verifies who you are. The function decides what you may see.
// Nothing loads until both have happened.

function gate(html){
  document.getElementById("bar").style.display = "none";
  document.getElementById("view").className = "";
  document.getElementById("view").innerHTML =
    `<div class="card" style="max-width:520px;margin:60px auto;text-align:center">
       <img src="icon.svg" width="52" height="52" style="border-radius:12px"/>
       ${html}
     </div>`;
}

function signOut(){
  ID_TOKEN = null;
  try{ sessionStorage.removeItem("jvokr.tok"); }catch(e){}
  google.accounts.id.disableAutoSelect();
  location.reload();
}

async function onGoogle(res){
  ID_TOKEN = res.credential;
  try{ sessionStorage.setItem("jvokr.tok", ID_TOKEN); }catch(e){}
  await start();
}

async function start(){
  const r = await fetch(`${API}?action=me`, {headers: authHeaders()});
  const j = await r.json();
  if(!r.ok){
    ID_TOKEN = null;
    try{ sessionStorage.removeItem("jvokr.tok"); }catch(e){}
    return gate(`<h2 style="margin-top:12px">Can't let you in</h2>
      <div class="cap" style="color:var(--clay)">${esc(j.error||"Sign-in failed")}</div>
      <div id="gbtn" style="display:flex;justify-content:center;margin-top:16px"></div>`)
      || drawButton();
  }
  AUTH = j.me;
  document.getElementById("bar").style.display = "";
  document.getElementById("view").innerHTML = `<div class="card empty">Loading…</div>`;
  try { await load(); }
  catch(e){
    document.getElementById("view").innerHTML =
      `<div class="card" style="max-width:640px"><h2>Couldn't reach the base</h2>
       <div class="cap" style="font-family:'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums;color:var(--clay);font-size:12.5px">${esc(e.message)}</div>
       <div class="hint">Open <code>${API}?action=diag</code> to see what the function can and can't see.</div></div>`;
    return;
  }
  if(AUTH.isNew) welcome();
  else maybeGuide();
}

/* First sign-in: they exist now, but nobody knows where they sit. */
function welcome(){
  const units = unitsSorted(namedUnits());

  // Empty org: don't strand anyone at a dead dropdown.
  if(!units.length){
    document.getElementById("view").innerHTML = `
      <div class="head"><div>
        <h1>Welcome, ${esc(AUTH.name.split(" ")[0])}</h1>
        <div class="sub">You're in.</div>
      </div></div>
      <div class="card" style="max-width:560px">
        ${iAmLeader() ? `
          <h2>Nothing's set up yet — that's your first job</h2>
          <div class="cap">JV's countries, divisions, departments and teams don't exist in here yet.
            Build a couple and everything else has somewhere to live.</div>
          <button class="btn jv wide" id="wOrg">Set up the org →</button>`
        : `
          <h2>Almost ready</h2>
          <div class="cap">The org hasn't been set up yet. Ask Mike or Mel to add your country or division,
            then reload — you'll be able to pick where you sit.</div>`}
      </div>`;
    const org = document.getElementById("wOrg");
    if(org) org.onclick = ()=>{ VIEW="org"; AUTH.isNew=false; drawChrome(); render(); };
    return;
  }

  document.getElementById("view").innerHTML = `
    <div class="head"><div>
      <h1>Welcome, ${esc(AUTH.name.split(" ")[0])}</h1>
      <div class="sub">You're in. One question before you look around.</div>
    </div></div>
    <div class="card" style="max-width:560px">
      <h2>Which unit are you part of?</h2>
      <div class="cap">This is what puts your work on your page — and your name on your team's reviews. You can change it later.</div>
      <div class="field">
        <select id="wArea">
          ${units.map(u=>`<option value="${u.id}">${esc(unitCrumb(u))} · ${esc(f(u,"Type")||"")}</option>`).join("")}
        </select>
      </div>
      <button class="btn wide" id="wGo">That's me</button>
      <div class="hint">You're set up as <b>Staff</b> — you can browse everything across JV, add and tick tasks, log check-ins and answer reviews.
        If you lead a country, division or team, ask Mike to change your role.</div>
    </div>`;
  const sel = document.getElementById("wArea");
  document.getElementById("wGo").onclick = async()=>{
    const unitId = sel.value;
    if(!unitId) return toast("Pick one", true);
    const area = f(rec("units", unitId), "Name");
    const r = await fetch(`${API}?action=setarea`, {method:"POST", headers:authHeaders({"Content-Type":"application/json"}), body:JSON.stringify({unitId, area})});
    const j = await r.json();
    if(!r.ok) return toast(j.error||"Couldn't save", true);
    AUTH = j.me;
    await reload("people");
    ME = DB.people.find(p=>p.id===AUTH.id) || ME;
    toast(`Welcome to ${area}`);
    jvLens = "browse"; VIEW = "jv"; drawChrome(); render();
    maybeGuide();
  };
}

function drawButton(){
  const el = document.getElementById("gbtn");
  if(!el || !window.google) return;
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onGoogle });
  google.accounts.id.renderButton(el, {theme:"outline", size:"large", text:"signin_with", shape:"pill"});
}

let CLIENT_ID = null;
(async () => {
  const cfg = await fetch(`${API}?action=config`).then(r=>r.json()).catch(()=>({}));
  CLIENT_ID = cfg.googleClientId;

  if(!CLIENT_ID)
    return gate(`<h2 style="margin-top:12px">Almost there</h2>
      <div class="cap">Set <code>GOOGLE_CLIENT_ID</code> in the Netlify environment variables and redeploy.
      See the README for how to create it.</div>`);

  const saved = (()=>{ try{ return sessionStorage.getItem("jvokr.tok"); }catch(e){ return null; } })();
  if(saved){ ID_TOKEN = saved; return start(); }

  gate(`<h2 style="margin-top:12px">JV OKR</h2>
    <div class="cap">Sign in with your JV Google account.${cfg.domain?` (${esc(cfg.domain)})`:""}</div>
    <div id="gbtn" style="display:flex;justify-content:center;margin-top:16px"></div>`);
  const wait = setInterval(()=>{ if(window.google){ clearInterval(wait); drawButton(); } }, 120);
})();
</script>
