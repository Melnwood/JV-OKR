<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>JV OKR</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="icon" href="favicon-32.png" sizes="32x32"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<meta name="theme-color" content="#FF6600"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ── the ONE thing an organization changes to rebrand ── */
    --jv:#FF6600;          /* accent — JV orange */
    --jv-deep:#D95400;     /* accent on white: text, edges, links, the org's own bars */
    --jv-mid:#E8874A;      /* soft accent */
    --jv-100:#FFF4ED;      /* faint accent fill (was page banners) */
    --jv-50:#FFF8F3;       /* palest accent tint */
    --jv-edge:#F3E1D3;     /* accent border */
    /* ── neutrals: near-gray, a whisper warm — work with any accent ── */
    --ink:#1A1A18;--ink-2:#5C5C58;--ink-3:#8E8E88;
    --paper:#F8F8F6;--card:#FFFFFF;--rule:#E9E9E6;--rule-2:#F2F2EF;
    /* ── status: muted so they never fight the accent ── */
    --moss:#3F7D5A;--moss-bg:#EDF4F0;--amber:#95701A;--amber-bg:#F8F2E3;
    --clay:#A6483C;--clay-bg:#F9ECEA;--indigo:#4F46E5;
    /* ── depth from shadow, not colour ── */
    --lift:0 1px 2px rgba(26,26,24,.04),0 1px 3px rgba(26,26,24,.06);
    --lift-2:0 4px 6px -1px rgba(26,26,24,.05),0 12px 28px -8px rgba(26,26,24,.14);
    --r:12px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  a{color:var(--jv-deep)}
  .bar{background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
  .bar-in{max-width:1120px;margin:0 auto;padding:0 24px;display:flex;gap:8px;align-items:center;height:58px;flex-wrap:wrap}
  .logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15.5px;letter-spacing:-.015em;margin-right:18px;color:var(--ink);display:flex;align-items:center;gap:9px}
  .logo img{width:26px;height:26px;border-radius:7px}
  nav{display:flex;gap:3px;flex-wrap:wrap;flex:1}
  .nv{background:none;border:0;border-radius:8px;padding:8px 13px;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;font-weight:500}
  .nv[aria-current="true"]{background:var(--rule-2);color:var(--ink);font-weight:600}
  .nv:hover:not([aria-current="true"]){background:var(--rule-2);color:var(--ink)}
  .me{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2)}
  .gearwrap{position:relative}
  .nv.gear{font-size:16px;padding:6px 9px}
  .geardrop{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--rule);border-radius:10px;
            box-shadow:0 8px 24px rgba(34,30,27,.14);padding:5px;z-index:40;min-width:130px}
  .geardrop button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;
            padding:8px 11px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
  .geardrop button:hover{background:var(--jv-50);color:var(--jv-deep)}
  .lenses{display:flex;gap:4px;background:var(--jv-50);border:1px solid var(--jv-edge);border-radius:10px;
          padding:4px;margin-bottom:16px;width:fit-content}
  .lens{background:none;border:0;border-radius:7px;padding:7px 14px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;font-weight:500}
  .lens.on{background:#fff;color:var(--jv-deep);font-weight:600;box-shadow:0 1px 3px rgba(34,30,27,.08)}
  .lens:hover:not(.on){color:var(--jv-deep)}
  .gmodal{position:fixed;inset:0;background:rgba(34,30,27,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
  .gcard{background:var(--card);border-radius:16px;max-width:640px;width:100%;padding:30px 32px;box-shadow:0 20px 60px rgba(34,30,27,.3)}
  .ghero{border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:20px}
  .gsub{color:var(--ink-2);font-size:14.5px;margin:8px 0 0;line-height:1.6}
  .gsec{margin-bottom:22px}
  .gsec p{font-size:14px;line-height:1.65;margin:6px 0}
  .gsec ul,.gsec ol{font-size:14px;line-height:1.6;margin:8px 0;padding-left:20px}
  .gsec li{margin-bottom:6px}
  .gsec-jv{background:var(--jv-50);border:1px solid var(--jv-edge);border-radius:12px;padding:18px 20px}
  .gflow{counter-reset:none}
  .gstep{display:flex;gap:14px;margin:14px 0}
  .gn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--jv-deep);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .gstep h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:15.5px;margin:0 0 2px}
  .me select{border-color:var(--rule);background:#fff;color:var(--ink)}
  .me select option{color:var(--ink);background:#fff}
  select,input,textarea{font-family:'Plus Jakarta Sans',sans-serif;font-size:13.5px;border:1px solid var(--rule);border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink);width:100%}
  select.sm{width:auto;padding:6px 9px;font-size:13px}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 80px}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:25px;margin:0;letter-spacing:-.02em}
  h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;margin:0 0 2px}
  h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;margin:0 0 7px}
  .sub{color:var(--ink-2);font-size:13px;margin:3px 0 16px}
  .eyebrow{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase}
  .mono{font-family:'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink-2)}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:var(--lift)}
  .cap{font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
  .head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;
        margin-bottom:22px}
  .head .sub{margin:5px 0 0;color:var(--ink-2)}
  .head select{border-color:var(--rule);background:#fff}
  .head .btn.ghost{border-color:var(--rule);color:var(--ink);background:#fff}
  .head .btn.ghost:hover{background:var(--rule-2)}
  .filters{display:flex;gap:7px;flex-wrap:wrap}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
  .side{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
  @media(max-width:900px){.two,.side{grid-template-columns:1fr}}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--rule);border-radius:var(--r);padding:13px 15px;text-align:left;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--lift)}
  .tile:hover{box-shadow:var(--lift-2);border-color:#DEDEDA}
  .tile[aria-pressed="true"]{background:var(--ink);color:#fff}
  .tile[aria-pressed="true"] .l{color:#A9B6C2}
  .tile .v{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:25px;line-height:1}
  .tile .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-top:5px}
  .b-ok{border-left-color:var(--moss)}.b-risk{border-left-color:var(--amber)}
  .b-off{border-left-color:var(--clay)}.b-ind{border-left-color:var(--indigo)}

  .prog{height:7px;border-radius:4px;background:#EDE7E1;overflow:hidden;margin-top:6px}
  .prog span{display:block;height:100%;border-radius:4px}
  .pill{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:600;padding:4px 10px;border-radius:7px;white-space:nowrap;letter-spacing:0;text-transform:none}
  .p-on{background:var(--moss-bg);color:var(--moss)}.p-risk{background:var(--amber-bg);color:var(--amber)}
  .p-off{background:var(--clay-bg);color:var(--clay)}.p-none{background:#EDE8E3;color:var(--ink-2)}
  .p-stale{background:#E8E8F1;color:var(--indigo)}

  .btn{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:10px 15px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:var(--lift)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule);font-weight:600}
  .btn.jv{background:var(--jv);color:#fff}
  .btn.dash{background:none;color:var(--ink-2);border:1px dashed var(--rule);font-weight:500}
  .btn.accent{background:var(--jv);color:#fff;border:0}
  .btn.wide{width:100%}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
  .row:last-child{border-bottom:0}
  .why{font-size:12px;color:var(--ink-2);margin-top:2px}
  .field{margin-bottom:9px}
  .field label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 130px 150px;gap:6px}
  @media(max-width:560px){.grid3,.grid2{grid-template-columns:1fr}}

  /* cascade */
  .kr5{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:13px 16px;margin-bottom:6px}
  .cascade{margin-left:18px;border-left:2px solid var(--rule-2);padding:5px 0}
  .child{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:10px;margin:0 0 8px 16px;padding:12px 14px;cursor:pointer;box-shadow:var(--lift)}
  .child:hover{border-color:var(--ink-2)}
  .child::before{content:"";position:absolute;left:-16px;top:20px;width:16px;height:2px;background:var(--rule-2)}
  .scope{font-family:'Plus Jakarta Sans',sans-serif;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--rule-2);color:var(--ink-3);margin-right:7px;letter-spacing:.03em;text-transform:uppercase}

  /* map */
  .canvas{overflow:auto;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px;cursor:grab}
  .canvas.drag{cursor:grabbing}
  .link{fill:none;stroke:#D8CEC4;stroke-width:1.6}
  .link.lit{stroke:var(--jv-deep);stroke-width:2.4}
  .node rect{fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:9}
  .node.lit rect{stroke:var(--jv-deep);stroke-width:2}
  .node.dim{opacity:.25}
  .node{cursor:pointer}
  .n-title{font-size:12.5px;font-weight:600;fill:var(--ink)}
  .n-meta{font-size:10.5px;fill:var(--ink-2);font-family:'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums}
  .n-lvl{font-size:9px;fill:var(--ink-2);font-family:'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.09em}
  .root rect{fill:var(--jv);stroke:var(--jv)}
  .root .n-title{fill:#fff}.root .n-meta,.root .n-lvl{fill:rgba(255,255,255,.82)}
  .node.root.lit rect{stroke:#B84A00;stroke-width:2.5}
  .colhead{font-family:'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:10px;fill:var(--ink-2);letter-spacing:.1em}

  /* tasks */
  .task{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--rule)}
  .ktasks{margin:8px 0 4px 4px;padding-left:12px;border-left:2px solid var(--rule-2)}
  /* Sounding Board */
  .sb{border:1px solid var(--jv-edge);border-radius:12px;background:var(--jv-50);margin-bottom:16px;overflow:hidden}
  .sb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px}
  .sb-mark{color:var(--jv-deep);font-weight:700}
  .sb-head b{font-size:14px}
  .sb-tag{font-size:12px;color:var(--ink-3);margin-left:6px}
  .sb-toggle{font:inherit;font-size:12.5px;font-weight:600;color:var(--jv-deep);background:#fff;border:1px solid var(--jv-edge);border-radius:8px;padding:6px 12px;cursor:pointer}
  .sb-body{padding:0 15px 15px}
  .sb-body textarea{width:100%;font-family:inherit;font-size:14px;line-height:1.5;border:1px solid var(--rule);border-radius:9px;padding:10px 12px;background:#fff;resize:vertical}
  .sb-verdict{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:7px;margin:8px 0 6px}
  .v-build{background:#EDF2F7;color:#4A6A8A}.v-mixed{background:var(--amber-bg);color:var(--amber)}.v-good{background:var(--moss-bg);color:var(--moss)}
  .sb-read{font-size:14.5px;line-height:1.55}
  .sb-horizon{background:#EDF2F7;border:1px solid #D8E2EC;border-left:3px solid #4A6A8A;border-radius:9px;padding:10px 13px;margin-top:10px;font-size:14px;line-height:1.5}
  .sb-horizon .lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#4A6A8A;margin-right:7px}
  .sb-q{background:#fff;border-left:3px solid var(--jv);border-radius:8px;padding:11px 13px;margin-top:10px;font-size:14px;font-weight:500}
  .sb-ans{width:100%;margin-top:7px}
  .sb-load{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13.5px;padding:14px 2px}
  .sb-load .dot{width:6px;height:6px;border-radius:50%;background:var(--jv);animation:sbp 1.2s infinite}
  .sb-load .dot:nth-child(2){animation-delay:.2s}.sb-load .dot:nth-child(3){animation-delay:.4s}
  @keyframes sbp{0%,100%{opacity:.25}50%{opacity:1}}
  .sb-err{color:var(--clay);font-size:13.5px;padding:10px 2px}
  .sb-bless{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14.5px;line-height:1.55}
  .sb-bless .lab{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--jv-deep);margin-bottom:5px}
  .sb-rw{background:var(--moss-bg);border:1px solid #D6E6DD;border-radius:10px;padding:12px 14px;margin-top:12px}
  .sb-rw .lab{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--moss);margin-bottom:5px}
  .sb-rw .txt{font-size:14.5px;line-height:1.5}
  /* Expand-in-place workspace */
  .unit-group{margin-bottom:22px}
  .unit-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 2px 9px}
  .wobj{background:var(--card);border:1px solid var(--rule);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:var(--lift);transition:box-shadow .15s,border-color .15s}
  .wobj.open{box-shadow:var(--lift-2);border-color:#DEDEDA}
  .wobj-top{display:flex;align-items:center;gap:14px;padding:15px 17px;cursor:pointer}
  .wobj-top:hover{background:#FCFCFB}
  .wobj.open .wobj-top{border-bottom:1px solid var(--rule-2)}
  .chev{flex:none;color:var(--ink-3);font-size:11px;transition:transform .18s}
  .wobj.open .chev{transform:rotate(90deg);color:var(--ink-2)}
  .wobj-main{flex:1;min-width:0}
  .wobj-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .wobj-ladder{font-size:12.5px;color:var(--ink-3);margin-top:4px}
  .wobj-side{flex:none;display:flex;align-items:center;gap:13px}
  .wobj-pct{font-size:15px;font-weight:700;width:44px;text-align:right;letter-spacing:-.02em}
  .wobj-body{display:none;padding:4px 17px 17px}
  .wobj.open .wobj-body{display:block}
  .wkr{border:1px solid var(--rule-2);border-radius:10px;margin-top:12px;padding:12px 14px;background:#FDFDFC}
  .wkr-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .wkr-title{font-size:13.5px;font-weight:600}
  .wkr-num{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
  .wkr-num b{color:var(--ink);font-weight:700}
  .wkr .prog{margin-top:9px}
  .wtasks{margin-top:10px}
  .wtasks .task{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
  .wtasks .task:last-of-type{border-bottom:0}
  .wtasks .task .t{flex:1;font-size:13.5px}
  .wtasks .task.done .t{color:var(--ink-3);text-decoration:line-through}
  .wtasks .task .m{font-size:11.5px;color:var(--ink-3)}
  .wtasks .task .xdel{cursor:pointer;padding:0 3px}
  .wtasks .task.late .m{color:var(--clay)}
  .addrow{display:flex;gap:7px;margin-top:9px}
  .addrow input{flex:1;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:#fff}
  .wobj-foot{display:flex;align-items:center;gap:8px;margin-top:15px;flex-wrap:wrap}
  .task input[type=checkbox]{width:17px;height:17px;margin-top:3px;accent-color:var(--moss);flex:none}
  .task .t{flex:1;font-size:13.5px}
  .task.done .t{text-decoration:line-through;color:var(--ink-2)}
  .task .m{font-family:'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink-2);white-space:nowrap}
  .tdue{border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;color:var(--ink-2);width:118px;cursor:pointer;flex:none}
  .tdue:hover{color:var(--ink)}
  input[type=range].tprog{-webkit-appearance:none;appearance:none;flex:none;width:88px;height:6px;border-radius:4px;padding:0;cursor:pointer;
    background:linear-gradient(to right,#C9CFD6 0%,var(--jv) var(--p,0%),var(--rule-2) var(--p,0%),var(--rule-2) 100%)}
  input[type=range].tprog::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--jv);border:2px solid #fff;box-shadow:0 0 0 1px var(--rule)}
  input[type=range].tprog::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--jv);border:2px solid #fff}
  .task.minerow{background:var(--jv-50);border-left:3px solid var(--jv);border-radius:8px;padding-left:9px;border-bottom:1px solid #fff}
  .towner{border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;color:var(--ink-2);cursor:pointer;max-width:110px;flex:none}
  .towner:hover{color:var(--ink)}
  .newtask{display:flex;align-items:center;gap:12px;background:var(--jv-50);border:1px solid var(--jv-edge);border-left:3px solid var(--jv);border-radius:10px;padding:10px 14px;margin-bottom:8px}
  .newtask .nt-main{flex:1}
  .krpick{display:flex;flex-wrap:wrap;gap:8px}
  .krcard{font:inherit;text-align:left;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;width:228px;cursor:pointer}
  .krcard:hover{border-color:var(--ink-3)}
  .krcard.on{border-color:var(--jv);box-shadow:0 0 0 1px var(--jv)}
  .krcard-t{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .krcard-m{display:block;font-size:11px;color:var(--ink-3);margin-top:6px}
  .krviz{margin:10px 0 18px}
  .krviz-top{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
  .krviz-big{font-size:27px;font-weight:700;line-height:1}
  .krviz-of{color:var(--ink-3);font-size:12.5px;flex:1}
  .krviz-pct{font-size:15px;font-weight:700}
  .prog.big{height:9px}
  .krviz-sub{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11.5px;color:var(--ink-2)}
  .krviz-sub .prog{width:140px}
  .notes{margin:2px 0 8px 27px;padding:9px 13px;background:var(--jv-50);border:1px dashed var(--jv-edge);border-radius:8px}
  .noteline{font-size:12.5px;padding:5px 0;border-bottom:1px dotted var(--rule-2);line-height:1.5}

  /* ripple */

  .jvbox{border:1px solid var(--rule);border-left:3px solid var(--indigo);border-radius:10px;padding:12px 14px;background:#FAFBFC}

  /* reviews */
  .gate{background:var(--jv-50);border:1px dashed var(--jv-mid);border-radius:10px;padding:13px 15px;margin-bottom:12px;font-size:13px}

  /* decisions */

  /* coaching */

  .unseen{font-family:'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--clay)}

  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--clay)}

<body>
<div class="bar" id="bar" style="display:none"><div class="bar-in">
  <span class="logo"><img src="icon.svg" alt=""/>JV OKR</span>
  <nav id="nav"></nav>
  <div class="me" id="whobox"></div>
</div></div>

<div class="wrap"><div id="view" class="loading">Loading…</div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ API ============================ */
const API = "/.netlify/functions/airtable";
const T = {people:"People", cycles:"Cycles", units:"Org Units", objectives:"Objectives", krs:"Key Results", tasks:"Tasks",
           checkins:"Check-ins", reviews:"Reviews", responses:"Review Responses", decisions:"Decisions",
           notes:"Coaching Notes", resources:"Resources", shares:"Resource Shares"};
const FIELD_IDS = { notesFiles:"fldzqeq0lTRD5r5SR", resourceFile:"fld87BX3WN94SPYqY" };

let ID_TOKEN = null;

const authHeaders = (extra={}) => ({ ...extra, ...(ID_TOKEN ? {Authorization:`Bearer ${ID_TOKEN}`} : {}) });

const get = async t => {
  let r, j;
  try { r = await fetch(`${API}?table=${encodeURIComponent(t)}`, {headers: authHeaders()}); }
  catch(e){ throw new Error(`Network error reaching the function (${t}): ${e.message}`); }
  const text = await r.text();
  try { j = JSON.parse(text); }
  catch(e){ throw new Error(`The function didn't return JSON for "${t}" (HTTP ${r.status}). Is it deployed at ${API}? First bytes: ${text.slice(0,80)}`); }
  if (r.status === 401 || r.status === 403) throw Object.assign(new Error(j.error||"Not allowed"), {auth:true});
  if (!r.ok || j.error) throw new Error(`"${t}" — ${j.error || "HTTP "+r.status}`);
  if (!j.records) throw new Error(`"${t}" returned no records array. Check the table name matches the base exactly.`);
  return j;
};
const write = async (t, records, method) => {
  const r = await fetch(`${API}?table=${encodeURIComponent(t)}`,{method,headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({records})});
  const j = await r.json().catch(()=>({}));
  if (!r.ok || j.error){ const m = `Didn't save — ${j.error || "HTTP "+r.status}`; toast(m, true); throw new Error(m); }
  return j;
};
const post  = (t,records) => write(t,records,"POST");
const patch = (t,records) => write(t,records,"PATCH");
const del = async (t, ids) => {
  const r = await fetch(`${API}?table=${encodeURIComponent(t)}&ids=${ids.join(",")}`, {method:"DELETE", headers: authHeaders()});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || "delete failed");
  return j;
};
const upload = (recordId, fieldId, file) => new Promise((res,rej)=>{
  const fr = new FileReader();
  fr.onload = async () => {
    const b64 = fr.result.split(",")[1];
    const r = await fetch(`${API}?action=upload`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({recordId, fieldId, filename:file.name, contentType:file.type||"application/octet-stream", base64:b64})});
    r.ok ? res(await r.json()) : rej(await r.json());
  };
  fr.onerror = rej;
  fr.readAsDataURL(file);
});

/* ============================ STATE ============================ */
const DB = {};
let ME = null, VIEW = "jv", TOAST_T;
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const STALE = 21;

const f  = (r,k) => r.fields[k];
const lnk = (r,k) => f(r,k) || [];
const one = (r,k) => (f(r,k)||[])[0];
const rec = (t,id) => DB[t].find(x=>x.id===id);
const nm  = (t,id) => { const r = rec(t,id); return r ? (f(r,"Name") || f(r,"Title") || "") : ""; };
const days = d => d ? Math.round((TODAY - new Date(d)) / 864e5) : null;
const fmt = d => d ? new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "";
const iso = d => new Date(d).toISOString().slice(0,10);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CONF = {"On track":["p-on","var(--moss)"], "At risk":["p-risk","var(--amber)"], "Off track":["p-off","var(--clay)"], "Not started":["p-none","#B6BEC6"]};
const cls = c => (CONF[c]||CONF["Not started"])[0];
const col = c => (CONF[c]||CONF["Not started"])[1];
const pct = v => Math.max(0, Math.min(100, Math.round((v||0)*100)));

function toast(msg, err){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast on" + (err?" err":"");
  clearTimeout(TOAST_T); TOAST_T = setTimeout(()=>t.className="toast", 2600);
}

async function load(){
  const [people,cycles,units,objectives,krs,tasks,checkins,reviews,responses,decisions,notes,resources,shares] =
    await Promise.all(Object.values(T).map(get));
  Object.assign(DB, {people:people.records, cycles:cycles.records, units:units.records, objectives:objectives.records,
    krs:krs.records, tasks:tasks.records, checkins:checkins.records, reviews:reviews.records,
    responses:responses.records, decisions:decisions.records, notes:notes.records,
    resources:resources.records, shares:shares.records});
  ME = DB.people.find(p=>p.id===AUTH.id) || null;
  drawChrome(); render();
}
async function reload(t){ const j = await get(T[t]); DB[t] = j.records; }

/* who the signed-in person is, per the server. The browser never decides this. */
let AUTH = null;
const COACH_ROLES = ["OKR Director","Executive"];
const LEADER_ROLES = ["Country leader","Division leader",...COACH_ROLES];
const iAmCoach  = () => AUTH && COACH_ROLES.includes(AUTH.role);
const iAmLeader = () => AUTH && LEADER_ROLES.includes(AUTH.role);

/* ============================ ORG UNITS ============================ */
// Countries and Divisions sit at the top. Departments and Teams hang under either.
const unitOf   = r => { const u = one(r,"Org Unit"); return u ? rec("units", u) : null; };
const areaName = r => { const u = unitOf(r); return u ? f(u,"Name") : (f(r,"Area") || ""); };
const unitParent   = u => { const p = one(u,"Parent unit"); return p ? rec("units", p) : null; };
// A unit with no name is an empty Airtable row, not part of JV. Never show it.
const namedUnits   = () => DB.units.filter(u=>String(f(u,"Name")||"").trim());
const unitChildren = id => namedUnits().filter(u=>lnk(u,"Parent unit").includes(id));
const unitRoots    = () => namedUnits().filter(u=>!one(u,"Parent unit"));
const unitPath     = u => { const out=[]; let c=u; while(c){ out.unshift(c); c = unitParent(c); } return out; };
const unitCrumb    = u => unitPath(u).map(x=>f(x,"Name")).join(" › ");
// Everything at or beneath a unit — a country's number includes its departments and teams.
const unitTree = id => { const out=[id]; unitChildren(id).forEach(c=>out.push(...unitTree(c.id))); return out; };
const unitObjectives = id => live(DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year" && unitTree(id).includes(one(o,"Org Unit"))));
const unitPeople = id => DB.people.filter(p=>unitTree(id).includes(one(p,"Org Unit")));
const UNIT_ORDER = {Country:0, Division:1, Department:2, Team:3};
const unitsSorted = list => [...list].filter(u=>String(f(u,"Name")||"").trim()).sort((a,b)=>
  (UNIT_ORDER[f(a,"Type")]??9)-(UNIT_ORDER[f(b,"Type")]??9) || String(f(a,"Name")).localeCompare(String(f(b,"Name"))));

/* ============================ DERIVED ============================ */
const ARCHIVED = o => ["Closed","Abandoned"].includes(f(o,"Status"));
let showArchived = false;
const live = list => showArchived ? list : list.filter(o=>!ARCHIVED(o));
const jvObjectives = () => DB.objectives.filter(o=>f(o,"Scope")==="JV 5-year");
const jvKrs = () => DB.krs.filter(k=>{ const o = one(k,"Objective"); return o && f(rec("objectives",o)||{fields:{}},"Scope")==="JV 5-year"; });
const childObjectives = krId => live(DB.objectives.filter(o=>lnk(o,"Parent Key Result").includes(krId)));
const KR_ARCHIVED = k => f(k,"Archived")===true;
const objKrs    = objId => DB.krs.filter(k=>lnk(k,"Objective").includes(objId) && !KR_ARCHIVED(k));
const objKrsAll = objId => DB.krs.filter(k=>lnk(k,"Objective").includes(objId));
const krTasks = krId => DB.tasks.filter(t=>lnk(t,"Key Result").includes(krId));
const objTasks = objId => objKrs(objId).flatMap(k=>krTasks(k.id));
const objCheckins = objId => DB.checkins.filter(c=>lnk(c,"Objective").includes(objId)).sort((a,b)=>new Date(f(b,"Date"))-new Date(f(a,"Date")));
const staleDays = o => f(o,"Days since check-in") ?? 999;
const isStale = o => staleDays(o) > STALE;
const isLate = t => f(t,"Status")==="Open" && f(t,"Due date") && new Date(f(t,"Due date")) < TODAY;
const ownedBy = pid => live(DB.objectives.filter(o=>lnk(o,"Owner").includes(pid) && f(o,"Scope")!=="JV 5-year"));
// My ground-level OKRs: ones I own, ones on my team(s), and ones where I own a task — combined, de-duped.
function myOkrs(pid){
  const p = rec("people", pid); if(!p) return [];
  const myUnit = one(p,"Org Unit");
  const seen = new Set(), out = [];
  const add = o => { if(o && !seen.has(o.id)){ seen.add(o.id); out.push(o); } };
  ownedBy(pid).forEach(add);                                                   // I own it
  if(myUnit) live(DB.objectives).filter(o=>f(o,"Scope")!=="JV 5-year" && one(o,"Org Unit")===myUnit).forEach(add); // my team's
  DB.tasks.filter(t=>lnk(t,"Owner").includes(pid)).forEach(t=>{               // I own a task under it
    const kr = rec("krs", one(t,"Key Result")); if(kr) add(rec("objectives", one(kr,"Objective")));
  });
  return out;
}
// Everyone on the same unit as this person — so I can see my teammates' work on our OKRs.
function myTeammates(pid){
  const p = rec("people", pid); const u = p && one(p,"Org Unit"); if(!u) return [];
  return DB.people.filter(x=>one(x,"Org Unit")===u);
}
const objProgress = o => f(o,"Progress") ?? 0;
const ladderKr = o => { const p = one(o,"Parent Key Result"); return p ? rec("krs",p) : null; };
/* Not everything ladders. Three honest states, and the app says which. */
const ALIGN = {LADDER:"Ladders to a JV key result", SUPPORT:"Supports JV — no single key result", ALONE:"Standalone / operational"};
const alignOf = o => f(o,"Alignment") || (one(o,"Parent Key Result") ? ALIGN.LADDER : ALIGN.ALONE);
const isLaddered = o => alignOf(o)===ALIGN.LADDER && !!one(o,"Parent Key Result");
const supportsJv = o => alignOf(o)===ALIGN.SUPPORT;
const unlanded  = () => live(DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year" && !isLaddered(o)));
const alignPill = o => isLaddered(o) ? "" :
  supportsJv(o) ? `<span class="pill p-risk">supports JV</span>` : `<span class="pill p-none">standalone</span>`;
const alignLine = o => {
  const k = ladderKr(o);
  if(isLaddered(o) && k) return `↑ ${esc(f(k,"Title"))}`;
  if(supportsJv(o)){ const j = one(o,"Supports JV objective"); return `≈ supports ${esc(j?nm("objectives",j):"JV 2030")} — not measured into a key result`; }
  return `— standalone: this doesn't roll up, and that's allowed`;
};

const LENS = {};

/* movement — how far a number actually traveled lately, from KR History */
const histOf = k => (f(k,"History")||"").split("\n").filter(x=>/^\d{4}-\d{2}-\d{2}/.test(x))
  .map(l=>{const i=l.indexOf(" · "); return {d:l.slice(0,10), v:+l.slice(i+3)};}).filter(m=>!isNaN(m.v));
const krMove = (k, days=7) => {
  const h = histOf(k); if(!h.length) return 0;
  const cutoff = iso(new Date(TODAY.getTime()-days*864e5));
  if(!h.some(m=>m.d>=cutoff)) return 0;
  const before = [...h].reverse().find(m=>m.d<cutoff);
  const base = before ? before.v : (f(k,"Start value")||0);
  return krFrac(k, f(k,"Current value")??0) - krFrac(k, base);
};
const objMove = (o, days=7) => {
  const ks = objKrs(o.id); if(!ks.length) return 0;
  return ks.reduce((s,k)=>s+krMove(k,days),0)/ks.length;
};
const movePill = m => { const pp = Math.round(m*100);
  return pp>0 ? `<span class="pill p-on">↑ ${pp}% this wk</span>` : pp<0 ? `<span class="pill p-off">↓ ${-pp}% this wk</span>` : ""; };

/* ── dial & line: the two faces of a key result ── */
let VIZ = {}; try{ VIZ = JSON.parse(localStorage.getItem("jvViz")||"{}"); }catch(e){}
const setViz = (id,m) => { VIZ[id]=m; try{ localStorage.setItem("jvViz", JSON.stringify(VIZ)); }catch(e){} };
const vizPolar=(cx,cy,r,fr)=>{const a=Math.PI*(1-Math.max(0,Math.min(1,fr)));return [cx+r*Math.cos(a),cy-r*Math.sin(a)];};
const vizArc=(cx,cy,r,f0,f1,w,color,op)=>{const [x0,y0]=vizPolar(cx,cy,r,f0),[x1,y1]=vizPolar(cx,cy,r,f1);
  return `<path d="M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}" fill="none" stroke="${color}" stroke-width="${w}" stroke-opacity="${op??1}"/>`;};
const vizTick=(cx,cy,r,fr,len,color,w)=>{const [x0,y0]=vizPolar(cx,cy,r-len/2,fr),[x1,y1]=vizPolar(cx,cy,r+len/2,fr);
  return `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${color}" stroke-width="${w||2}"/>`;};

/* where are we in the season? — a stamp every objective and KR can wear */
const cyclePos = cyc => { if(!cyc) return null;
  const name=f(cyc,"Name")||"", cs=f(cyc,"Start"), ce=f(cyc,"End");
  if(!cs||!ce) return name?{name,phase:"",p:null}:null;
  const t0=new Date(cs).getTime(), t1=new Date(ce).getTime(), now=TODAY.getTime();
  const p=Math.max(0,Math.min(100,Math.round((now-t0)/((t1-t0)||1)*100)));
  const weeks=Math.max(1,Math.round((t1-t0)/(7*864e5))), week=Math.min(weeks,Math.max(1,Math.ceil((now-t0)/(7*864e5))));
  const phase = now<t0?`starts ${fmt(cs)}` : now>t1?`ended ${fmt(ce)}` : `week ${week} of ${weeks}`;
  return {name, phase, p}; };
const seasonStampO = o => { const c=cyclePos(rec("cycles", one(o||{},"Cycle"))); if(!c) return "";
  return `<span class="stamp">${c.p!==null?`<i class="stampbar"><b style="width:${c.p}%"></b></i>`:""}${esc(c.name)}${c.phase?` · ${c.phase}`:""}</span>`; };
const krStamp = k => seasonStampO(rec("objectives", one(k,"Objective")));

/* which way a key result wins */
const krDir = k => { const d=f(k,"Direction")||""; return d.indexOf("Decrease")===0?"down":d.indexOf("Hold")===0?"hold":"up"; };
const krFrac = (k,v) => { const st=f(k,"Start value")||0, tgt=f(k,"Target value")??0, dir=krDir(k);
  if(dir==="down") return (st-tgt)?(st-v)/(st-tgt):0;
  if(dir==="hold") return tgt?v/tgt:0;
  return (tgt-st)?(v-st)/(tgt-st):0; };
const krPhrase = k => { const tgt=f(k,"Target value")??0, u=esc(f(k,"Unit")||""), dir=krDir(k), cur=f(k,"Current value")??0;
  return dir==="down"?`aiming below ${tgt}${u}`:dir==="hold"?`holding above ${tgt}${u}${cur>=tgt?" ✓":""}`:`of ${tgt}${u}`; };
const goodDelta = (k,d) => krDir(k)==="down" ? d<0 : d>0;

function svgDial(kr, big){
  const S = big?430:300, cx=S/2, cy=S/2-6, R=S/2-(big?52:42), W2=big?26:18;
  const st=f(kr,"Start value")||0, tgt=f(kr,"Target value")??0, cur=f(kr,"Current value")??0, unit=f(kr,"Unit")||"";
  const com=f(kr,"Commit"), str=f(kr,"Stretch");
  const max=Math.max(str||0, tgt, cur) || 1;
  const dir=krDir(kr), clamp01=x=>Math.max(0,Math.min(1,x));
  const fr = dir==="up" ? (v=>(v-st)/((max-st)||1)) : (v=>clamp01(krFrac(kr,v)));
  const h=histOf(kr); const pts=[st, ...h.map(m=>m.v)]; if(pts[pts.length-1]!==cur) pts.push(cur);
  let segs=""; for(let i=1;i<pts.length;i++) segs+=vizArc(cx,cy,R,fr(pts[i-1]),fr(pts[i]),W2,"var(--jv)",.35+i*(.65/(pts.length-1||1)));
  const seams=pts.slice(1,-1).map(v=>vizTick(cx,cy,R,fr(v),W2+7,"#fff",2.2)).join("");
  const mark=(v,lab,colr)=>{ if(v==null||v===tgt&&lab==="commit") return ""; const frv=fr(v);
    if(frv>=.99) return `<text x="${cx+R}" y="${cy+26}" font-size="10" font-weight="700" fill="${colr}" text-anchor="middle">${lab} ${v}</text>`;
    const [lx,ly]=vizPolar(cx,cy,R+W2/2+(big?16:12),frv);
    return vizTick(cx,cy,R,frv,W2+14,colr,2.4)+`<text x="${lx}" y="${ly-2}" font-size="${big?11:9.5}" font-weight="700" fill="${colr}" text-anchor="${frv>.6?"start":frv<.4?"end":"middle"}">${lab} ${v}</text>`; };
  const lastH=h[h.length-1];
  const lastJump = lastH ? Math.round((lastH.v-(h.length>1?h[h.length-2].v:st))*10)/10 : 0;
  const [nx,ny]=vizPolar(cx,cy,R,fr(cur));
  const PADX = big?95:70;
  return `<svg width="100%" viewBox="${-PADX} -6 ${S+2*PADX} ${S/2+58}" style="max-width:${big?640:400}px;display:block;margin:0 auto">
    ${vizArc(cx,cy,R,0,1,W2,"var(--rule-2)")}${segs}${seams}
    ${dir==="up"?mark(com,"commit","#98928A"):""}${mark(tgt,"target","var(--jv-deep)")}
    <circle cx="${nx}" cy="${ny}" r="${big?6:4.5}" fill="var(--jv)"/>
    <text x="${cx}" y="${cy-(big?16:10)}" font-size="${big?42:26}" font-weight="800" fill="var(--ink)" text-anchor="middle">${cur}</text>
    <text x="${cx}" y="${cy+(big?10:9)}" font-size="${big?13.5:11}" fill="var(--ink-3)" text-anchor="middle">${krPhrase(kr)}</text>
    <text x="${cx}" y="${cy+(big?31:26)}" font-size="${big?12:10.5}" font-weight="700" fill="${lastH?(lastJump===0||goodDelta(kr,lastJump)?"var(--moss)":"var(--clay)"):"var(--ink-3)"}" text-anchor="middle">${lastH?`last moved ${esc(fmt(lastH.d))} · ${lastJump>=0?"+":""}${lastJump}`:"no movement yet"}</text>
    <text x="${cx-R}" y="${cy+26}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${dir==="hold"?0:st}</text>
    ${dir==="up"&&max!==tgt?`<text x="${cx+R}" y="${cy+26}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${max}</text>`:""}
  </svg>`;
}

function svgLine(kr){
  const W=840,Hh=220,PADL=46,PADR=56;
  const st=f(kr,"Start value")||0, tgt=f(kr,"Target value")??0, cur=f(kr,"Current value")??0;
  const com=f(kr,"Commit");
  const max=Math.max(tgt,cur,f(kr,"Stretch")||0)||1;
  const obj=rec("objectives",one(kr,"Objective")); const cyc=obj&&rec("cycles",one(obj,"Cycle"));
  const h=histOf(kr);
  let cs=(cyc&&f(cyc,"Start"))||null, ce=(cyc&&f(cyc,"End"))||null;
  if(!cs) cs = h.length? h[0].d : iso(new Date(TODAY.getTime()-30*864e5));
  if(!ce || ce<=cs) ce = iso(new Date(new Date(cs).getTime()+120*864e5));
  const t0=new Date(cs).getTime(), t1=new Date(ce).getTime();
  const dx=d=>PADL+((new Date(d).getTime()-t0)/(t1-t0))*(W-PADL-PADR);
  const dir=krDir(kr), base = dir==="hold"?0:st;
  const fscale = v=>Math.max(0,Math.min(1.06, dir==="up" ? ((v-st)/((max-st)||1)) : krFrac(kr,v)));
  const yv=v=>Hh-32-fscale(v)*(Hh-78);
  const todayX=Math.min(W-PADR,Math.max(PADL,dx(iso(TODAY))));
  let months=""; let mcur=new Date(t0); mcur.setDate(1); mcur.setMonth(mcur.getMonth()+1);
  while(mcur.getTime()<t1){ const x=dx(iso(mcur));
    if(x>=PADL-2 && x<=W-PADR) months+=`<line x1="${x}" y1="${Hh-32}" x2="${x}" y2="12" stroke="var(--rule-2)"/><text x="${x+4}" y="${Hh-16}" font-size="11" fill="var(--ink-3)">${mcur.toLocaleDateString("en-GB",{month:"short"})}</text>`;
    mcur.setMonth(mcur.getMonth()+1); }
  const pts=[{d:cs,v:st},...h.filter(m=>m.d>=cs)];
  let ridge=`M${dx(pts[0].d)},${yv(pts[0].v)}`;
  for(let i=1;i<pts.length;i++) ridge+=` L${dx(pts[i].d)},${yv(pts[i-1].v)} L${dx(pts[i].d)},${yv(pts[i].v)}`;
  ridge+=` L${todayX},${yv(cur)}`;
  const area=ridge+` L${todayX},${yv(base)} L${dx(pts[0].d)},${yv(base)} Z`;
  const gid="lg"+kr.id;
  return `<svg width="100%" viewBox="0 0 ${W} ${Hh}" style="display:block">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--jv)" stop-opacity=".8"/><stop offset="100%" stop-color="var(--jv)" stop-opacity=".08"/></linearGradient></defs>
    ${months}
    <line x1="${PADL}" y1="${yv(tgt)}" x2="${W-PADR}" y2="${yv(tgt)}" stroke="var(--jv-deep)" stroke-dasharray="5 5" opacity=".5"/>
    <text x="${W-PADR+4}" y="${yv(tgt)+4}" font-size="10.5" font-weight="700" fill="var(--jv-deep)">${tgt}</text>

const krViz = (kr,big) => (VIZ[kr.id]||"dial")==="dial" ? svgDial(kr,big) : svgLine(kr);
const wireViz = () => document.querySelectorAll("[data-viz]").forEach(b=>b.onclick=(e)=>{e.stopPropagation(); setViz(b.dataset.viz,b.dataset.m); render();});
const moveLabel = o => { const ks=objKrs(o.id); if(!ks.length) return "";
  if(ks.length===1 && krDir(ks[0])==="up"){ const k=ks[0], h=histOf(k), cutoff=iso(new Date(TODAY.getTime()-7*864e5));

      return `<div class="card" style="margin-top:26px"><h2>What moved lately</h2><div class="cap">Live from the teams' check-ins — click a line to go deeper.</div>

/* ============================ ALIGNMENT MAP ============================ */
let mArea = "", collapsed = new Set();
LENS.map = () => {
  const LV = ["JV OBJECTIVE","JV KEY RESULT","COUNTRY / DIVISION OBJECTIVE","THEIR KEY RESULT","TASKS"];
  const N = [];
  jvObjectives().forEach(j=>{
    N.push({id:j.id, lvl:0, title:f(j,"Title"), meta:"five-year"});
    objKrs(j.id).forEach(k=>{
      N.push({id:k.id, lvl:1, p:j.id, title:f(k,"Title"), meta:`${f(k,"Current value")??0} / ${f(k,"Target value")??0} · ${pct(f(k,"Progress"))}%`});
      childObjectives(k.id).filter(o=>!mArea || areaName(o)===mArea).forEach(o=>{
        N.push({id:o.id, lvl:2, p:k.id, area:areaName(o), conf:f(o,"Confidence"),
                title:f(o,"Title"), meta:`${nm("people",one(o,"Owner"))} · ${pct(objProgress(o))}%`});
        objKrs(o.id).forEach(k2=>{
          N.push({id:k2.id, lvl:3, p:o.id, area:areaName(o), conf:f(k2,"Confidence"),
                  title:f(k2,"Title"), meta:`${pct(f(k2,"Progress"))}%`});
          const ts = krTasks(k2.id);
          if(ts.length) N.push({id:"T"+k2.id, lvl:4, p:k2.id, area:areaName(o),
            title:`${ts.length} task${ts.length>1?"s":""}`,
            meta:`${ts.filter(t=>f(t,"Status")==="Done").length} done · ${ts.filter(isLate).length} late`});
        });
      });
    });
  });
  // work that doesn't ladder still belongs on the map — as its own lane, honestly labelled
  const loose = unlanded().filter(o=>!mArea || areaName(o)===mArea);
  if(loose.length){
    N.push({id:"LOOSE", lvl:1, title:"Doesn't ladder to a key result", meta:`${loose.length} objective${loose.length===1?"":"s"}`});
    loose.forEach(o=>{
      N.push({id:o.id, lvl:2, p:"LOOSE", area:areaName(o), conf:f(o,"Confidence"),
              title:f(o,"Title"), meta:`${supportsJv(o)?"supports JV":"standalone"} · ${pct(objProgress(o))}%`});
      objKrs(o.id).forEach(k2=>{
        N.push({id:k2.id, lvl:3, p:o.id, area:areaName(o), conf:f(k2,"Confidence"),
                title:f(k2,"Title"), meta:`${pct(f(k2,"Progress"))}%`});
      });
    });
  }
  const areas = [...new Set(DB.objectives.filter(o=>areaName(o) && f(o,"Scope")!=="JV 5-year").map(o=>areaName(o)))].sort();
  document.getElementById("view").innerHTML = `
    <div class="head">
      <div><h1>Alignment map</h1><div class="sub">Hover any box to trace its line up to JV 2030. Work that doesn't ladder sits in its own lane — visible, not hidden.</div></div>
      <div class="filters">
        <select class="sm" id="ma"><option value="">All areas</option>${areas.map(a=>`<option ${mArea===a?"selected":""}>${esc(a)}</option>`).join("")}</select>
        <button class="btn ghost" id="mx">${collapsed.size?"Expand all":"Collapse all"}</button>
      </div>
    </div>
    <div class="canvas" id="cv"><svg id="svg"></svg></div>`;
  document.getElementById("ma").onchange = e=>{mArea=e.target.value; render();};
  document.getElementById("mx").onclick = ()=>{
    if(collapsed.size) collapsed.clear(); else N.filter(n=>n.lvl>=1&&n.lvl<=3).forEach(n=>collapsed.add(n.id));
    render();};
  drawMap(N, LV);
};
function drawMap(N, LV){
  const byId = i=>N.find(n=>n.id===i), kids = i=>N.filter(n=>n.p===i);
  const hidden = n => { let p=n.p; while(p){ if(collapsed.has(p)) return true; p=byId(p)?.p; } return false; };
  const act = N.filter(n=>!hidden(n));
  const W=250,H=68,GX=94,GY=15,PT=38,PL=8;
  const pos = {}; let cur = PT;
  const place = n => {
    const ch = kids(n.id).filter(c=>act.includes(c));
    if(!ch.length || collapsed.has(n.id)){ pos[n.id]={x:PL+n.lvl*(W+GX), y:cur}; cur += H+GY; return pos[n.id].y; }
    const ys = ch.map(place); const y=(ys[0]+ys[ys.length-1])/2;
    pos[n.id]={x:PL+n.lvl*(W+GX), y}; return y;
  };
  act.filter(n=>!n.p).forEach(n=>{ place(n); cur+=22; });
  if(!act.length){ document.getElementById("cv").innerHTML = `<div class="empty">Nothing to map yet.</div>`; return; }
  const maxY = Math.max(...Object.values(pos).map(p=>p.y))+H+30, maxX = PL+5*(W+GX);
  const heads = LV.map((l,i)=>`<text class="colhead" x="${PL+i*(W+GX)}" y="18">${l}</text>`).join("");
  const links = act.filter(n=>n.p&&pos[n.p]).map(n=>{
    const a=pos[n.p], b=pos[n.id], x1=a.x+W, y1=a.y+H/2, x2=b.x, y2=b.y+H/2, m=(x1+x2)/2;
    return `<path class="link" data-f="${n.p}" data-t="${n.id}" marker-end="url(#ar)" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2-7},${y2}"/>`;}).join("");
  const nodes = act.map(n=>{
    const p=pos[n.id], ch=kids(n.id), c=collapsed.has(n.id);
    const acc = n.conf ? `<rect x="${p.x}" y="${p.y+10}" width="3.5" height="${H-20}" rx="2" fill="${col(n.conf)}"/>`:"";
    const tg = ch.length ? `<g class="tog" data-id="${n.id}"><circle cx="${p.x+W}" cy="${p.y+H/2}" r="9" fill="#fff" stroke="${'#D6DCE2'}"/>
        <text x="${p.x+W}" y="${p.y+H/2+4}" text-anchor="middle" class="n-meta" style="pointer-events:none">${c?"+":"–"}</text></g>`:"";
    const t = s => s && s.length>32 ? s.slice(0,31)+"…" : (s||"");
    return `<g class="node ${n.lvl===0?"root":""}" data-id="${n.id}">
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}"/>${acc}
      <text class="n-lvl" x="${p.x+13}" y="${p.y+17}">${esc((n.area||LV[n.lvl].split(" ")[0]).toUpperCase())}</text>
      <text class="n-title" x="${p.x+13}" y="${p.y+37}">${esc(t(n.title))}</text>
      <text class="n-meta" x="${p.x+13}" y="${p.y+56}">${esc(t(n.meta||""))}</text></g>${tg}`;}).join("");
  const svg = document.getElementById("svg");
  svg.setAttribute("width",maxX); svg.setAttribute("height",maxY); svg.setAttribute("viewBox",`0 0 ${maxX} ${maxY}`);
  svg.innerHTML = `<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#B8AB9E"/></marker></defs>${heads}${links}${nodes}`;
  svg.querySelectorAll(".tog").forEach(t=>t.onclick=e=>{e.stopPropagation();
    const i=t.dataset.id; collapsed.has(i)?collapsed.delete(i):collapsed.add(i); render();});
  svg.querySelectorAll(".node").forEach(g=>{
    g.onmouseenter = ()=>{
      const chain=[]; let c=byId(g.dataset.id);
      while(c){ chain.push(c.id); c = c.p?byId(c.p):null; }
      svg.querySelectorAll(".node").forEach(n=>{
        n.classList.toggle("lit", chain.includes(n.dataset.id));
        n.classList.toggle("dim", !chain.includes(n.dataset.id));});
      svg.querySelectorAll(".link").forEach(l=>l.classList.toggle("lit", chain.includes(l.dataset.f)&&chain.includes(l.dataset.t)));
    };
    g.onmouseleave = ()=>{ svg.querySelectorAll(".node").forEach(n=>n.classList.remove("lit","dim"));
                           svg.querySelectorAll(".link").forEach(l=>l.classList.remove("lit")); };
    g.onclick = ()=>{
      // any box opens the objective it belongs to — walk up to the nearest one
      let n = byId(g.dataset.id);
      while(n && n.lvl!==0 && n.lvl!==2) n = n.p ? byId(n.p) : null;
      if(n && n.id!=="LOOSE") openObjective(n.id);
    };
  });
  const cv=document.getElementById("cv"); let dn=false,sx,sy,sl,st;
  cv.onmousedown=e=>{ if(e.target.closest(".node,.tog"))return; dn=true; cv.classList.add("drag"); sx=e.pageX;sy=e.pageY;sl=cv.scrollLeft;st=cv.scrollTop; };
  window.onmouseup=()=>{dn=false;cv.classList.remove("drag");};
  window.onmousemove=e=>{ if(!dn)return; cv.scrollLeft=sl-(e.pageX-sx); cv.scrollTop=st-(e.pageY-sy); };
}

/* ============================ BROWSE JV (read-only) ============================ */
// A real tree: Countries and Divisions at the top, Departments and Teams beneath.
let bUnit = null, bType = "", bQuery = "";

LENS.browse = () => {
  const el = document.getElementById("view");

  if(!bUnit){
    const q = bQuery.toLowerCase();
    const match = u => !q || String(f(u,"Name")).toLowerCase().includes(q)
      || unitObjectives(u.id).some(o=>String(f(o,"Title")||"").toLowerCase().includes(q));
    const roots = unitsSorted(unitRoots().filter(u=>(!bType || f(u,"Type")===bType)));
    const shown = roots.filter(u => match(u) || unitTree(u.id).some(id=>{const c=rec("units",id); return c && match(c);}));

    el.innerHTML = `
      <div class="head">
        <div><h1>Browse JV</h1>
          <div class="sub">Every country, division, department and team. Look around all you like — nothing here can be changed.</div></div>
        <div class="filters">
          <select class="sm" id="bt"><option value="">Countries &amp; divisions</option>
            <option ${bType==="Country"?"selected":""}>Country</option>
            <option ${bType==="Division"?"selected":""}>Division</option></select>
          <input class="sm" id="bq" placeholder="Search units or objectives…" value="${esc(bQuery)}" style="width:230px"/>
        </div>
      </div>
      ${["Country","Division"].filter(t=>!bType||t===bType).map(t=>{
        const gs = shown.filter(u=>f(u,"Type")===t);
        if(!gs.length) return "";
        return `<div style="margin-bottom:20px">
          <div class="eyebrow" style="margin-bottom:8px">${t==="Country"?"COUNTRIES":"DIVISIONS"}</div>
          <div class="lib">${gs.map(unitCard).join("")}</div>

    document.getElementById("bt").onchange = e=>{bType=e.target.value; render();};
    const qb = document.getElementById("bq");
    qb.oninput = e=>{ bQuery=e.target.value; render();

    document.querySelectorAll("[data-unit]").forEach(c=>c.onclick=()=>{bUnit=c.dataset.unit; render(); scrollTo(0,0);});
    return;
  }

  /* --- one unit, read-only, with its children --- */
  const U = rec("units", bUnit);
  if(!U){ bUnit=null; return render(); }
  const kids = unitsSorted(unitChildren(U.id));
  const own = live(DB.objectives.filter(o=>one(o,"Org Unit")===U.id));   // this unit's own objectives
  const all = unitObjectives(U.id);                                       // including everything beneath
  const people = DB.people.filter(p=>one(p,"Org Unit")===U.id);
  const avg = all.length ? Math.round(all.reduce((a,o)=>a+objProgress(o),0)/all.length*100) : 0;
  const parent = unitParent(U);

  el.innerHTML = `
    <div class="head">
      <div>
        <div class="eyebrow">${esc(unitCrumb(U))}</div>
        <h1>${esc(f(U,"Name"))}</h1>
        <div class="sub">${esc(f(U,"Type")||"")} · ${all.length} objective${all.length===1?"":"s"} across this unit and everything under it · ${avg}% average · read-only</div>
      </div>
      <div class="filters">
        ${parent?`<button class="btn ghost" data-up="${parent.id}">↑ ${esc(f(parent,"Name"))}</button>`:""}
        <button class="btn ghost" id="bback">← All of JV</button>
      </div>
    </div>

    ${kids.length?`<div class="card">
      <h2>Inside ${esc(f(U,"Name"))}</h2>
      <div class="cap">Departments and teams. Click to go down a level.</div>
      <div class="lib">${kids.map(unitCard).join("")}</div>
    </div>`:""}

    ${people.length?`<div class="card"><h2>Who's here</h2>
      <div class="roster" style="margin-top:8px">${people.map(p=>`<span class="p">${esc(f(p,"Name"))}${f(p,"Role")?` · ${esc(f(p,"Role"))}`:""}</span>`).join("")}</div>
    </div>`:""}

    ${own.length ? own.map(objCardRO).join("")
      : `<div class="card empty">${esc(f(U,"Name"))} hasn't written any objectives of its own${kids.length?" — look inside the units above":""}.</div>`}`;

  document.getElementById("bback").onclick = ()=>{bUnit=null; render(); scrollTo(0,0);};
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{bUnit=b.dataset.up; render(); scrollTo(0,0);});

function unitCard(u){
  const objs = unitObjectives(u.id);
  const avg = objs.length ? Math.round(objs.reduce((a,o)=>a+objProgress(o),0)/objs.length*100) : 0;
  const mix = ["On track","At risk","Off track"].map(c=>objs.filter(o=>f(o,"Confidence")===c).length);
  const quiet = objs.filter(isStale).length;
  const kids = unitChildren(u.id);
  return `<div class="res" style="cursor:pointer" data-unit="${u.id}">
    <span class="mono">${esc(f(u,"Type")||"")}</span>
    <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:16px;margin-top:5px">${esc(f(u,"Name"))}</div>
    <div class="mono">${objs.length} objective${objs.length===1?"":"s"}${kids.length?` · ${kids.length} unit${kids.length===1?"":"s"} inside`:""}${unitPeople(u.id).length?` · ${unitPeople(u.id).length} people`:""}</div>
    <div class="prog" style="margin-top:9px"><span style="width:${avg}%;background:var(--jv-deep)"></span></div>
    <div class="mono" style="margin-top:5px">${avg}% average</div>
    <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap">
      ${mix[0]?`<span class="pill p-on">${mix[0]} on</span>`:""}
      ${mix[1]?`<span class="pill p-risk">${mix[1]} risk</span>`:""}
      ${mix[2]?`<span class="pill p-off">${mix[2]} off</span>`:""}
      ${quiet?`<span class="pill p-stale">${quiet} quiet</span>`:""}
      ${!objs.length?`<span class="pill p-none">nothing written</span>`:""}

  </div>`;
}

/* ============================ MY WORK (leader view) ============================ */
let leaderId = null;
let mineKr = null, mineNotesOpen = null, mineDoneOpen = false, mineTasksOpen = false, mineNotesFull = new Set();   // My OKR page state
const fmtNote = line => {
  const m = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}) · (.+?) — ([\s\S]*)$/);
  return m ? `<span class="n-when">${esc(fmt(m[1]))} ${esc(m[1].slice(11))}</span> <b>${esc(m[2].split(" ")[0])}</b> — ${esc(m[3])}` : esc(line);
};
const PROG_WORD = p => p>=100 ? "done" : p>=70 ? "nearly there" : p>=35 ? "underway" : p>0 ? "just started" : "not started";

V.mine = () => {
  const L = ME;
  const el = document.getElementById("view");
  const first = (f(L,"Name")||"").split(" ")[0];
  const hr = new Date().getHours();
  const greet = hr<12 ? "Morning" : hr<18 ? "Afternoon" : "Evening";
  const mine = myOkrs(L.id);
  const people = DB.people.filter(p=>f(p,"Active")!==false).sort((a,b)=>(f(a,"Name")||"").localeCompare(f(b,"Name")||""));

  // tasks handed to me that I haven't accepted yet — they wait at the door
  const asks = DB.tasks.filter(t=>lnk(t,"Owner").includes(L.id) && !f(t,"Seen")
    && f(t,"Status")!=="Done" && one(t,"Created by") && one(t,"Created by")!==L.id);
  const accepted = t => f(t,"Seen") || !one(t,"Created by") || one(t,"Created by")===L.id;
  const myOpen = DB.tasks.filter(t=>lnk(t,"Owner").includes(L.id) && f(t,"Status")!=="Done")
    .sort((a,b)=>(f(a,"Due date")||"9999")<(f(b,"Due date")||"9999")?-1:1);

  const duePhrase = t => {
    const d = f(t,"Due date"); if(!d) return "no date on it";
    if(d<iso(TODAY)) return `meant for ${fmt(d)}`;
    if(d===iso(TODAY)) return "due today";
    return `due ${fmt(d)}`;
  };
  const krOf = t => rec("krs", one(t,"Key Result"));
  const noteLines = t => (f(t,"Notes")||"").split("\n").filter(x=>x.trim());

  const slider = t => `
    <input type="range" class="tprog" data-tprog="${t.id}" min="0" max="100" step="10" value="${pct(f(t,"Progress"))}" style="--p:${pct(f(t,"Progress"))}%" title="Slide it — just started to nearly there"/>
    <span class="sliderword" id="tw-${t.id}">${PROG_WORD(pct(f(t,"Progress")))}</span>`;

  const noteBox = t => { if(mineNotesOpen!==t.id) return "";
    const ls = noteLines(t), full = mineNotesFull.has(t.id), show = full ? ls : ls.slice(-1);
    return `<div class="notes">
      <div class="addrow" style="margin:0 0 8px"><input type="text" id="nnt-${t.id}" placeholder="Jot a note — it's signed with your name"/><button class="btn dash" data-noteadd="${t.id}">Add</button></div>
      ${ls.length>1 ? `<div class="donehead" style="margin:0 0 6px" data-morenotes="${t.id}">${full?"▾ hide earlier notes":`▸ ${ls.length-1} earlier note${ls.length>2?"s":""}`}</div>` : ""}
      ${show.map(n=>`<div class="noteline">${fmtNote(n)}</div>`).join("") || `<div class="cap">Notes are how the team talks — first one's yours.</div>`}
    </div>`; };

  const row = (t, showOwner, markMine) => `
    <div class="task ${isLate(t)?"late":""} ${markMine && lnk(t,"Owner").includes(L.id)?"minerow":""}">
      <input type="checkbox" data-mtask="${t.id}"/>
      <span class="t">${esc(f(t,"Title"))}${!f(t,"Seen") && one(t,"Created by") && one(t,"Created by")!==one(t,"Owner") ? ` <span class="pill p-risk" style="font-size:9px">new · from ${esc((nm("people",one(t,"Created by"))||"").split(" ")[0])}</span>` : ""}
        <div class="mono" style="color:var(--ink-3);cursor:pointer" data-notes="${t.id}">${!markMine && krOf(t)?esc(f(krOf(t),"Title"))+" · ":""}${duePhrase(t)}${noteLines(t).length?` · ${noteLines(t).length} note${noteLines(t).length>1?"s":""} ▾`:" · + note"}</div>
      </span>
      ${slider(t)}
      ${showOwner ? `<select class="towner" data-towner="${t.id}" title="Who's carrying this">${people.map(p=>`<option value="${p.id}" ${p.id===one(t,"Owner")?"selected":""}>${esc((f(p,"Name")||"").split(" ")[0])}</option>`).join("")}</select>` : ""}
      <input type="date" class="tdue" data-tdue="${t.id}" value="${f(t,"Due date")||""}" title="Due date"/>
      <span class="m xdel" data-tdel="${t.id}" title="Delete">✕</span>
    </div>${noteBox(t)}`;

  // one sentence of why any of this matters — from the first objective that has key results
  const primary = mine.find(o=>objKrs(o.id).length) || mine[0];
  let orient = "";
  if(primary){
    const lk = ladderKr(primary);
    orient = `Your team is working toward <b>${esc(f(primary,"Title"))}</b>` +
      (lk ? ` — part of JV seeing <b>${esc(f(lk,"Title"))}</b>.` :
       supportsJv(primary) ? ` — supporting JV 2030 in its own way.` :
       ` — standing on its own, and that's honest.`);
  }

  // the full workspace inside an opened key result
  const workspace = kr => {
    const all = krTasks(kr.id);
    const open = all.filter(t=>f(t,"Status")!=="Done")
      .sort((a,b)=>(f(a,"Due date")||"9999")<(f(b,"Due date")||"9999")?-1:1);
    const dones = all.filter(t=>f(t,"Status")==="Done").sort((a,b)=>(f(b,"Done date")||"")<(f(a,"Done date")||"")?-1:1);
    const cur = f(kr,"Current value")??0, tgt = f(kr,"Target value")??0, unit = f(kr,"Unit")||"";
    const conf = f(kr,"Confidence")||"Not started", p = pct(f(kr,"Progress"));
    const tp = all.length ? Math.round(all.reduce((s,t)=>s+(f(t,"Status")==="Done"?1:(f(t,"Progress")||0)),0)/all.length*100) : 0;
    const dirw = krDir(kr);
    const numline = dirw==="down" ? `<b>${cur}${esc(unit)}</b> now — aiming below ${tgt}${esc(unit)} · <b>${p}%</b> of the way`
                  : dirw==="hold" ? `<b>${cur}${esc(unit)}</b> — holding above ${tgt}${esc(unit)}${cur>=tgt?" ✓":""}`
                  : unit==="%" && tgt===100 ? `<b>${cur}%</b> of the way there`
                  : `${cur} of ${tgt}${esc(unit)} so far — <b>${p}%</b> of the way`;
    return `
      ${f(kr,"How we'll know")?`<div class="cap">${esc(f(kr,"How we'll know"))}</div>`:""}
      <div class="orient" style="margin:2px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><span>${numline}. <span class="pill ${cls(conf)}" style="vertical-align:1px">${esc(conf)}</span></span>${krStamp(kr)}</div>
      ${(()=>{ const st2=f(kr,"Start value")||0, tv=(f(kr,"Target value")??0);
        const uo = rec("units", one(rec("objectives", one(kr,"Objective"))||{},"Org Unit"));
        const midD = uo && f(uo,"Midterm date"), retD = uo && f(uo,"Retro date");
        const marks=(f(kr,"History")||"").split("\n").filter(x=>/^\d{4}-\d{2}-\d{2}/.test(x))
          .map(l=>{const i=l.indexOf(" · "); return {d:l.slice(0,10), v:+l.slice(i+3)};})
          .filter(m=>!isNaN(m.v));
        // the first value-change on/after each meeting date wears the meeting's ring
        const flag=(date,name)=>{ if(!date || date>iso(TODAY)) return; const m=marks.find(x=>x.d>=date); if(m && !m.kind) m.kind=name; };
        flag(midD,"midterm"); flag(retD,"retro");
        const shown = marks.slice(-5).map(m=>({...m, pos:pct((m.v-st2)/((tv-st2)||1))}));
        return `<div class="prog big hist ${shown.some(m=>m.kind)?"hasmeet":""}"><span style="width:${p}%;background:${col(conf)}"></span>
          ${shown.map(m=>m.kind
            ? `<i class="hmark hmeet" style="left:${m.pos}%" title="${m.v} on ${esc(fmt(m.d))}"></i><b class="hlabel" style="left:${m.pos}%">${m.kind} · ${esc(fmt(m.d))}</b>`
            : `<i class="hmark" style="left:${m.pos}%" title="${m.v} on ${esc(fmt(m.d))}"></i>`).join("")}</div>
        ${shown.some(m=>!m.kind)?`<div class="hdates">${shown.filter(m=>!m.kind).map(m=>`<span style="left:${m.pos}%">${esc(fmt(m.d))}</span>`).join("")}</div>`:""}`; })()}
      <div class="krviz-sub">The work under it: ${dones.length} of ${all.length} finished <div class="prog"><span style="width:${tp}%;background:var(--jv)"></span></div></div>
      <div class="addrow" style="margin:14px 0 10px">
        <input type="text" id="mnt" placeholder="Add a task — small and real beats big and vague"/>
        <select class="sm" id="mnw" title="Who's carrying it">${people.map(pp=>`<option value="${pp.id}" ${pp.id===L.id?"selected":""}>${esc(f(pp,"Name"))}</option>`).join("")}</select>
        <input type="date" class="tdue" id="mnd" title="By when"/>
        <button class="btn dash" id="madd">Add</button>
      </div>
      ${open.map(t=>row(t,true,true)).join("") || `<div class="empty">No open tasks here${dones.length?" — everything's in the record below":""}. Add the next one above.</div>`}
      ${dones.length ? `
        <div class="donehead" data-donetog>${mineDoneOpen?"▾":"▸"} What's already moved (${dones.length})</div>
        ${mineDoneOpen ? dones.map(t=>`<div class="task done">
          <input type="checkbox" checked data-mundo="${t.id}" title="Bring it back"/>
          <span class="t">${esc(f(t,"Title"))}</span>
          <span class="m">${esc((nm("people",one(t,"Owner"))||"").split(" ")[0])} · ${fmt(f(t,"Done date"))||"done"}</span>
        </div>`).join("") : ""}` : ""}
      <div class="cap" style="margin-top:18px">Notes on this key result — say it here and the team sees it</div>
      <div class="addrow" style="margin:6px 0 8px"><input type="text" id="knt" placeholder="Something about this key result, not one task? Write it — it's signed and kept"/><button class="btn dash" data-krnote="${kr.id}">Add</button></div>
      ${(()=>{ const ls=(f(kr,"Notes")||"").split("\n").filter(x=>x.trim()), kk="kr:"+kr.id, full=mineNotesFull.has(kk), show=full?ls:ls.slice(-1);
        return (ls.length>1 ? `<div class="donehead" style="margin:0 0 6px" data-morenotes="${kk}">${full?"▾ hide earlier notes":`▸ ${ls.length-1} earlier note${ls.length>2?"s":""}`}</div>` : "")
          + show.map(n=>`<div class="noteline">${fmtNote(n)}</div>`).join(""); })()}`;
  };

  el.innerHTML = `
    <div class="head"><div><h1>${greet}, ${esc(first)}.</h1>
      ${orient?`<div class="orient">${orient}${primary?` &nbsp;${seasonStampO(primary)}`:""}</div>`:`<div class="orient">You're not on any key results yet — when your team's OKRs have them, this page comes alive.</div>`}</div></div>

    ${!localStorage.getItem("jvMineIntro") ? `<div class="intro">
      This page is your corner of the team's work. Your tasks are up top, and each key result opens into the full workspace.
      Notes are how you talk to each other, and they're kept. Nothing here is a grade.
      <div style="margin-top:8px"><button class="btn dash" data-intro>Got it</button></div>
    </div>` : ""}

    ${asks.map(t=>{ const k2=krOf(t);
      return `<div class="newtask"><span style="color:var(--jv-deep)">✦</span>
        <div class="nt-main"><b>${esc(nm("people",one(t,"Created by")).split(" ")[0])} asked you to pick up:</b> ${esc(f(t,"Title"))}
          <div class="cap">${duePhrase(t)}${k2?` · under ${esc(f(k2,"Title"))}`:""}</div></div>
        <button class="btn dash" data-seen="${t.id}" data-krto="${k2?k2.id:""}">I've got it</button></div>`;}).join("")}

    <div class="wobj ${mineTasksOpen?"open":""}">
      <div class="wobj-top" data-mytog>
        <span class="chev">▶</span>
        <div class="wobj-main"><div class="wobj-title">My open tasks</div></div>
        <div class="wobj-side"><span class="pill ${myOpen.some(isLate)?"p-off":"p-none"}">${myOpen.length} open${myOpen.filter(isLate).length?` · ${myOpen.filter(isLate).length} overdue`:""}</span></div>
      </div>
      <div class="wobj-body">
        ${mineTasksOpen ? (myOpen.map(t=>row(t,false,false)).join("") || `<div class="empty">Nothing on your plate. Open a key result below and add a task — or take the quiet as a gift.</div>`) : ""}
      </div>
    </div>

    ${mine.map(o=>{
      const krs = objKrs(o.id); if(!krs.length) return "";
      return `<div class="unit-label" style="margin-top:18px">${esc(f(o,"Title"))}</div>

          const kc = f(k,"Confidence")||"Not started", kp = pct(f(k,"Progress"));

              <span class="chev">▶</span>
              <div class="wobj-main">
                <div class="wobj-title">${esc(f(k,"Title"))}</div>
                ${f(k,"How we'll know")?`<div class="cap">${esc(f(k,"How we'll know"))}</div>`:""}
                <div class="prog" style="max-width:220px;margin-top:6px"><span style="width:${kp}%;background:${col(kc)}"></span></div>
              </div>
              <div class="wobj-side">
                <span class="pill p-none">${openN} open task${openN===1?"":"s"}</span>
                <span class="wobj-pct">${kp}%</span>
              </div>
            </div>
            <div class="wobj-body">${isOpen ? workspace(k) : ""}</div>
          </div>`;}).join("")}`;
    }).join("") || `<div class="empty" style="margin-top:14px">No team OKRs yet. That's the conversation to have.</div>`}`;

  // ── wiring ──────────────────────────────────────────────────
  el.querySelectorAll("[data-intro]").forEach(b=>b.onclick=()=>{ localStorage.setItem("jvMineIntro","1"); V.mine(); });
  el.querySelectorAll("[data-mytog]").forEach(h=>h.onclick=()=>{ mineTasksOpen=!mineTasksOpen; V.mine(); });
  el.querySelectorAll("[data-krtog]").forEach(h=>h.onclick=()=>{
    mineKr = mineKr===h.dataset.krtog ? null : h.dataset.krtog; mineNotesOpen=null; V.mine(); });
  el.querySelectorAll(".wobj-body input, .wobj-body .addrow, .wobj-body select").forEach(n=>n.addEventListener("click",e=>e.stopPropagation()));
  el.querySelectorAll("[data-seen]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.krto) mineKr=b.dataset.krto;
    await patch(T.tasks,[{id:b.dataset.seen, fields:{Seen:true}}]);
    await reload("tasks"); toast("It's on your page now"); V.mine(); });

  const finish = async id => {
    await patch(T.tasks,[{id, fields:{Status:"Done","Done date":iso(TODAY),Progress:1}}]);
    await reload("tasks"); toast("Done — it's in the record"); V.mine();
  };
  el.querySelectorAll("input[data-mtask]").forEach(c=>c.onchange=()=>finish(c.dataset.mtask));
  el.querySelectorAll("input[data-mundo]").forEach(c=>c.onchange=async()=>{
    await patch(T.tasks,[{id:c.dataset.mundo, fields:{Status:"Open","Done date":null}}]);
    await reload("tasks"); toast("Back on the plate"); V.mine(); });

  el.querySelectorAll("input[data-tprog]").forEach(s=>{
    s.oninput = ()=>{ s.style.setProperty("--p", s.value+"%"); const w=document.getElementById("tw-"+s.dataset.tprog); if(w) w.textContent=PROG_WORD(+s.value); };
    s.onchange = async()=>{
      await patch(T.tasks,[{id:s.dataset.tprog, fields:{Progress:+s.value/100}}]);
      await reload("tasks"); V.mine();
    };
  });
  el.querySelectorAll("[data-towner]").forEach(s=>s.onchange=async()=>{
    const who=s.value;
    await patch(T.tasks,[{id:s.dataset.towner, fields:{Owner:[who], Seen: who===L.id}}]);
    await reload("tasks"); toast(who===L.id?"Yours now":`Handed to ${nm("people",who).split(" ")[0]} — they'll be asked on their page`); V.mine(); });
  el.querySelectorAll("input[data-tdue]").forEach(d=>{ if(d.id==="mnd") return; d.onchange=async()=>{
    await patch(T.tasks,[{id:d.dataset.tdue, fields:{"Due date":d.value||null}}]);
    await reload("tasks"); toast(d.value?"Due "+fmt(d.value):"Date cleared"); V.mine(); }; });
  el.querySelectorAll("[data-tdel]").forEach(x=>x.onclick=async()=>{
    if(!confirm(`Delete "${nm("tasks",x.dataset.tdel)}"?`)) return;
    try{ await del(T.tasks,[x.dataset.tdel]); await reload("tasks"); toast("Gone"); V.mine(); }
    catch(e){ toast(e.message,true); }
  });
  el.querySelectorAll("[data-morenotes]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.morenotes; mineNotesFull.has(k)?mineNotesFull.delete(k):mineNotesFull.add(k); V.mine(); });
  el.querySelectorAll("[data-notes]").forEach(n=>n.onclick=()=>{
    mineNotesOpen = mineNotesOpen===n.dataset.notes ? null : n.dataset.notes; V.mine(); });

  const noteStamp = txt => {
    const now=new Date();
    return `${iso(now)} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")} · ${f(L,"Name")} — ${txt}`;
  };
  const saveNote = async (tid, inp) => {
    const txt=(inp.value||"").trim(); if(!txt) return;
    const prev=f(rec("tasks",tid),"Notes")||"";
    await patch(T.tasks,[{id:tid, fields:{Notes: prev?prev+"\n"+noteStamp(txt):noteStamp(txt)}}]);
    await reload("tasks"); toast("Noted"); V.mine();
  };
  el.querySelectorAll("[data-noteadd]").forEach(b=>{
    const inp=document.getElementById("nnt-"+b.dataset.noteadd);
    b.onclick=()=>saveNote(b.dataset.noteadd, inp);
    if(inp) inp.addEventListener("keydown",e=>{ if(e.key==="Enter") saveNote(b.dataset.noteadd, inp); });
  });

  el.querySelectorAll("[data-krnote]").forEach(b=>{
    const inp=document.getElementById("knt");
    const saveKr = async () => {
      const txt=(inp.value||"").trim(); if(!txt) return;
      const prev=f(rec("krs",b.dataset.krnote),"Notes")||"";
      await patch(T.krs,[{id:b.dataset.krnote, fields:{Notes: prev?prev+"\n"+noteStamp(txt):noteStamp(txt)}}]);
      await reload("krs"); toast("Noted — the team will see it"); V.mine();
    };
    b.onclick=saveKr;
    if(inp) inp.addEventListener("keydown",e=>{ if(e.key==="Enter") saveKr(); });
  });

  const addTask = async () => {
    const inp=document.getElementById("mnt"), title=inp.value.trim();
    if(!title) return;
    const who=document.getElementById("mnw").value;
    await post(T.tasks,[{fields:{Title:title, Status:"Open", "Key Result":[mineKr], Owner:[who],
      "Due date":document.getElementById("mnd").value||null, Seen: who===L.id}}]);
    await reload("tasks"); toast(who===L.id?"On your plate":`${nm("people",who).split(" ")[0]} will be asked on their page`); V.mine();
  };
  const madd=document.getElementById("madd");
  if(madd){ madd.onclick=addTask;
    document.getElementById("mnt").addEventListener("keydown",e=>{ if(e.key==="Enter") addTask(); }); }
  const dt=el.querySelector("[data-donetog]");
  if(dt) dt.onclick=()=>{ mineDoneOpen=!mineDoneOpen; V.mine(); };
};

/* ============================ TEAM — the rhythm page ============================ */
let TC = null, seasonOpen = false, teamMeetTab;   // team check-in · season accordion · open meeting tab

let teamUnitOverride = null;   // coaches step into any team's room; null = my own
const teamUnit = () => rec("units", teamUnitOverride || one(ME,"Org Unit"));
const teamObjectives = () => { const u = teamUnit(); return u ? live(DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year" && one(o,"Org Unit")===u.id)) : []; };
const teamCycle = () => {
  const cyc = teamObjectives().map(o=>rec("cycles", one(o,"Cycle"))).filter(Boolean);
  return cyc.find(c=>f(c,"Type")==="Trimester") || cyc[0] || null;
};

V.team = () => {
  const el = document.getElementById("view");
  const u = teamUnit();
  if(!u){ el.innerHTML = `<div class="head"><div><h1>Team</h1><div class="sub">You're not on a team yet — ask ${nm("people", null)||"Mike or Mel"} to put you on one in Org.</div></div></div>`; return; }
  const objs = teamObjectives();
  const cycle = teamCycle();
  const mates = myTeammates(ME.id);
  const leaderName = nm("people", one(u,"Leader")) || "";
  const mid = f(u,"Midterm date"), ret = f(u,"Retro date"), ntd = f(u,"New trimester date");
  const cs = cycle && f(cycle,"Start"), ce = cycle && f(cycle,"End");
  const canSetDates = iAmLeader();

  // where are we in the season?
  const posOf = d => { if(!cs||!ce||!d) return null;
    const a=new Date(cs).getTime(), b=new Date(ce).getTime(), x=new Date(d).getTime();
    if(b<=a) return null; return Math.max(0, Math.min(100, Math.round((x-a)/(b-a)*100))); };
  const todayPos = posOf(iso(TODAY)), midPos = posOf(mid), retPos = posOf(ret);

  const meetingCard = (label, val, field, past) => `
    <div class="meet ${past?"past":""}">
      <div class="cap">${label}</div>
      <div class="meet-date">${val ? fmt(val)+" "+new Date(val).getFullYear() : "not set yet"}</div>
      ${canSetDates ? `<input type="date" class="tdue" data-udate="${field}" value="${val||""}" title="Set the date"/>`
        : (val ? "" : `<div class="cap">${leaderName?esc(leaderName)+" sets this":"your leader sets this"}</div>`)}
    </div>`;

  const edge = p => p>86 ? "transform:translateX(-92%)" : p<8 ? "transform:translateX(-8%)" : "";
  const seasonBar = cs&&ce ? `<div class="season-bar">
      <span class="season-fill" style="width:${todayPos??0}%"></span>
      ${midPos!==null?`<span class="season-dot" style="left:${midPos}%"></span><b class="hlabel" style="left:${midPos}%;top:-19px;${edge(midPos)}">midterm${mid?" · "+esc(fmt(mid)):""}</b>`:""}
      ${retPos!==null?`<span class="season-dot" style="left:${retPos}%"></span><b class="hlabel" style="left:${retPos}%;top:-19px;${edge(retPos)}">retro${ret?" · "+esc(fmt(ret)):""}</b>`:""}

  const meetingBlock = (type, label, date, forced) => {

    const days = Math.round((new Date(date)-TODAY)/864e5);
    const open = DB.reviews.filter(r=>f(r,"Type")===type && f(r,"Status")!=="Closed" && objs.some(o=>o.id===one(r,"Objective")));

    const carries = DB.responses
      .filter(x=>retroRevs.some(r=>lnk(x,"Review").includes(r.id)) && (f(x,"R — Carrying forward, leaving behind")||"").trim())

    return `<div class="card">
    <h2>New trimester${(f(u,"New trimester date"))?` · ${fmt(f(u,"New trimester date"))}`:""}</h2>
    <div class="cap">Retro done? Plan the new one in the same sitting — that's the rhythm you and Mike set.</div>
    ${carries.length?`<div class="since" style="margin-top:10px">
      <div class="cap">What the team is carrying forward</div>
      ${carries.map(c=>`<div class="noteline"><b>${esc(c.who)}</b> — ${esc(c.txt)}</div>`).join("")}
    </div>`:`<div class="cap" style="margin-top:8px">Once the retro answers are in, the team's "carrying forward" words appear here to build from.</div>`}
    <div style="font-size:13.5px;line-height:1.7;margin-top:8px">
      Write the new objectives with these words on the table — the <b>Sounding Board</b> will think it through with you
      and press gently toward the behavioral change it should lead to. Then set the new season's midterm and retro dates above.</div>
    <div style="margin-top:12px"><button class="btn jv" id="gotoOkrs">Write the new objective with the Sounding Board →</button></div>
  </div>`; };
  // which meeting greets you: the one that's near, open, or due
  if(teamMeetTab===undefined){
    const near = d => d && Math.round((new Date(d)-TODAY)/864e5)<=10 && Math.round((new Date(d)-TODAY)/864e5)>=-3;
    const openT = t => DB.reviews.some(r=>f(r,"Type")===t && f(r,"Status")!=="Closed" && objs.some(o=>o.id===one(r,"Objective")));
    teamMeetTab = (near(mid)||openT("Midterm")) ? "Midterm"
                : (near(ret)||openT("Retrospective")) ? "Retrospective"
                : (ret && ret<iso(TODAY) && daysPast(ret)<=30) ? "newtri" : null;
  }

  el.innerHTML = `
    <div class="head"><div><h1>${esc(f(u,"Name"))}</h1>
      <div class="sub">${mates.length} of us${leaderName?` · led by ${esc(leaderName)}`:""}${(c=>c?` · ${esc(c.name)}${c.phase?`, ${c.phase}`:""}`:"")(cyclePos(cycle))} · one team, one rhythm.</div></div>
      <div class="filters">
        ${iAmCoach() ? `<select class="sm" id="tmpick" title="Step into any team's room">${unitsSorted(DB.units).filter(x=>f(x,"Active")!==false).map(x=>`<option value="${x.id}" ${x.id===u.id?"selected":""}>${esc(f(x,"Name"))}</option>`).join("")}</select>` : ""}
        ${iAmLeader() ? `<button class="btn" id="tmnew">+ New objective</button>` : ""}
      </div></div>

    <div class="meetbtns">
      <button class="mtb ${teamMeetTab==="Midterm"?"on":""}" data-meettab="Midterm">Midterm review${mid?`<span>${fmt(mid)}</span>`:`<span>no date yet</span>`}</button>
      <button class="mtb ${teamMeetTab==="Retrospective"?"on":""}" data-meettab="Retrospective">Retrospective${ret?`<span>${fmt(ret)}</span>`:`<span>no date yet</span>`}</button>
      <button class="mtb ${teamMeetTab==="newtri"?"on":""}" data-meettab="newtri">New trimester${ntd?`<span>${fmt(ntd)}</span>`:`<span>no date yet</span>`}</button>
    </div>
    ${teamMeetTab==="Midterm" ? meetingBlock("Midterm","Midterm review",mid,true)
     : teamMeetTab==="Retrospective" ? meetingBlock("Retrospective","Retrospective",ret,true)
     : teamMeetTab==="newtri" ? newTriCard(true) : ""}

    <div class="wobj ${seasonOpen?"open":""}">
      <div class="wobj-top" data-seasontog>
        <span class="chev">▶</span>
        <div class="wobj-main"><div class="wobj-title">The season</div>
          ${seasonBar?`<div class="season" style="margin:26px 6px 4px 0">${seasonBar}</div>`:""}</div>
        ${!mid&&!ret?`<div class="wobj-side"><span class="pill p-none">meeting dates not set</span></div>`:""}
      </div>
      <div class="wobj-body">${seasonOpen ? `
        ${cs&&ce ? `<div class="cap">${fmt(cs)} to ${fmt(ce)} — the darker line is how far we are.</div>`
          : `<div class="cap">This cycle has no start and end dates yet — once it does, the season line appears here.</div>`}
        <div class="meets">
          ${meetingCard("Midterm review", mid, "Midterm date", mid && mid<iso(TODAY))}
          ${meetingCard("Retrospective", ret, "Retro date", ret && ret<iso(TODAY))}
          ${meetingCard("New trimester planning", ntd, "New trimester date", ntd && ntd<iso(TODAY))}
        </div>` : ""}
      </div>
    </div>

    <div class="card">
      <h2>This week's meeting</h2>
      <div class="cap">One sitting, every key result — where is each one, honestly?</div>
      ${objs.map(o=>`<div class="row"><div><strong>${esc(f(o,"Title"))}</strong>
          <div class="why">${objKrs(o.id).length} key result${objKrs(o.id).length===1?"":"s"} · last check-in ${staleDays(o)===999?"never":staleDays(o)+"d ago"}</div></div>
        <span class="pill ${cls(f(o,"Confidence")||"Not started")}">${esc(f(o,"Confidence")||"Not started")}</span></div>`).join("")
        || `<div class="empty">No objectives on this team yet.</div>`}
      ${objs.length?`<div style="margin-top:12px"><button class="btn jv" id="teamci">Run this week's check-in →</button></div>`:""}
    </div>


    <div class="card">
      <h2>The record</h2><div class="cap">What this team has said, week by week.</div>
      ${(()=>{ const feed = DB.checkins.filter(c=>objs.some(o=>lnk(c,"Objective").includes(o.id)))
          .sort((a,b)=>new Date(f(b,"Date"))-new Date(f(a,"Date"))).slice(0,12);
        return feed.length ? feed.map(c=>`<div style="border-left:2px solid ${col(f(c,"Confidence"))};padding:4px 0 4px 11px;margin-bottom:11px">
            <div class="mono">${fmt(f(c,"Date"))} · ${esc(nm("people",one(c,"Person")))} · ${esc(f(c,"Confidence")||"")}</div>
            <div style="font-size:13.5px">${esc(f(c,"What moved")||"")}</div></div>`).join("")
          : `<div class="empty">No check-ins yet. The first weekly meeting starts the story.</div>`; })()}
    </div>`;

  const tmpick = document.getElementById("tmpick");
  if(tmpick) tmpick.onchange = ()=>{ teamUnitOverride = tmpick.value===one(ME,"Org Unit") ? null : tmpick.value; teamMeetTab=undefined; TC=null; V.team(); };
  const tmnew = document.getElementById("tmnew");
  if(tmnew) tmnew.onclick = ()=>{ okrsOpenNew=true; VIEW="okrs"; drawChrome(); render(); scrollTo(0,0); };

    await patch(T.units,[{id:u.id, fields:{[d.dataset.udate]: d.value||null}}]);
