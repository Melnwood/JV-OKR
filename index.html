/* ============================ FILE DROP ============================ */
function dropzone(el, cb){
  if(!el) return;
  const inp = document.createElement("input");
  inp.type="file"; inp.multiple=true; inp.style.display="none"; el.appendChild(inp);
  el.onclick = e => { if(e.target!==inp) inp.click(); };
  inp.onchange = () => cb([...inp.files]);
  el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
  el.ondragleave = () => el.classList.remove("over");
  el.ondrop = e => { e.preventDefault(); el.classList.remove("over"); cb([...e.dataTransfer.files]); };
}

/* ============================ SIGN IN ============================ */
// Google verifies who you are. The function decides what you may see.
// Nothing loads until both have happened.

function gate(html){
  document.getElementById("bar").style.display = "none";
  document.getElementById("view").className = "";
  document.getElementById("view").innerHTML =
    `<div class="card" style="max-width:520px;margin:60px auto;text-align:center">
       <img src="icon.svg" width="52" height="52" style="border-radius:12px"/>
       ${html}
     </div>`;
}

function signOut(){
  ID_TOKEN = null;
  try{ sessionStorage.removeItem("jvokr.tok"); }catch(e){}
  google.accounts.id.disableAutoSelect();
  location.reload();
}

async function onGoogle(res){
  ID_TOKEN = res.credential;
  try{ sessionStorage.setItem("jvokr.tok", ID_TOKEN); }catch(e){}
  await start();
}

async function start(){
  const r = await fetch(`${API}?action=me`, {headers: authHeaders()});
  const j = await r.json();
  if(!r.ok){
    ID_TOKEN = null;
    try{ sessionStorage.removeItem("jvokr.tok"); }catch(e){}
    return gate(`<h2 style="margin-top:12px">Can't let you in</h2>
      <div class="cap" style="color:var(--clay)">${esc(j.error||"Sign-in failed")}</div>
      <div id="gbtn" style="display:flex;justify-content:center;margin-top:16px"></div>`)
      || drawButton();
  }
  AUTH = j.me;
  document.getElementById("bar").style.display = "";
  document.getElementById("view").innerHTML = `<div class="card empty">Loading…</div>`;
  try { await load(); }
  catch(e){
    document.getElementById("view").innerHTML =
      `<div class="card" style="max-width:640px"><h2>Couldn't reach the base</h2>
       <div class="cap" style="font-family:'JetBrains Mono',monospace;color:var(--clay);font-size:12.5px">${esc(e.message)}</div>
       <div class="hint">Open <code>${API}?action=diag</code> to see what the function can and can't see.</div></div>`;
    return;
  }
  if(AUTH.isNew) welcome();
}

/* First sign-in: they exist now, but nobody knows where they sit. */
function welcome(){
  const units = unitsSorted(namedUnits());

  // Empty org: don't strand anyone at a dead dropdown.
  if(!units.length){
    document.getElementById("view").innerHTML = `
      <div class="head"><div>
        <h1>Welcome, ${esc(AUTH.name.split(" ")[0])}</h1>
        <div class="sub">You're in.</div>
      </div></div>
      <div class="card" style="max-width:560px">
        ${iAmLeader() ? `
          <h2>Nothing's set up yet — that's your first job</h2>
          <div class="cap">JV's countries, divisions, departments and teams don't exist in here yet.
            Build a couple and everything else has somewhere to live.</div>
          <button class="btn jv wide" id="wOrg">Set up the org →</button>`
        : `
          <h2>Almost ready</h2>
          <div class="cap">The org hasn't been set up yet. Ask Mike or Mel to add your country or division,
            then reload — you'll be able to pick where you sit.</div>`}
      </div>`;
    const org = document.getElementById("wOrg");
    if(org) org.onclick = ()=>{ VIEW="org"; AUTH.isNew=false; drawChrome(); render(); };
    return;
  }

  document.getElementById("view").innerHTML = `
    <div class="head"><div>
      <h1>Welcome, ${esc(AUTH.name.split(" ")[0])}</h1>
      <div class="sub">You're in. One question before you look around.</div>
    </div></div>
    <div class="card" style="max-width:560px">
      <h2>Which unit are you part of?</h2>
      <div class="cap">This is what puts your work on your page — and your name on your team's reviews. You can change it later.</div>
      <div class="field">
        <select id="wArea">
          ${units.map(u=>`<option value="${u.id}">${esc(unitCrumb(u))} · ${esc(f(u,"Type")||"")}</option>`).join("")}
        </select>
      </div>
      <button class="btn wide" id="wGo">That's me</button>
      <div class="hint">You're set up as <b>Staff</b> — you can browse everything across JV, add and tick tasks, log check-ins and answer reviews.
        If you lead a country, division or team, ask Mike to change your role.</div>
    </div>`;
  const sel = document.getElementById("wArea");
  document.getElementById("wGo").onclick = async()=>{
    const unitId = sel.value;
    if(!unitId) return toast("Pick one", true);
    const area = f(rec("units", unitId), "Name");
    const r = await fetch(`${API}?action=setarea`, {method:"POST", headers:authHeaders({"Content-Type":"application/json"}), body:JSON.stringify({unitId, area})});
    const j = await r.json();
    if(!r.ok) return toast(j.error||"Couldn't save", true);
    AUTH = j.me;
    await reload("people");
    ME = DB.people.find(p=>p.id===AUTH.id) || ME;
    toast(`Welcome to ${area}`);
    jvLens = "browse"; VIEW = "jv"; drawChrome(); render();
  };
}

function drawButton(){
  const el = document.getElementById("gbtn");
  if(!el || !window.google) return;
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onGoogle });
  google.accounts.id.renderButton(el, {theme:"outline", size:"large", text:"signin_with", shape:"pill"});
}

let CLIENT_ID = null;
(async () => {
  const cfg = await fetch(`${API}?action=config`).then(r=>r.json()).catch(()=>({}));
  CLIENT_ID = cfg.googleClientId;

  if(!CLIENT_ID)
    return gate(`<h2 style="margin-top:12px">Almost there</h2>
      <div class="cap">Set <code>GOOGLE_CLIENT_ID</code> in the Netlify environment variables and redeploy.
      See the README for how to create it.</div>`);

  const saved = (()=>{ try{ return sessionStorage.getItem("jvokr.tok"); }catch(e){ return null; } })();
  if(saved){ ID_TOKEN = saved; return start(); }

  gate(`<h2 style="margin-top:12px">JV OKR</h2>
    <div class="cap">Sign in with your JV Google account.${cfg.domain?` (${esc(cfg.domain)})`:""}</div>
    <div id="gbtn" style="display:flex;justify-content:center;margin-top:16px"></div>`);
  const wait = setInterval(()=>{ if(window.google){ clearInterval(wait); drawButton(); } }, 120);
})();
