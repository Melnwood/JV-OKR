/* ============================ COACHING CONSOLE ============================ */
let cSel = null, cTab = "notes", cShared = false, cFiles = [];
const cadence = p => f(p,"Coaching cadence (days)") || 21;
const cScore = p => {
  const objs = ownedBy(p.id);
  return objs.filter(o=>f(o,"Confidence")==="Off track").length*3
       + objs.filter(isStale).length*2
       + (f(p,"Overdue for a 1:1") ? 3 : 0)
       + (objs.length===0 && ["Country leader","Division leader","Team leader"].includes(f(p,"Role")) ? 4 : 0);
};
V.coaching = () => {
  const leaders = DB.people.filter(p=>["Country leader","Division leader","Team leader"].includes(f(p,"Role")));
  const pool = leaders.length ? leaders : DB.people;
  if(!cSel || !rec("people",cSel)) cSel = [...pool].sort((a,b)=>cScore(b)-cScore(a))[0]?.id;
  const P = rec("people", cSel);
  const notes = DB.notes.filter(n=>lnk(n,"Person").includes(cSel)).sort((a,b)=>new Date(f(b,"Date"))-new Date(f(a,"Date")));
  const shares = DB.shares.filter(s=>lnk(s,"Person").includes(cSel));
  const objs = P ? ownedBy(P.id) : [];
  const overdue = pool.filter(p=>f(p,"Overdue for a 1:1"));
  const follow = DB.notes.filter(n=>f(n,"Next step") && !f(n,"Follow-up done"));
  const noOkr = pool.filter(p=>!ownedBy(p.id).length);

  document.getElementById("view").innerHTML = `
    <div class="head"><div><h1>Coaching console</h1>
      <div class="sub">Who needs you, what you said, what you gave them. Notes are private unless you share them.</div></div></div>
    <div class="tiles">
      <div class="tile b-off"><div class="v">${overdue.length}</div><div class="l">Overdue for a 1:1</div></div>
      <div class="tile b-ind"><div class="v">${follow.length}</div><div class="l">Open follow-ups</div></div>
      <div class="tile b-risk"><div class="v">${noOkr.length}</div><div class="l">No objectives written</div></div>
      <div class="tile b-ok"><div class="v">${DB.shares.filter(s=>f(s,"Opened")).length}/${DB.shares.length}</div><div class="l">Resources opened</div></div>
    </div>

    <div class="side">
      <div class="card">
        <h2>Coaching queue</h2><div class="cap">Ranked by need, not alphabet.</div>
        ${[...pool].sort((a,b)=>cScore(b)-cScore(a)).map(p=>{
          const o = ownedBy(p.id), bits=[];
          if(!o.length) bits.push("no objectives written");
          if(f(p,"Overdue for a 1:1")) bits.push(`${f(p,"Days since 1:1")===999?"never":f(p,"Days since 1:1")+"d"} since last 1:1`);
          if(o.some(x=>f(x,"Confidence")==="Off track")) bits.push("off-track work");
          if(o.some(isStale)) bits.push("check-ins gone quiet");
          const s = cScore(p), c = s>=6?"var(--clay)":s>=3?"var(--amber)":"var(--moss)";
          return `<div class="qi" data-p="${p.id}" aria-current="${p.id===cSel}">
            <div style="display:flex;justify-content:space-between;gap:8px"><strong style="font-size:13.5px">${esc(f(p,"Name"))}</strong>
              <span style="width:7px;height:7px;border-radius:50%;background:${c};margin-top:6px;flex:none"></span></div>
            <div class="mono">${esc(f(p,"Area")||"")}</div>
            <div class="why">${bits.join(" · ")||"Healthy"}</div></div>`;}).join("")}
      </div>

      <div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline">
            <div><h2>${esc(P?f(P,"Name"):"—")}</h2>
              <div class="cap" style="margin:0">${esc(f(P,"Role")||"")} · ${esc(f(P,"Area")||"")} · last talked ${f(P,"Days since 1:1")===999?"never":f(P,"Days since 1:1")+"d ago"} (cadence ${cadence(P)}d)</div></div>
            <div class="mono">${objs.length} objectives · ${notes.length} notes · ${shares.length} files</div>
          </div>
          <div style="display:flex;gap:5px;border-bottom:1px solid var(--rule);margin:14px 0">
            ${[["notes","Coaching notes"],["files","Files & resources"],["okrs","Their OKRs"]].map(([k,l])=>
              `<button class="nv" data-t="${k}" style="border-radius:0;border-bottom:2px solid ${cTab===k?"var(--ink)":"transparent"};color:${cTab===k?"var(--ink)":"var(--ink-2)"};font-weight:600">${l}</button>`).join("")}
          </div>
          <div id="cpane"></div>
        </div>

        <div class="card">
          <h2>Coaching library</h2><div class="cap">Upload once, share with anyone. You can see who's actually opened it.</div>
          <div class="drop" id="libdrop"><b>Drop a file here, or click to upload</b>Guides, templates, recordings, decks.</div>
          <div class="lib" style="margin-top:12px">
            ${DB.resources.map(r=>{
              const sh = DB.shares.filter(s=>lnk(s,"Resource").includes(r.id));
              const op = sh.filter(s=>f(s,"Opened")).length;
              const url = (f(r,"File")||[])[0]?.url;
              return `<div class="res">
                <span class="mono">${esc(f(r,"Kind")||"File")}</span>
                <div style="font-weight:600;font-size:13.5px;margin:6px 0 3px">${url?`<a href="${url}" target="_blank">${esc(f(r,"Name"))}</a>`:esc(f(r,"Name"))}</div>
                <div class="mono">shared with ${sh.length} · <span class="${op?"seen":"unseen"}">${op} opened</span></div>
                <button class="btn dash" style="margin-top:8px;width:100%;font-size:12px;padding:5px" data-share="${r.id}">Share with ${esc(P?f(P,"Name").split(" ")[0]:"")}</button>
              </div>`;}).join("") || `<div class="empty">Library is empty.</div>`}
          </div>
        </div>

        <div class="card">
          <h2>Send a report</h2><div class="cap">Pulled live from the base — nobody retypes anything.</div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px">
            <select class="sm" id="rpKind"><option>Leadership summary</option><option>Coaching digest (private)</option><option>Nudge to owners who've gone quiet</option></select>
            <button class="btn ghost" id="rpGo">Preview</button>
          </div>
          <div class="report" id="rpOut">Pick a report and press Preview.</div>
        </div>
      </div>
    </div>`;

  document.querySelectorAll(".qi").forEach(q=>q.onclick=()=>{cSel=q.dataset.p; cFiles=[]; render();});
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{cTab=b.dataset.t; render();});
  document.querySelectorAll("[data-share]").forEach(b=>b.onclick=async()=>{
    await post(T.shares, [{fields:{Name:`${nm("resources",b.dataset.share)} → ${f(P,"Name")}`,
      "Shared on":iso(TODAY), Opened:false, Resource:[b.dataset.share], Person:[cSel]}}]);
    await reload("shares"); toast("Shared"); render();
  });
  dropzone(document.getElementById("libdrop"), async files=>{
    for(const file of files){
      const j = await post(T.resources, [{fields:{Name:file.name, Kind:"Guide", Uploaded:iso(TODAY)}}]);
      await upload(j.records[0].id, FIELD_IDS.resourceFile, file);
    }
    await reload("resources"); toast("Uploaded to library"); render();
  });
  document.getElementById("rpGo").onclick = () => buildReport();
  cPane(P, notes, shares, objs);
};

function cPane(P, notes, shares, objs){
  const el = document.getElementById("cpane");
  if(cTab==="notes"){
    el.innerHTML = `
      <div style="border:1px solid var(--rule);border-radius:10px;padding:12px;margin-bottom:16px;background:#FBFCFD">
        <h3>New coaching note</h3>
        <textarea rows="3" id="nTxt" placeholder="What did you talk about?"></textarea>
        <div class="toggle" style="margin-top:8px">
          <div class="sw" id="nSw" role="switch" aria-checked="${cShared}"></div>
          <div><strong>${cShared?`Visible to ${esc(f(P,"Name"))}`:"Private to you"}</strong>
            <div class="mono">${cShared?"They'll see this note on their page.":"Default. Only you can read this."}</div></div>
        </div>
        <input id="nNext" placeholder="Next step you're committing to"/>
        <input type="date" id="nDue" style="margin-top:8px"/>
        <div class="drop" id="nDrop" style="margin-top:8px;padding:12px"><b>Attach a file to this note</b>Their KR draft, meeting notes, a doc you're walking them through.</div>
        <div class="att" id="nAtt">${cFiles.map((f2,i)=>`<span class="file">📎 ${esc(f2.name)} <span class="mono" data-rm="${i}" style="cursor:pointer">✕</span></span>`).join("")}</div>
        <button class="btn wide" id="nSave" style="margin-top:9px">Save note</button>
      </div>
      <h3>Note history</h3>
      ${notes.length ? notes.map(n=>{
        const sh = f(n,"Visibility")==="Shared with leader";
        const files = f(n,"Files")||[];
        return `<div class="note ${sh?"shared":""}">
          <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
            <span class="mono"><b>${esc(f(n,"Title")||"Note")}</b> · ${fmt(f(n,"Date"))}</span>
            <span class="lock ${sh?"sh":""}">${sh?"Shared":"Private"}</span></div>
          <p style="margin:5px 0 0;font-size:13.5px">${esc(f(n,"Note")||"")}</p>
          ${f(n,"Next step")?`<div class="next">${f(n,"Follow-up done")?"✓":"→"} <strong>Next:</strong> ${esc(f(n,"Next step"))}
            ${f(n,"Follow-up due")?`<span class="mono">· due ${fmt(f(n,"Follow-up due"))}</span>`:""}
            ${!f(n,"Follow-up done")?`<button class="btn dash" style="margin-left:6px;font-size:11px;padding:3px 7px" data-done="${n.id}">Mark done</button>`:""}</div>`:""}
          ${files.length?`<div class="att">${files.map(x=>`<span class="file">📎 <a href="${x.url}" target="_blank">${esc(x.filename)}</a></span>`).join("")}</div>`:""}
        </div>`;}).join("") : `<div class="empty">No notes yet. The first conversation is the one that matters.</div>`}`;

    document.getElementById("nSw").onclick = ()=>{cShared=!cShared; cPane(P,notes,shares,objs);};
    document.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{cFiles.splice(+x.dataset.rm,1); cPane(P,notes,shares,objs);});
    dropzone(document.getElementById("nDrop"), files=>{ cFiles.push(...files); cPane(P,notes,shares,objs); });
    document.querySelectorAll("[data-done]").forEach(b=>b.onclick=async()=>{
      await patch(T.notes, [{id:b.dataset.done, fields:{"Follow-up done":true}}]);
      await reload("notes"); toast("Follow-up closed"); render();
    });
    document.getElementById("nSave").onclick = async()=>{
      const txt = document.getElementById("nTxt").value.trim();
      if(!txt) return toast("Write something first", true);
      const btn = document.getElementById("nSave"); btn.disabled=true; btn.textContent="Saving…";
      const j = await post(T.notes, [{fields:{
        Title:`${f(P,"Name")} — ${fmt(TODAY)}`, Date:iso(TODAY), Note:txt,
        Visibility: cShared?"Shared with leader":"Private",
        "Next step": document.getElementById("nNext").value.trim(),
        "Follow-up due": document.getElementById("nDue").value || null,
        Person:[P.id]}}]);
      for(const file of cFiles) await upload(j.records[0].id, FIELD_IDS.notesFiles, file);
      cFiles=[]; cShared=false;
      await reload("notes"); toast("Note saved"); render();
    };
  }

  if(cTab==="files"){
    el.innerHTML = `
      <div class="cap">Files you've given ${esc(f(P,"Name"))}. "Not opened yet" is the coaching conversation.</div>
      ${shares.length ? shares.map(s=>{
        const r = rec("resources", one(s,"Resource"));
        const url = r ? (f(r,"File")||[])[0]?.url : null;
        return `<div class="row">
          <div><strong style="font-size:13.5px">📎 ${url?`<a href="${url}" target="_blank">${esc(nm("resources",one(s,"Resource")))}</a>`:esc(nm("resources",one(s,"Resource")))}</strong>
            <div class="mono">shared ${fmt(f(s,"Shared on"))}</div></div>
          <span class="${f(s,"Opened")?"seen":"unseen"}">${f(s,"Opened")?"opened ✓":"not opened yet"}</span>
        </div>`;}).join("") : `<div class="empty">Nothing shared with ${esc(f(P,"Name"))} yet. Use the library below.</div>`}`;
  }

  if(cTab==="okrs"){
    el.innerHTML = objs.length ? objs.map(o=>{
      const p = pct(objProgress(o)), c = f(o,"Confidence")||"Not started";
      return `<div class="row" style="cursor:pointer" data-go="${o.id}">
        <div><strong style="font-size:13.5px">${esc(f(o,"Title"))}</strong>
          <div class="prog" style="width:220px"><span style="width:${p}%;background:${col(c)}"></span></div>
          <div class="mono">${p}% · ${esc(nm("cycles",one(o,"Cycle")))}</div></div>
        <span class="mono" style="color:${isStale(o)?"var(--clay)":"var(--ink-2)"}">check-in ${staleDays(o)===999?"never":staleDays(o)+"d ago"}</span>
      </div>`;}).join("")
      : `<div class="empty">${esc(f(P,"Name"))} hasn't written any objectives. That's the conversation.</div>`;
    document.querySelectorAll("[data-go]").forEach(r=>r.onclick=()=>openObjective(r.dataset.go));
  }
}

function buildReport(){
  const kind = document.getElementById("rpKind").value;
  const objs = DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year");
  const off = objs.filter(o=>f(o,"Confidence")==="Off track");
  const risk = objs.filter(o=>f(o,"Confidence")==="At risk");
  const on = objs.filter(o=>f(o,"Confidence")==="On track");
  const stale = objs.filter(isStale);
  const late = objs.flatMap(o=>objTasks(o.id)).filter(isLate).length;
  const orphanKrs = jvKrs().filter(k=>!childObjectives(k.id).length);
  const line = o => `• ${f(o,"Area")||""} — ${f(o,"Title")} (${pct(objProgress(o))}%)`;
  let out;

  if(kind==="Leadership summary"){
    out = `JV OKR — ${fmt(TODAY)}

WHERE WE ARE
${on.length} on track · ${risk.length} at risk · ${off.length} off track · ${late} overdue tasks.
${objs.length?Math.round(objs.filter(o=>staleDays(o)<=7).length/objs.length*100):0}% of objectives were checked in this week.

NEEDS A DECISION
${off.map(o=>`${line(o)} — off track, ${staleDays(o)}d since last check-in.`).join("\n") || "• Nothing off track."}

WATCH LIST
${risk.map(line).join("\n") || "• Nothing at risk."}

GONE QUIET (no check-in in ${STALE}+ days)
${stale.map(o=>`${line(o)} — ${staleDays(o)}d.`).join("\n") || "• None."}

DECISIONS MADE THIS CYCLE
${DB.decisions.slice(-6).map(d=>`• ${f(d,"Decision")} — ${(f(d,"Why")||"").slice(0,110)}`).join("\n") || "• None recorded."}

NOTHING POINTED AT THESE JV KEY RESULTS
${orphanKrs.map(k=>`• ${f(k,"Title")}`).join("\n") || "• Every JV key result has work laddering to it."}`;
  } else if(kind==="Coaching digest (private)"){
    const pool = DB.people.filter(p=>["Country leader","Division leader","Team leader"].includes(f(p,"Role")));
    out = `COACHING DIGEST — private to the OKR director
${fmt(TODAY)}

OVERDUE FOR A CONVERSATION
${pool.filter(p=>f(p,"Overdue for a 1:1")).map(p=>`• ${f(p,"Name")} (${f(p,"Area")||""}) — ${f(p,"Days since 1:1")===999?"never talked":f(p,"Days since 1:1")+"d"}, cadence ${cadence(p)}d.`).join("\n") || "• Everyone's current."}

FOLLOW-UPS YOU COMMITTED TO
${DB.notes.filter(n=>f(n,"Next step") && !f(n,"Follow-up done"))
  .map(n=>`• ${nm("people",one(n,"Person"))} — ${f(n,"Next step")}${f(n,"Follow-up due")?` (due ${fmt(f(n,"Follow-up due"))})`:""}`).join("\n") || "• None open."}

NO OBJECTIVES WRITTEN
${pool.filter(p=>!ownedBy(p.id).length).map(p=>`• ${f(p,"Name")} (${f(p,"Area")||""})`).join("\n") || "• Everyone has objectives."}

RESOURCES SENT BUT NEVER OPENED
${DB.shares.filter(s=>!f(s,"Opened")).map(s=>`• ${nm("people",one(s,"Person"))} — ${nm("resources",one(s,"Resource"))} (sent ${fmt(f(s,"Shared on"))})`).join("\n") || "• None."}`;
  } else {
    out = `To: owners of objectives that have gone quiet
Subject: Quick OKR check-in

Hi —

Your objective hasn't had a check-in in over ${STALE} days, or has tasks past due. Two minutes:

• What moved since last time?
• What's in the way?
• Still on track, at risk, or off track?

[Log check-in →]

Going to: ${stale.map(o=>nm("people",one(o,"Owner"))).filter(Boolean).join(", ") || "nobody — everyone's current"}`;
  }
  document.getElementById("rpOut").textContent = out;
}

/* ============================ FILE DROP ============================ */
function dropzone(el, cb){
  if(!el) return;
  const inp = document.createElement("input");
  inp.type="file"; inp.multiple=true; inp.style.display="none"; el.appendChild(inp);
  el.onclick = e => { if(e.target!==inp) inp.click(); };
  inp.onchange = () => cb([...inp.files]);
  el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
  el.ondragleave = () => el.classList.remove("over");
  el.ondrop = e => { e.preventDefault(); el.classList.remove("over"); cb([...e.dataTransfer.files]); };
}

/* ============================ SIGN IN ============================ */
// Google verifies who you are. The function decides what you may see.
// Nothing loads until both have happened.

function gate(html){
  document.getElementById("bar").style.display = "none";
  document.getElementById("view").className = "";
  document.getElementById("view").innerHTML =
    `<div class="card" style="max-width:520px;margin:60px auto;text-align:center">
       <img src="icon.svg" width="52" height="52" style="border-radius:12px"/>
       ${html}
     </div>`;
}

function signOut(){
  ID_TOKEN = null;
  try{ sessionStorage.removeItem("jvokr.tok"); }catch(e){}
  google.accounts.id.disableAutoSelect();
  location.reload();
}

async function onGoogle(res){
  ID_TOKEN = res.credential;
  try{ sessionStorage.setItem("jvokr.tok", ID_TOKEN); }catch(e){}
  await start();
}

async function start(){
  const r = await fetch(`${API}?action=me`, {headers: authHeaders()});
  const j = await r.json();
  if(!r.ok){
    ID_TOKEN = null;
    try{ sessionStorage.removeItem("jvokr.tok"); }catch(e){}
    return gate(`<h2 style="margin-top:12px">Can't let you in</h2>
      <div class="cap" style="color:var(--clay)">${esc(j.error||"Sign-in failed")}</div>
      <div id="gbtn" style="display:flex;justify-content:center;margin-top:16px"></div>`)
      || drawButton();
  }
  AUTH = j.me;
  document.getElementById("bar").style.display = "";
  document.getElementById("view").innerHTML = `<div class="card empty">Loading…</div>`;
  try { await load(); }
  catch(e){
    document.getElementById("view").innerHTML =
      `<div class="card" style="max-width:640px"><h2>Couldn't reach the base</h2>
       <div class="cap" style="font-family:'JetBrains Mono',monospace;color:var(--clay);font-size:12.5px">${esc(e.message)}</div>
       <div class="hint">Open <code>${API}?action=diag</code> to see what the function can and can't see.</div></div>`;
    return;
  }
  if(AUTH.isNew) welcome();
}

/* First sign-in: they exist now, but nobody knows where they sit. */
function welcome(){
  const areas = [...new Set(DB.objectives.filter(o=>f(o,"Area") && f(o,"Scope")!=="JV 5-year").map(o=>f(o,"Area")))].sort();
  document.getElementById("view").innerHTML = `
    <div class="head"><div>
      <h1>Welcome, ${esc(AUTH.name.split(" ")[0])}</h1>
      <div class="sub">You're in. One question before you look around.</div>
    </div></div>
    <div class="card" style="max-width:560px">
      <h2>Which country or division are you part of?</h2>
      <div class="cap">This is what puts your work on your page — and your name on your team's reviews. You can change it later.</div>
      <div class="field">
        <select id="wArea">
          ${areas.map(a=>`<option>${esc(a)}</option>`).join("")}
          <option value="__other">Something else…</option>
        </select>
      </div>
      <div class="field hidden" id="wOtherBox"><label>Type it</label><input id="wOther" placeholder="Poland / Staff Care / …"/></div>
      <button class="btn wide" id="wGo">That's me</button>
      <div class="hint">You're set up as <b>Staff</b> — you can browse everything across JV, add and tick tasks, log check-ins and answer reviews.
        If you lead a country, division or team, ask Mike to change your role.</div>
    </div>`;
  const sel = document.getElementById("wArea");
  sel.onchange = ()=> document.getElementById("wOtherBox").classList.toggle("hidden", sel.value!=="__other");
  if(!areas.length){ sel.value="__other"; document.getElementById("wOtherBox").classList.remove("hidden"); }
  document.getElementById("wGo").onclick = async()=>{
    const area = sel.value==="__other" ? document.getElementById("wOther").value.trim() : sel.value;
    if(!area) return toast("Pick or type one", true);
    const r = await fetch(`${API}?action=setarea`, {method:"POST", headers:authHeaders({"Content-Type":"application/json"}), body:JSON.stringify({area})});
    const j = await r.json();
    if(!r.ok) return toast(j.error||"Couldn't save", true);
    AUTH = j.me;
    await reload("people");
    ME = DB.people.find(p=>p.id===AUTH.id) || ME;
    toast(`Welcome to ${area}`);
    VIEW = "browse"; drawChrome(); render();
  };
}

function drawButton(){
  const el = document.getElementById("gbtn");
  if(!el || !window.google) return;
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onGoogle });
  google.accounts.id.renderButton(el, {theme:"outline", size:"large", text:"signin_with", shape:"pill"});
}

let CLIENT_ID = null;
(async () => {
  const cfg = await fetch(`${API}?action=config`).then(r=>r.json()).catch(()=>({}));
  CLIENT_ID = cfg.googleClientId;

  if(!CLIENT_ID)
    return gate(`<h2 style="margin-top:12px">Almost there</h2>
      <div class="cap">Set <code>GOOGLE_CLIENT_ID</code> in the Netlify environment variables and redeploy.
      See the README for how to create it.</div>`);

  const saved = (()=>{ try{ return sessionStorage.getItem("jvokr.tok"); }catch(e){ return null; } })();
  if(saved){ ID_TOKEN = saved; return start(); }

  gate(`<h2 style="margin-top:12px">JV OKR</h2>
    <div class="cap">Sign in with your JV Google account.${cfg.domain?` (${esc(cfg.domain)})`:""}</div>
    <div id="gbtn" style="display:flex;justify-content:center;margin-top:16px"></div>`);
  const wait = setInterval(()=>{ if(window.google){ clearInterval(wait); drawButton(); } }, 120);
})();
</script>
