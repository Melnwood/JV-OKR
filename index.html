<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>JV OKR</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="icon" href="favicon-32.png" sizes="32x32"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<meta name="theme-color" content="#FF6600"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* JV orange, full strength — top bar only */
    --jv:#FF6600;
    --jv-deep:#C4521A;   /* JV-level bars, primary orange actions, links */
    --jv-mid:#E8874A;    /* soft accents */
    --jv-100:#FBEADF;    /* page banners */
    --jv-50:#FDF4EE;     /* panels, tags */
    --jv-edge:#F0D9C6;   /* banner border */
    /* warmed neutrals — this is what stops the orange feeling harsh */
    --ink:#221E1B;--ink-2:#6B6259;--paper:#F5F2EF;--card:#fff;--rule:#E4DDD5;--rule-2:#E9DFD5;
    --moss:#4A6B4F;--amber:#B5811F;--clay:#A8443A;--indigo:#5A5C8A;--r:11px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.55}
  a{color:var(--jv-deep)}
  .bar{background:var(--jv);border-bottom:1px solid #E25C00;position:sticky;top:0;z-index:20}
  .bar-in{max-width:1200px;margin:0 auto;padding:11px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.02em;margin-right:6px;color:#fff;display:flex;align-items:center;gap:8px}
  .logo img{width:22px;height:22px;border-radius:5px;background:#fff}
  nav{display:flex;gap:3px;flex-wrap:wrap;flex:1}
  .nv{background:none;border:0;border-radius:8px;padding:7px 11px;font:inherit;font-size:13.5px;color:rgba(255,255,255,.82);cursor:pointer}
  .nv[aria-current="true"]{background:#fff;color:var(--jv);font-weight:600}
  .nv:hover:not([aria-current="true"]){background:rgba(255,255,255,.2);color:#fff}
  .me{display:flex;align-items:center;gap:7px;font-size:12.5px;color:rgba(255,255,255,.85)}
  .gearwrap{position:relative}
  .nv.gear{font-size:16px;padding:6px 9px}
  .geardrop{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--rule);border-radius:10px;
            box-shadow:0 8px 24px rgba(34,30,27,.14);padding:5px;z-index:40;min-width:130px}
  .geardrop button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;
            padding:8px 11px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
  .geardrop button:hover{background:var(--jv-50);color:var(--jv-deep)}
  .lenses{display:flex;gap:4px;background:var(--jv-50);border:1px solid var(--jv-edge);border-radius:10px;
          padding:4px;margin-bottom:16px;width:fit-content}
  .lens{background:none;border:0;border-radius:7px;padding:7px 14px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;font-weight:500}
  .lens.on{background:#fff;color:var(--jv-deep);font-weight:600;box-shadow:0 1px 3px rgba(34,30,27,.08)}
  .lens:hover:not(.on){color:var(--jv-deep)}
  .me select{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff}
  .me select option{color:var(--ink);background:#fff}
  select,input,textarea{font-family:Inter;font-size:13.5px;border:1px solid var(--rule);border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink);width:100%}
  select.sm{width:auto;padding:6px 9px;font-size:13px}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 80px}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-size:25px;margin:0;letter-spacing:-.02em}
  h2{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin:0 0 2px}
  h3{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;margin:0 0 7px}
  .sub{color:var(--ink-2);font-size:13px;margin:3px 0 16px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--ink-2);text-transform:uppercase}
  .mono{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-2)}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
  .cap{font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
  .head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;
        background:var(--jv-100);border:1px solid var(--jv-edge);border-left:4px solid var(--jv);
        border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
  .head .sub{margin:3px 0 0}
  .head select{border-color:#E0C9B6;background:#fff}
  .head .btn.ghost{border-color:#E0C9B6;color:var(--jv-deep);background:#fff}
  .head .btn.ghost:hover{background:var(--jv-50)}
  .filters{display:flex;gap:7px;flex-wrap:wrap}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
  .side{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
  @media(max-width:900px){.two,.side{grid-template-columns:1fr}}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .tile:hover{box-shadow:0 3px 12px rgba(34,30,27,.07)}
  .tile[aria-pressed="true"]{background:var(--ink);color:#fff}
  .tile[aria-pressed="true"] .l{color:#A9B6C2}
  .tile .v{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:25px;line-height:1}
  .tile .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-top:5px}
  .b-ok{border-left-color:var(--moss)}.b-risk{border-left-color:var(--amber)}
  .b-off{border-left-color:var(--clay)}.b-ind{border-left-color:var(--indigo)}

  .prog{height:7px;border-radius:4px;background:#EDE7E1;overflow:hidden;margin-top:6px}
  .prog span{display:block;height:100%;border-radius:4px}
  .pill{font-family:'JetBrains Mono',monospace;font-size:9.5px;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  .p-on{background:#E6EDE7;color:var(--moss)}.p-risk{background:#F6ECD8;color:var(--amber)}
  .p-off{background:#F5E3E1;color:var(--clay)}.p-none{background:#EDE8E3;color:var(--ink-2)}
  .p-stale{background:#E8E8F1;color:var(--indigo)}

  .btn{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:10px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:none;color:var(--jv-deep);border:1px solid #E0C9B6;font-weight:500}
  .btn.jv{background:var(--jv-deep);color:#fff}
  .btn.dash{background:none;color:var(--ink-2);border:1px dashed var(--rule);font-weight:500}
  .btn.wide{width:100%}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
  .row:last-child{border-bottom:0}
  .why{font-size:12px;color:var(--ink-2);margin-top:2px}
  .field{margin-bottom:9px}
  .field label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 130px 150px;gap:6px}
  @media(max-width:560px){.grid3,.grid2{grid-template-columns:1fr}}

  /* cascade */
  .kr5{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:13px 16px;margin-bottom:6px}
  .cascade{margin-left:18px;border-left:2px solid var(--rule-2);padding:5px 0}
  .child{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:9px;margin:0 0 6px 16px;padding:10px 12px;cursor:pointer}
  .child:hover{border-color:var(--ink-2)}
  .child::before{content:"";position:absolute;left:-16px;top:20px;width:16px;height:2px;background:var(--rule-2)}
  .scope{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;border-radius:4px;background:var(--jv-50);color:var(--jv-deep);margin-right:6px;text-transform:uppercase}

  /* map */
  .canvas{overflow:auto;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px;cursor:grab}
  .canvas.drag{cursor:grabbing}
  .link{fill:none;stroke:#D8CEC4;stroke-width:1.6}
  .link.lit{stroke:var(--jv-deep);stroke-width:2.4}
  .node rect{fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:9}
  .node.lit rect{stroke:var(--jv-deep);stroke-width:2}
  .node.dim{opacity:.25}
  .node{cursor:pointer}
  .n-title{font-size:12.5px;font-weight:600;fill:var(--ink)}
  .n-meta{font-size:10.5px;fill:var(--ink-2);font-family:'JetBrains Mono',monospace}
  .n-lvl{font-size:9px;fill:var(--ink-2);font-family:'JetBrains Mono',monospace;letter-spacing:.09em}
  .root rect{fill:var(--jv);stroke:var(--jv)}
  .root .n-title{fill:#fff}.root .n-meta,.root .n-lvl{fill:rgba(255,255,255,.82)}
  .node.root.lit rect{stroke:#B84A00;stroke-width:2.5}
  .colhead{font-family:'JetBrains Mono',monospace;font-size:10px;fill:var(--ink-2);letter-spacing:.1em}

  /* tasks */
  .task{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--rule)}
  .task input[type=checkbox]{width:17px;height:17px;margin-top:3px;accent-color:var(--moss);flex:none}
  .task .t{flex:1;font-size:13.5px}
  .task.done .t{text-decoration:line-through;color:var(--ink-2)}
  .task .m{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2);white-space:nowrap}
  .task.late .m{color:var(--clay)}

  /* checkin */
  .slider{display:flex;align-items:center;gap:12px;margin-top:6px}
  input[type=range]{flex:1;accent-color:var(--indigo);padding:0}
  .num{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;min-width:96px;text-align:right}
  .delta{font-family:'JetBrains Mono',monospace;font-size:11px;min-height:15px;color:var(--ink-2)}
  .confs{display:flex;gap:7px;flex-wrap:wrap}
  .conf{border:1px solid var(--rule);background:none;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
  .conf[aria-pressed="true"]{color:#fff}
  .conf.on[aria-pressed="true"]{background:var(--moss);border-color:var(--moss)}
  .conf.risk[aria-pressed="true"]{background:var(--amber);border-color:var(--amber)}
  .conf.off[aria-pressed="true"]{background:var(--clay);border-color:var(--clay)}
  .hint{font-size:12px;color:var(--ink-2);margin-top:6px}

  /* ripple */
  .rung{opacity:.15;transform:translateY(6px);transition:.5s;margin-bottom:13px}
  .rung.show{opacity:1;transform:none}
  .jvbox{border:1px solid var(--rule);border-left:3px solid var(--indigo);border-radius:10px;padding:12px 14px;background:#FAFBFC}
  .headline{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:700;margin:2px 0 10px;opacity:0;transition:.6s}
  .headline.show{opacity:1}

  /* reviews */
  .gate{background:var(--jv-50);border:1px dashed var(--jv-mid);border-radius:10px;padding:13px 15px;margin-bottom:12px;font-size:13px}
  .roster{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .p{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:3px 8px;border-radius:999px;background:#E5E9ED;color:var(--ink-2)}
  .p.in{background:#E4EEE7;color:var(--moss)}
  .scale{display:flex;gap:4px}
  .sc{flex:1;border:1px solid var(--rule);background:none;border-radius:6px;padding:8px 0;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer}
  .sc[aria-pressed="true"]{background:var(--indigo);color:#fff;border-color:var(--indigo)}
  .spread{display:flex;gap:3px;align-items:flex-end;height:46px;margin:8px 0 4px}
  .spread div{flex:1;background:#E3DCD4;border-radius:2px 2px 0 0}
  .spread div.hit{background:var(--indigo)}
  .ans{border-left:2px solid var(--rule);padding:6px 0 6px 11px;margin-bottom:9px}
  .ans .who{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:var(--ink-2)}
  .ans p{margin:2px 0 0;font-size:13.5px}

  /* decisions */
  .dec{border-left:3px solid var(--indigo);background:var(--jv-50);border-radius:0 10px 10px 0;padding:11px 13px;margin-bottom:10px}
  .dec.Stopped{border-left-color:var(--clay);background:#FBF3F2}
  .dec[class*="Held"]{border-left-color:var(--moss);background:#F3F8F4}
  .dec .what{font-weight:600;margin:4px 0 3px}
  .dec .why2{font-size:13.5px;color:#39454F}
  .shift{font-family:'JetBrains Mono',monospace;font-size:12.5px;margin:3px 0}
  .strike{text-decoration:line-through;color:#A9B3BC}

  /* coaching */
  .qi{padding:10px 11px;border-radius:9px;cursor:pointer;margin-bottom:3px}
  .qi:hover{background:#F7F4F1}
  .qi[aria-current="true"]{background:var(--ink);color:#fff}
  .qi[aria-current="true"] .why,.qi[aria-current="true"] .mono{color:#A9B6C2}
  .note{border-left:2px solid var(--indigo);padding:9px 0 9px 12px;margin-bottom:13px}
  .note.shared{border-left-color:var(--moss)}
  .lock{font-family:'JetBrains Mono',monospace;font-size:9.5px;padding:2px 7px;border-radius:4px;background:#EAE7F0;color:var(--indigo);text-transform:uppercase}
  .lock.sh{background:#E1EDE4;color:var(--moss)}
  .next{margin-top:7px;font-size:12.5px;background:#F4F1EC;border-radius:6px;padding:7px 9px}
  .att{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .file{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:7px;padding:5px 9px;font-size:12px;background:#FCFAF8}
  .toggle{display:flex;align-items:center;gap:9px;background:#F7F4F1;border:1px solid var(--rule);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:13px}
  .sw{width:40px;height:22px;border-radius:999px;background:#D3CAC1;position:relative;cursor:pointer;flex:none;transition:.15s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
  .sw[aria-checked="true"]{background:var(--moss)}
  .sw[aria-checked="true"]::after{left:20px}
  .drop{border:1.5px dashed var(--rule);border-radius:10px;padding:14px;text-align:center;color:var(--ink-2);font-size:13px;cursor:pointer;background:#FCFAF8}
  .drop:hover,.drop.over{border-color:var(--jv-mid);background:var(--jv-50);color:var(--jv-deep)}
  .drop b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
  .lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .res{border:1px solid var(--rule);border-radius:10px;padding:12px}
  .seen{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--moss)}
  .unseen{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--clay)}
  .report{background:#FCFAF8;border:1px dashed var(--rule);border-radius:8px;padding:14px;font-size:13px;white-space:pre-wrap;max-height:360px;overflow:auto}

  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--clay)}
  .loading{padding:60px 0;text-align:center;color:var(--ink-2)}
  .empty{color:var(--ink-2);font-size:13px;font-style:italic}
  .hidden{display:none}
</style>
</head>
<body>
<div class="bar" id="bar" style="display:none"><div class="bar-in">
  <span class="logo"><img src="icon.svg" alt=""/>JV OKR</span>
  <nav id="nav"></nav>
  <div class="me" id="whobox"></div>
</div></div>

<div class="wrap"><div id="view" class="loading">Loading…</div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ API ============================ */
const API = "/.netlify/functions/airtable";
const T = {people:"People", cycles:"Cycles", units:"Org Units", objectives:"Objectives", krs:"Key Results", tasks:"Tasks",
           checkins:"Check-ins", reviews:"Reviews", responses:"Review Responses", decisions:"Decisions",
           notes:"Coaching Notes", resources:"Resources", shares:"Resource Shares"};
const FIELD_IDS = { notesFiles:"fldzqeq0lTRD5r5SR", resourceFile:"fld87BX3WN94SPYqY" };

let ID_TOKEN = null;

const authHeaders = (extra={}) => ({ ...extra, ...(ID_TOKEN ? {Authorization:`Bearer ${ID_TOKEN}`} : {}) });

const get = async t => {
  let r, j;
  try { r = await fetch(`${API}?table=${encodeURIComponent(t)}`, {headers: authHeaders()}); }
  catch(e){ throw new Error(`Network error reaching the function (${t}): ${e.message}`); }
  const text = await r.text();
  try { j = JSON.parse(text); }
  catch(e){ throw new Error(`The function didn't return JSON for "${t}" (HTTP ${r.status}). Is it deployed at ${API}? First bytes: ${text.slice(0,80)}`); }
  if (r.status === 401 || r.status === 403) throw Object.assign(new Error(j.error||"Not allowed"), {auth:true});
  if (!r.ok || j.error) throw new Error(`"${t}" — ${j.error || "HTTP "+r.status}`);
  if (!j.records) throw new Error(`"${t}" returned no records array. Check the table name matches the base exactly.`);
  return j;
};
const post  = (t,records) => fetch(`${API}?table=${encodeURIComponent(t)}`,{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({records})}).then(j=>j.json());
const patch = (t,records) => fetch(`${API}?table=${encodeURIComponent(t)}`,{method:"PATCH",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({records})}).then(j=>j.json());
const del = async (t, ids) => {
  const r = await fetch(`${API}?table=${encodeURIComponent(t)}&ids=${ids.join(",")}`, {method:"DELETE", headers: authHeaders()});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || "delete failed");
  return j;
};
const upload = (recordId, fieldId, file) => new Promise((res,rej)=>{
  const fr = new FileReader();
  fr.onload = async () => {
    const b64 = fr.result.split(",")[1];
    const r = await fetch(`${API}?action=upload`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({recordId, fieldId, filename:file.name, contentType:file.type||"application/octet-stream", base64:b64})});
    r.ok ? res(await r.json()) : rej(await r.json());
  };
  fr.onerror = rej;
  fr.readAsDataURL(file);
});

/* ============================ STATE ============================ */
const DB = {};
let ME = null, VIEW = "objective", TOAST_T;
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const STALE = 21;

const f  = (r,k) => r.fields[k];
const lnk = (r,k) => f(r,k) || [];
const one = (r,k) => (f(r,k)||[])[0];
const rec = (t,id) => DB[t].find(x=>x.id===id);
const nm  = (t,id) => { const r = rec(t,id); return r ? (f(r,"Name") || f(r,"Title") || "") : ""; };
const days = d => d ? Math.round((TODAY - new Date(d)) / 864e5) : null;
const fmt = d => d ? new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "";
const iso = d => new Date(d).toISOString().slice(0,10);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CONF = {"On track":["p-on","var(--moss)"], "At risk":["p-risk","var(--amber)"], "Off track":["p-off","var(--clay)"], "Not started":["p-none","#B6BEC6"]};
const cls = c => (CONF[c]||CONF["Not started"])[0];
const col = c => (CONF[c]||CONF["Not started"])[1];
const pct = v => Math.max(0, Math.min(100, Math.round((v||0)*100)));

function toast(msg, err){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast on" + (err?" err":"");
  clearTimeout(TOAST_T); TOAST_T = setTimeout(()=>t.className="toast", 2600);
}

async function load(){
  const [people,cycles,units,objectives,krs,tasks,checkins,reviews,responses,decisions,notes,resources,shares] =
    await Promise.all(Object.values(T).map(get));

/* who the signed-in person is, per the server. The browser never decides this. */
let AUTH = null;

const iAmLeader = () => AUTH && LEADER_ROLES.includes(AUTH.role);

/* ============================ ORG UNITS ============================ */
// Countries and Divisions sit at the top. Departments and Teams hang under either.
const unitOf   = r => { const u = one(r,"Org Unit"); return u ? rec("units", u) : null; };
const areaName = r => { const u = unitOf(r); return u ? f(u,"Name") : (f(r,"Area") || ""); };
const unitParent   = u => { const p = one(u,"Parent unit"); return p ? rec("units", p) : null; };
// A unit with no name is an empty Airtable row, not part of JV. Never show it.
const namedUnits   = () => DB.units.filter(u=>String(f(u,"Name")||"").trim());
const unitChildren = id => namedUnits().filter(u=>lnk(u,"Parent unit").includes(id));
const unitRoots    = () => namedUnits().filter(u=>!one(u,"Parent unit"));
const unitPath     = u => { const out=[]; let c=u; while(c){ out.unshift(c); c = unitParent(c); } return out; };
const unitCrumb    = u => unitPath(u).map(x=>f(x,"Name")).join(" › ");
// Everything at or beneath a unit — a country's number includes its departments and teams.
const unitTree = id => { const out=[id]; unitChildren(id).forEach(c=>out.push(...unitTree(c.id))); return out; };
const unitObjectives = id => live(DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year" && unitTree(id).includes(one(o,"Org Unit"))));
const unitPeople = id => DB.people.filter(p=>unitTree(id).includes(one(p,"Org Unit")));
const UNIT_ORDER = {Country:0, Division:1, Department:2, Team:3};
const unitsSorted = list => [...list].filter(u=>String(f(u,"Name")||"").trim()).sort((a,b)=>
  (UNIT_ORDER[f(a,"Type")]??9)-(UNIT_ORDER[f(b,"Type")]??9) || String(f(a,"Name")).localeCompare(String(f(b,"Name"))));

/* ============================ DERIVED ============================ */
const ARCHIVED = o => ["Closed","Abandoned"].includes(f(o,"Status"));
let showArchived = false;
const live = list => showArchived ? list : list.filter(o=>!ARCHIVED(o));
const jvObjectives = () => DB.objectives.filter(o=>f(o,"Scope")==="JV 5-year");
const jvKrs = () => DB.krs.filter(k=>{ const o = one(k,"Objective"); return o && f(rec("objectives",o)||{fields:{}},"Scope")==="JV 5-year"; });
const childObjectives = krId => live(DB.objectives.filter(o=>lnk(o,"Parent Key Result").includes(krId)));
const KR_ARCHIVED = k => f(k,"Archived")===true;
const objKrs    = objId => DB.krs.filter(k=>lnk(k,"Objective").includes(objId) && !KR_ARCHIVED(k));
const objKrsAll = objId => DB.krs.filter(k=>lnk(k,"Objective").includes(objId));
const krTasks = krId => DB.tasks.filter(t=>lnk(t,"Key Result").includes(krId));
const objTasks = objId => objKrs(objId).flatMap(k=>krTasks(k.id));
const objCheckins = objId => DB.checkins.filter(c=>lnk(c,"Objective").includes(objId)).sort((a,b)=>new Date(f(b,"Date"))-new Date(f(a,"Date")));
const staleDays = o => f(o,"Days since check-in") ?? 999;
const isStale = o => staleDays(o) > STALE;
const isLate = t => f(t,"Status")==="Open" && f(t,"Due date") && new Date(f(t,"Due date")) < TODAY;
const ownedBy = pid => live(DB.objectives.filter(o=>lnk(o,"Owner").includes(pid) && f(o,"Scope")!=="JV 5-year"));
const objProgress = o => f(o,"Progress") ?? 0;
const ladderKr = o => { const p = one(o,"Parent Key Result"); return p ? rec("krs",p) : null; };
/* Not everything ladders. Three honest states, and the app says which. */
const ALIGN = {LADDER:"Ladders to a JV key result", SUPPORT:"Supports JV — no single key result", ALONE:"Standalone / operational"};
const alignOf = o => f(o,"Alignment") || (one(o,"Parent Key Result") ? ALIGN.LADDER : ALIGN.ALONE);
const isLaddered = o => alignOf(o)===ALIGN.LADDER && !!one(o,"Parent Key Result");
const supportsJv = o => alignOf(o)===ALIGN.SUPPORT;
const unlanded  = () => live(DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year" && !isLaddered(o)));
const alignPill = o => isLaddered(o) ? "" :
  supportsJv(o) ? `<span class="pill p-risk">supports JV</span>` : `<span class="pill p-none">standalone</span>`;
const alignLine = o => {
  const k = ladderKr(o);
  if(isLaddered(o) && k) return `↑ ${esc(f(k,"Title"))}`;
  if(supportsJv(o)){ const j = one(o,"Supports JV objective"); return `≈ supports ${esc(j?nm("objectives",j):"JV 2030")} — not measured into a key result`; }
  return `— standalone: this doesn't roll up, and that's allowed`;
};

function drawMap(N, LV){
  const byId = i=>N.find(n=>n.id===i), kids = i=>N.filter(n=>n.p===i);
  const hidden = n => { let p=n.p; while(p){ if(collapsed.has(p)) return true; p=byId(p)?.p; } return false; };
  const act = N.filter(n=>!hidden(n));
  const W=250,H=68,GX=94,GY=15,PT=38,PL=8;
  const pos = {}; let cur = PT;
  const place = n => {
    const ch = kids(n.id).filter(c=>act.includes(c));
    if(!ch.length || collapsed.has(n.id)){ pos[n.id]={x:PL+n.lvl*(W+GX), y:cur}; cur += H+GY; return pos[n.id].y; }
    const ys = ch.map(place); const y=(ys[0]+ys[ys.length-1])/2;
    pos[n.id]={x:PL+n.lvl*(W+GX), y}; return y;
  };
  act.filter(n=>n.lvl===0).forEach(n=>{ place(n); cur+=22; });
  if(!act.length){ document.getElementById("cv").innerHTML = `<div class="empty">Nothing to map yet.</div>`; return; }
  const maxY = Math.max(...Object.values(pos).map(p=>p.y))+H+30, maxX = PL+5*(W+GX);
  const heads = LV.map((l,i)=>`<text class="colhead" x="${PL+i*(W+GX)}" y="18">${l}</text>`).join("");
  const links = act.filter(n=>n.p&&pos[n.p]).map(n=>{
    const a=pos[n.p], b=pos[n.id], x1=a.x+W, y1=a.y+H/2, x2=b.x, y2=b.y+H/2, m=(x1+x2)/2;
    return `<path class="link" data-f="${n.p}" data-t="${n.id}" marker-end="url(#ar)" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2-7},${y2}"/>`;}).join("");
  const nodes = act.map(n=>{
    const p=pos[n.id], ch=kids(n.id), c=collapsed.has(n.id);
    const acc = n.conf ? `<rect x="${p.x}" y="${p.y+10}" width="3.5" height="${H-20}" rx="2" fill="${col(n.conf)}"/>`:"";
    const tg = ch.length ? `<g class="tog" data-id="${n.id}"><circle cx="${p.x+W}" cy="${p.y+H/2}" r="9" fill="#fff" stroke="${'#D6DCE2'}"/>
        <text x="${p.x+W}" y="${p.y+H/2+4}" text-anchor="middle" class="n-meta" style="pointer-events:none">${c?"+":"–"}</text></g>`:"";
    const t = s => s && s.length>32 ? s.slice(0,31)+"…" : (s||"");
    return `<g class="node ${n.lvl===0?"root":""}" data-id="${n.id}">
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}"/>${acc}
      <text class="n-lvl" x="${p.x+13}" y="${p.y+17}">${esc((n.area||LV[n.lvl].split(" ")[0]).toUpperCase())}</text>
      <text class="n-title" x="${p.x+13}" y="${p.y+37}">${esc(t(n.title))}</text>
      <text class="n-meta" x="${p.x+13}" y="${p.y+56}">${esc(t(n.meta||""))}</text></g>${tg}`;}).join("");
  const svg = document.getElementById("svg");
  svg.setAttribute("width",maxX); svg.setAttribute("height",maxY); svg.setAttribute("viewBox",`0 0 ${maxX} ${maxY}`);
  svg.innerHTML = `<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#B8AB9E"/></marker></defs>${heads}${links}${nodes}`;
  svg.querySelectorAll(".tog").forEach(t=>t.onclick=e=>{e.stopPropagation();
    const i=t.dataset.id; collapsed.has(i)?collapsed.delete(i):collapsed.add(i); render();});
  svg.querySelectorAll(".node").forEach(g=>{
    g.onmouseenter = ()=>{
      const chain=[]; let c=byId(g.dataset.id);
      while(c){ chain.push(c.id); c = c.p?byId(c.p):null; }
      svg.querySelectorAll(".node").forEach(n=>{
        n.classList.toggle("lit", chain.includes(n.dataset.id));
        n.classList.toggle("dim", !chain.includes(n.dataset.id));});
      svg.querySelectorAll(".link").forEach(l=>l.classList.toggle("lit", chain.includes(l.dataset.f)&&chain.includes(l.dataset.t)));
    };
    g.onmouseleave = ()=>{ svg.querySelectorAll(".node").forEach(n=>n.classList.remove("lit","dim"));
                           svg.querySelectorAll(".link").forEach(l=>l.classList.remove("lit")); };
    g.onclick = ()=>{ const n=byId(g.dataset.id); if(n.lvl===2) openObjective(n.id); };
  });
  const cv=document.getElementById("cv"); let dn=false,sx,sy,sl,st;
  cv.onmousedown=e=>{ if(e.target.closest(".node,.tog"))return; dn=true; cv.classList.add("drag"); sx=e.pageX;sy=e.pageY;sl=cv.scrollLeft;st=cv.scrollTop; };
  window.onmouseup=()=>{dn=false;cv.classList.remove("drag");};
  window.onmousemove=e=>{ if(!dn)return; cv.scrollLeft=sl-(e.pageX-sx); cv.scrollTop=st-(e.pageY-sy); };
}

// A real tree: Countries and Divisions at the top, Departments and Teams beneath.
let bUnit = null, bType = "", bQuery = "";

LENS.browse = () => {
  const el = document.getElementById("view");

  if(!bUnit){
    const q = bQuery.toLowerCase();
    const match = u => !q || String(f(u,"Name")).toLowerCase().includes(q)
      || unitObjectives(u.id).some(o=>String(f(o,"Title")||"").toLowerCase().includes(q));
    const roots = unitsSorted(unitRoots().filter(u=>(!bType || f(u,"Type")===bType)));
    const shown = roots.filter(u => match(u) || unitTree(u.id).some(id=>{const c=rec("units",id); return c && match(c);}));

    el.innerHTML = `
      <div class="head">
        <div><h1>Browse JV</h1>
          <div class="sub">Every country, division, department and team. Look around all you like — nothing here can be changed.</div></div>
        <div class="filters">
          <select class="sm" id="bt"><option value="">Countries &amp; divisions</option>
            <option ${bType==="Country"?"selected":""}>Country</option>
            <option ${bType==="Division"?"selected":""}>Division</option></select>
          <input class="sm" id="bq" placeholder="Search units or objectives…" value="${esc(bQuery)}" style="width:230px"/>
        </div>
      </div>
      ${["Country","Division"].filter(t=>!bType||t===bType).map(t=>{
        const gs = shown.filter(u=>f(u,"Type")===t);
        if(!gs.length) return "";
        return `<div style="margin-bottom:20px">
          <div class="eyebrow" style="margin-bottom:8px">${t==="Country"?"COUNTRIES":"DIVISIONS"}</div>
          <div class="lib">${gs.map(unitCard).join("")}</div>
        </div>`;}).join("") || `<div class="card empty">No org units yet. A leader can add them under <b>Org</b>.</div>`}`;

    document.getElementById("bt").onchange = e=>{bType=e.target.value; render();};
    const qb = document.getElementById("bq");
    qb.oninput = e=>{ bQuery=e.target.value; render();
      const n=document.getElementById("bq"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
    document.querySelectorAll("[data-unit]").forEach(c=>c.onclick=()=>{bUnit=c.dataset.unit; render(); scrollTo(0,0);});
    return;
  }

  /* --- one unit, read-only, with its children --- */
  const U = rec("units", bUnit);
  if(!U){ bUnit=null; return render(); }
  const kids = unitsSorted(unitChildren(U.id));
  const own = live(DB.objectives.filter(o=>one(o,"Org Unit")===U.id));   // this unit's own objectives
  const all = unitObjectives(U.id);                                       // including everything beneath
  const people = DB.people.filter(p=>one(p,"Org Unit")===U.id);
  const avg = all.length ? Math.round(all.reduce((a,o)=>a+objProgress(o),0)/all.length*100) : 0;
  const parent = unitParent(U);

  el.innerHTML = `
    <div class="head">
      <div>
        <div class="eyebrow">${esc(unitCrumb(U))}</div>
        <h1>${esc(f(U,"Name"))}</h1>
        <div class="sub">${esc(f(U,"Type")||"")} · ${all.length} objective${all.length===1?"":"s"} across this unit and everything under it · ${avg}% average · read-only</div>
      </div>
      <div class="filters">
        ${parent?`<button class="btn ghost" data-up="${parent.id}">↑ ${esc(f(parent,"Name"))}</button>`:""}
        <button class="btn ghost" id="bback">← All of JV</button>
      </div>
    </div>

    ${kids.length?`<div class="card">
      <h2>Inside ${esc(f(U,"Name"))}</h2>
      <div class="cap">Departments and teams. Click to go down a level.</div>
      <div class="lib">${kids.map(unitCard).join("")}</div>
    </div>`:""}

    ${people.length?`<div class="card"><h2>Who's here</h2>
      <div class="roster" style="margin-top:8px">${people.map(p=>`<span class="p">${esc(f(p,"Name"))}${f(p,"Role")?` · ${esc(f(p,"Role"))}`:""}</span>`).join("")}</div>
    </div>`:""}

    ${own.length ? own.map(objCardRO).join("")
      : `<div class="card empty">${esc(f(U,"Name"))} hasn't written any objectives of its own${kids.length?" — look inside the units above":""}.</div>`}`;

  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{bUnit=b.dataset.up; render(); scrollTo(0,0);});
  document.querySelectorAll("[data-unit]").forEach(c=>c.onclick=()=>{bUnit=c.dataset.unit; render(); scrollTo(0,0);});
};

function unitCard(u){
  const objs = unitObjectives(u.id);
  const avg = objs.length ? Math.round(objs.reduce((a,o)=>a+objProgress(o),0)/objs.length*100) : 0;
  const mix = ["On track","At risk","Off track"].map(c=>objs.filter(o=>f(o,"Confidence")===c).length);
  const quiet = objs.filter(isStale).length;
  const kids = unitChildren(u.id);
  return `<div class="res" style="cursor:pointer" data-unit="${u.id}">
    <span class="mono">${esc(f(u,"Type")||"")}</span>
    <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;margin-top:5px">${esc(f(u,"Name"))}</div>
    <div class="mono">${objs.length} objective${objs.length===1?"":"s"}${kids.length?` · ${kids.length} unit${kids.length===1?"":"s"} inside`:""}${unitPeople(u.id).length?` · ${unitPeople(u.id).length} people`:""}</div>
    <div class="prog" style="margin-top:9px"><span style="width:${avg}%;background:var(--jv-deep)"></span></div>
    <div class="mono" style="margin-top:5px">${avg}% average</div>
    <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap">
      ${mix[0]?`<span class="pill p-on">${mix[0]} on</span>`:""}
      ${mix[1]?`<span class="pill p-risk">${mix[1]} risk</span>`:""}
      ${mix[2]?`<span class="pill p-off">${mix[2]} off</span>`:""}
      ${quiet?`<span class="pill p-stale">${quiet} quiet</span>`:""}
      ${!objs.length?`<span class="pill p-none">nothing written</span>`:""}
    </div>
  </div>`;
}

function objCardRO(o){

  return `<div class="card">
    <div class="eyebrow">${alignLine(o)}</div>

    </div>

      ${isStale(o)?` · <span style="color:var(--indigo)">◆ ${staleDays(o)}d since a check-in</span>`:""}</div>
    <div class="prog"><span style="width:${p}%;background:${col(c)}"></span></div>
    ${krs.length ? `<div style="margin-top:12px">${krs.map(kr=>{
      const kp = pct(f(kr,"Progress")), kc = f(kr,"Confidence")||"Not started";
      const ts = krTasks(kr.id), done = ts.filter(t=>f(t,"Status")==="Done").length;
      return `<div style="padding:9px 0;border-top:1px dashed var(--rule)">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <span style="font-weight:600;font-size:13.5px">${esc(f(kr,"Title"))}</span>
          <span class="mono">${f(kr,"Current value")??0} / ${f(kr,"Target value")??0}${esc(f(kr,"Unit")||"")} · ${kp}%</span>
        </div>
        <div class="prog"><span style="width:${kp}%;background:${col(kc)}"></span></div>
        ${ts.length?`<div class="mono" style="margin-top:5px">${done} of ${ts.length} tasks done${ts.filter(isLate).length?` · ${ts.filter(isLate).length} overdue`:""}</div>`:""}
        ${f(kr,"Target changed")?`<div class="mono" style="color:var(--indigo);margin-top:4px">◆ ${esc(f(kr,"Target changed"))}</div>`:""}
      </div>`;}).join("")}</div>` : `<div class="empty" style="margin-top:10px">No key results yet.</div>`}
    ${last?`<div class="next" style="margin-top:12px"><span class="mono">Last check-in ${fmt(f(last,"Date"))} · ${esc(nm("people",one(last,"Person")))}</span>

      <div class="eyebrow" style="margin-bottom:6px">Decisions on this objective</div>

}

let leaderId = null;
V.mine = () => {
  const L = rec("people", leaderId) || ME;

  const late = mine.flatMap(o=>objTasks(o.id)).filter(isLate).length;
  const avg = mine.length ? Math.round(mine.reduce((s,o)=>s+objProgress(o),0)/mine.length*100) : 0;
  const fresh = mine.length ? Math.round(mine.filter(o=>staleDays(o)<=7).length/mine.length*100) : 0;

  const needs = [];
  mine.forEach(o=>{
    const t = objTasks(o.id), lt = t.filter(isLate).length;
    if(f(o,"Confidence")==="Off track") needs.push({p:0,c:"p-off",tag:"Off track",t:f(o,"Title"),o:o.id,go:"objective",
      w:"Declared off track. Needs a decision, not a nudge."});
    if(isStale(o)) needs.push({p:1,c:"p-stale",tag:`${staleDays(o)}d silent`,t:f(o,"Title"),o:o.id,go:"checkin",
      w:"No check-in logged — you can't tell if it's stuck or just quiet. Check in →"});
    if(f(o,"Confidence")==="At risk" && !t.filter(x=>f(x,"Status")==="Open").length)
      needs.push({p:1,c:"p-risk",tag:"At risk, no tasks",t:f(o,"Title"),o:o.id,go:"objective",w:"At risk with nothing planned against it."});
    if(lt) needs.push({p:2,c:"p-off",tag:`${lt} overdue`,t:f(o,"Title"),o:o.id,go:"objective",w:`${lt} task${lt>1?"s":""} past due.`});
  });
  // open reviews where this person hasn't answered yet
  DB.reviews.filter(r=>f(r,"Status")!=="Closed").forEach(r=>{
    const oid = one(r,"Objective");
    if(!mine.some(o=>o.id===oid) && !teamFor(oid).some(p=>p.id===L.id)) return;
    const answered = DB.responses.some(x=>lnk(x,"Review").includes(r.id) && lnk(x,"Person").includes(L.id));
    if(!answered) needs.push({p:0,c:"p-risk",tag:f(r,"Type")||"Review",t:nm("objectives",oid),rev:r.id,go:"review",
      w:`${f(r,"Type")||"A review"} is open and your answer isn't in yet. The team can't see anyone's until everyone's in.`});
  });
  needs.sort((a,b)=>a.p-b.p);

  const feed = DB.checkins.filter(c=>mine.some(o=>lnk(c,"Objective").includes(o.id)))
    .sort((a,b)=>new Date(f(b,"Date"))-new Date(f(a,"Date"))).slice(0,8);

  document.getElementById("view").innerHTML = `

      <div><h1>My work</h1><div class="sub">${esc(f(L,"Name"))} · ${esc(f(L,"Role")||"")} · everything you lead, one page.</div></div>

    <div class="tiles">
      <div class="tile b-ok"><div class="v">${mine.filter(o=>f(o,"Confidence")==="On track").length}</div><div class="l">On track</div></div>
      <div class="tile b-risk"><div class="v">${mine.filter(o=>f(o,"Confidence")==="At risk").length}</div><div class="l">At risk</div></div>
      <div class="tile b-off"><div class="v">${mine.filter(o=>f(o,"Confidence")==="Off track").length}</div><div class="l">Off track</div></div>
      <div class="tile b-ind"><div class="v">${fresh}%</div><div class="l">Checked in this week</div></div>
      <div class="tile"><div class="v">${avg}%</div><div class="l">Average progress</div></div>
      <div class="tile b-off"><div class="v">${late}</div><div class="l">Overdue tasks</div></div>
    </div>
    <div class="card">
      <h2>Needs you this week</h2>
      <div class="cap">Ranked by what's actually blocked, not by what's loudest.</div>
      ${needs.length ? needs.map(n=>`<div class="row" style="cursor:pointer" data-need="${n.go}" data-no="${n.o||''}" data-nr="${n.rev||''}"><div><strong>${esc(n.t)}</strong><div class="why">${esc(n.w)}</div></div>
        <span class="pill ${n.c}">${n.tag}</span></div>`).join("")
        : `<div class="empty">Nothing flagged. Everything's checked in and moving.</div>`}
    </div>
    <div class="two">
      <div class="card">
        <h2>Your objectives</h2><div class="cap">And where each one lands up at JV.</div>
        ${mine.length ? mine.map(o=>{
          const p = pct(objProgress(o)), c=f(o,"Confidence")||"Not started", k=ladderKr(o);
          const t=objTasks(o.id);
          return `<div class="row" style="cursor:pointer" data-o="${o.id}">
            <div><strong>${esc(f(o,"Title"))}</strong>
              <div class="mono">${alignLine(o)}</div>
              <div class="prog" style="width:200px"><span style="width:${p}%;background:${col(c)}"></span></div></div>
            <div style="text-align:right">
              <span class="pill ${cls(c)}">${c}</span>
              <div class="mono" style="margin-top:4px;color:${isStale(o)?"var(--clay)":"var(--ink-2)"}">${staleDays(o)===999?"never":staleDays(o)+"d"} · ${t.filter(x=>f(x,"Status")==="Open").length} open</div>
            </div></div>`;}).join("")
          : `<div class="empty">No objectives yet. That's the conversation to have.</div>`}
      </div>
      <div class="card">
        <h2>Recent movement</h2><div class="cap">Every check-in under you.</div>
        ${feed.length ? feed.map(c=>`<div style="border-left:2px solid var(--rule);padding:4px 0 4px 11px;margin-bottom:11px">
            <div class="mono">${fmt(f(c,"Date"))} · ${esc(nm("people",one(c,"Person")))}</div>
            <div style="font-size:13.5px">${esc(f(c,"What moved")||"")}</div></div>`).join("")
          : `<div class="empty">Nothing logged yet.</div>`}
      </div>
    </div>`;
  document.getElementById("lw").onchange = e=>{leaderId=e.target.value; render();};
  document.querySelectorAll("[data-o]").forEach(r=>r.onclick=()=>openObjective(r.dataset.o));
  document.querySelectorAll("[data-need]").forEach(r=>r.onclick=()=>{
    const go=r.dataset.need, oid=r.dataset.no, rid=r.dataset.nr;
    if(go==="checkin"){ ciObj=oid; ciVals={}; selObj=oid; VIEW="checkin"; }
    else if(go==="review"){ revId=rid||null; VIEW="reviews"; }
    else { selObj=oid; VIEW="objective"; }
    drawChrome(); render(); scrollTo(0,0);
  });

        <div class="hint">"At risk" is not a failure. It's the most useful thing you can tell your leader.</div>
      </div>
      ${last?`<div class="mono">Last check-in ${fmt(f(last,"Date"))} by ${esc(nm("people",one(last,"Person")))}</div>`:""}
    </div>
    <button class="btn wide" id="ciSend">Log check-in</button>
    </div>
    <div id="ripple" class="hidden" style="max-width:680px"></div>`;

  document.getElementById("cio").onchange = e=>{ciObj=e.target.value; ciVals={}; render();};
  document.querySelectorAll("input[data-kr]").forEach(s=>s.oninput=()=>{
    const k = rec("krs", s.dataset.kr), v = +s.value, prev = f(k,"Current value")??0, u = f(k,"Unit")||"";
    ciVals[k.id] = v;
    document.getElementById("n-"+k.id).textContent = (Math.round(v*10)/10);
    const d = v-prev, el = document.getElementById("d-"+k.id);
    el.textContent = d>0?`+${Math.round(d*10)/10}${u} since last check-in`:d<0?`${Math.round(d*10)/10}${u} since last check-in`:`was ${prev}${u} last check-in`;
    el.style.color = d>0?"var(--moss)":d<0?"var(--clay)":"var(--ink-2)";
  });
  document.querySelectorAll(".conf").forEach(b=>b.onclick=()=>{ciConf=b.dataset.c;
    document.querySelectorAll(".conf").forEach(x=>x.setAttribute("aria-pressed", x===b));});
  document.querySelectorAll("input[data-task]").forEach(c=>c.onchange=async()=>{
    const done = c.checked;
    await patch(T.tasks, [{id:c.dataset.task, fields:{Status: done?"Done":"Open", "Done date": done?iso(TODAY):null}}]);
    await reload("tasks"); toast(done?"Task done":"Task reopened"); render();
  });
  document.querySelectorAll("[data-tdel]").forEach(x=>x.onclick=async()=>{
    if(!confirm(`Delete "${nm("tasks", x.dataset.tdel)}"?`)) return;
    try{ await del(T.tasks, [x.dataset.tdel]); await reload("tasks"); toast("Task deleted"); render(); }
    catch(e){ toast(e.message, true); }
  });
  document.querySelectorAll("button[data-add]").forEach(b=>b.onclick=async()=>{
    const k = b.dataset.add, title = document.getElementById("nt-"+k).value.trim();
    if(!title) return;
    await post(T.tasks, [{fields:{Title:title, Status:"Open",
      "Due date": document.getElementById("nd-"+k).value || null,
      "Key Result":[k], Owner:[document.getElementById("nw-"+k).value]}}]);
    await reload("tasks"); toast("Task added"); render();
  });
  document.getElementById("ciSend").onclick = () => sendCheckin(o, krs);
};

async function sendCheckin(o, krs){
  const moved = document.getElementById("ciMoved").value.trim();
  const before = {}; krs.forEach(k=>before[k.id] = f(k,"Current value") ?? 0);
  const btn = document.getElementById("ciSend"); btn.disabled = true; btn.textContent = "Saving…";
  try{
    if(krs.length) await patch(T.krs, krs.map(k=>({id:k.id, fields:{"Current value": ciVals[k.id]}})));
    await post(T.checkins, [{fields:{
      Summary: `${f(o,"Title")} — ${fmt(TODAY)}`, Date: iso(TODAY),
      "What moved": moved, Blockers: document.getElementById("ciBlock").value.trim(),
      Confidence: ciConf, Objective:[o.id], Person:[ME.id]}}]);
    await patch(T.objectives, [{id:o.id, fields:{Confidence: ciConf}}]);
    await Promise.all([reload("krs"), reload("checkins"), reload("objectives")]);
    ripple(o, krs, before);
  }catch(e){ toast("Couldn't save: "+e.message, true); btn.disabled=false; btn.textContent="Log check-in"; }
}

function ripple(o, krs, before){
  const jv = ladderKr(o);
  const gained = krs.reduce((s,k)=>s + ((ciVals[k.id]??0) - before[k.id]), 0);
  const box = document.getElementById("ripple");
  document.querySelectorAll(".wrap .card, #ciSend, .head select").forEach(e=>e.classList.add("hidden"));
  box.classList.remove("hidden");
  box.innerHTML = `
    <div class="eyebrow">Check-in logged · ${fmt(TODAY)}</div>
    <div class="headline" id="hl">${gained>0?"You moved it.":"Logged. Thank you for being honest."}</div>
    <div class="card">
      ${krs.map((k,i)=>{
        const now = ciVals[k.id]??0, p = pct(f(k,"Target value") ? (now - (f(k,"Start value")||0))/((f(k,"Target value")||1)-(f(k,"Start value")||0)) : 0);
        return `<div class="rung" id="r${i}">
          <div style="display:flex;justify-content:space-between;gap:10px"><span style="font-weight:600;font-size:13px">${esc(f(k,"Title"))}</span>
            <span class="mono">${before[k.id]} → <b style="color:var(--ink)">${now}</b> / ${f(k,"Target value")??0}</span></div>
          <div class="prog"><span style="width:0;background:var(--moss)" data-w="${p}"></span></div>
        </div>`;}).join("")}
      <div style="color:#B8C2CB;margin:0 0 8px 6px">↳</div>
      <div class="rung" id="ro">
        <div style="display:flex;justify-content:space-between"><span style="font-weight:600;font-size:13px">${esc(f(o,"Title"))}</span>
          <span class="mono">${pct(objProgress(o))}%</span></div>
        <div class="prog"><span style="width:0;background:var(--moss)" data-w="${pct(objProgress(o))}"></span></div>
      </div>
      ${jv?`<div style="color:#B8C2CB;margin:0 0 8px 6px">↳</div>
      <div class="rung" id="rj"><div class="jvbox">
        <div class="eyebrow">JV five-year key result</div>
        <div style="display:flex;justify-content:space-between;margin-top:4px">
          <span style="font-weight:600;font-size:13px">${esc(f(jv,"Title"))}</span>
          <span class="mono">${f(jv,"Current value")??0} / ${f(jv,"Target value")??0}</span></div>
        <div class="prog"><span style="width:0;background:var(--indigo)" data-w="${pct(f(jv,"Progress"))}"></span></div>
        <div class="hint">Your number feeds this. Update the JV key result at the leadership level when the roll-up is agreed.</div>
      </div></div>`:""}
    </div>
    <button class="btn wide" onclick="ciVals={};render();">Back to my objectives</button>`;
  const rungs = [...box.querySelectorAll(".rung")];
  setTimeout(()=>document.getElementById("hl").classList.add("show"), 120);
  rungs.forEach((r,i)=>setTimeout(()=>{
    r.classList.add("show");
    r.querySelectorAll(".prog span").forEach(s=>s.style.width = s.dataset.w+"%");
  }, 400 + i*750));
  toast("Check-in saved");
}

function teamFor(objId){
  const o = rec("objectives", objId); if(!o) return DB.people;
  const u = one(o,"Org Unit");

  return t.length ? t : DB.people.filter(p=>areaName(p)===areaName(o) && f(p,"Active")!==false);
}
function newReviewForm(){
  const objs = DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year");
  return `<div class="grid2">
    <div class="field"><label>Objective</label><select id="nrObj">${objs.map(o=>`<option value="${o.id}" ${o.id===rvNewObj?"selected":""}>${esc(areaName(o)||"")} — ${esc(f(o,"Title"))}</option>`).join("")}</select></div>

function wireNewReview(){

  b.onclick = async()=>{
    const o = document.getElementById("nrObj").value, ty = document.getElementById("nrType").value;
    const j = await post(T.reviews, [{fields:{ Name:`${nm("objectives",o)} — ${ty}`, Type:ty,
      Objective:[o], Cycle:[document.getElementById("nrCyc").value],
      "Meeting date": document.getElementById("nrDate").value || null, Status:"Collecting responses"}}]);

function facilitator(R, set, resp){
  const scores = resp.map(r=>f(r,"Confidence 1-10")).filter(Boolean);
  const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : "—";
  const spread = scores.length ? Math.max(...scores)-Math.min(...scores) : 0;
  const bars = [...Array(10)].map((_,i)=>{
    const n = scores.filter(s=>s===i+1).length;
    return `<div class="${n?"hit":""}" style="height:${n?12+n*15:5}px"></div>`;}).join("");
  const block = q => `<div class="card"><h3>${esc(q.q)}</h3>
    ${resp.map(r=>{ const a=f(r,q.k); return a ? `<div class="ans"><div class="who">${esc(nm("people",one(r,"Person")))}</div><p>${esc(a)}</p></div>`:"";}).join("") || `<div class="empty">No answers.</div>`}</div>`;
  return `
    ${scores.length?`<div class="card"><h3>Are we going to hit this?</h3>
      <div class="spread">${bars}</div>
      <div class="mono" style="display:flex;justify-content:space-between"><span>No chance</span><span>Certain</span></div>
      <div style="margin-top:8px"><strong>Average ${avg}/10 — spread of ${spread} points.</strong></div>
      <div class="hint">${spread>=3?"That gap is the meeting. Someone believes something the others don't — start there, don't average it away.":"The team is aligned on this one."}</div>
    </div>`:""}
    ${set.filter(q=>q.t!=="scale").map(block).join("")}
    <div class="card"><h3>Record the outcome</h3>
      <div class="cap">What the team decided goes on the objective, not in a meeting note.</div>
      <button class="btn" onclick="selObj='${one(R,"Objective")}';VIEW='objective';drawChrome();render();scrollTo(0,0)">Record a decision on this objective →</button>
    </div>`;
}

    if(!confirm(`Delete "${f(o,"Title")}" and its ${krs.length} key result${krs.length===1?"":"s"} for good?\n\nThis cannot be undone.`)) return;
    try{
      const ts = objTasks(o.id).map(t=>t.id);
      if(ts.length) await del(T.tasks, ts);
      if(krs.length) await del(T.krs, krs.map(k=>k.id));
      await del(T.objectives, [o.id]);
      selObj = null;
      await Promise.all([reload("objectives"), reload("krs"), reload("tasks")]);
      toast("Deleted"); render();
    }catch(e){ toast(e.message, true); }

  /* key result edit / delete */
  document.querySelectorAll("[data-kredit]").forEach(b=>b.onclick=()=>
    document.getElementById("kre-"+b.dataset.kredit).classList.toggle("hidden"));
  document.querySelectorAll("[data-krsave]").forEach(b=>b.onclick=async()=>{
    const id = b.dataset.krsave;
    await patch(T.krs, [{id, fields:{
      Title: document.getElementById("et-"+id).value.trim(),
      Unit: document.getElementById("eu-"+id).value.trim(),
      "Current value": +document.getElementById("ec-"+id).value,
      "Target value": +document.getElementById("eg-"+id).value}}]);
    await reload("krs"); toast("Key result saved"); render();
  });
  document.querySelectorAll("[data-krarch]").forEach(b=>b.onclick=async()=>{
    if(!confirm(`Archive "${nm("krs", b.dataset.krarch)}"?\n\nIt leaves every working view but keeps its numbers and history. You can bring it back from the Archive.`)) return;
    await patch(T.krs, [{id:b.dataset.krarch, fields:{Archived:true}}]);
    await reload("krs"); toast("Key result archived"); render();
  });
  document.querySelectorAll("[data-krdel]").forEach(b=>b.onclick=async()=>{
    const id = b.dataset.krdel, ts = krTasks(id);
    if(!confirm(`Delete "${nm("krs",id)}"${ts.length?` and its ${ts.length} task${ts.length===1?"":"s"}`:""}?\n\nThis cannot be undone.`)) return;
    try{
      if(ts.length) await del(T.tasks, ts.map(t=>t.id));
      await del(T.krs, [id]);
      await Promise.all([reload("krs"), reload("tasks")]);
      toast("Key result deleted"); render();
    }catch(e){ toast(e.message, true); }
  });

  document.getElementById("krGo").onclick = async()=>{
    const t = document.getElementById("krT").value.trim(); if(!t) return;
    const g = +document.getElementById("krG").value;
    const c = document.getElementById("krC").value, x = document.getElementById("krX").value;
    await post(T.krs, [{fields:{Title:t, Unit:document.getElementById("krU").value, Type:"Number",
      "Start value":+document.getElementById("krS").value, "Current value":+document.getElementById("krS").value,
      "Target value":g, "Original target":g,
      ...(c!==""?{Commit:+c}:{}), ...(x!==""?{Stretch:+x}:{}),
      Confidence:"Not started", Objective:[o.id], Owner:lnk(o,"Owner")}}]);
    await reload("krs"); toast("Key result added"); render();
  };
  document.getElementById("dGo").onclick = async()=>{
    const what = document.getElementById("dWhat").value.trim(), why = document.getElementById("dWhy").value.trim();
    if(!what || !why) return toast("A decision needs both what and why", true);
    const krId = document.getElementById("dKr").value, tgt = document.getElementById("dTgt").value;
    await post(T.decisions, [{fields:{Decision:what, Type:document.getElementById("dType").value,
      From:document.getElementById("dFrom").value, To:document.getElementById("dTo").value, Why:why,
      Source:document.getElementById("dSrc").value, "Decided by":document.getElementById("dBy").value,
      Date:iso(TODAY), Objective:[o.id], ...(krId?{"Key Result":[krId]}:{})}}]);
    if(krId && tgt !== "") await patch(T.krs, [{id:krId, fields:{"Target value": +tgt}}]);
    await Promise.all([reload("decisions"), reload("krs")]);
    toast("Decision recorded"); render();
  };
  document.querySelectorAll("[data-reply]").forEach(b=>b.onclick=async()=>{
    const txt = prompt("Your reply — the thing that makes them write a second check-in:");
    if(!txt) return;
    await patch(T.checkins, [{id:b.dataset.reply, fields:{Reply:txt, "Replied by":f(ME,"Name")}}]);
    await reload("checkins"); toast("Replied"); render();
  });
};

function wireObjForm(){
  const b = document.getElementById("oGo"); if(!b) return;
  const al = document.getElementById("oAl");
  if(al) al.onchange = ()=>{
    document.getElementById("oPBox").classList.toggle("hidden", al.value!==ALIGN.LADDER);
    document.getElementById("oJBox").classList.toggle("hidden", al.value!==ALIGN.SUPPORT);
  };
  b.onclick = async()=>{
    const t = document.getElementById("oT").value.trim(); if(!t) return toast("Give it a title", true);
    const uid = document.getElementById("oU").value;
    const u = rec("units", uid);
    if(!u) return toast("Add an org unit first, under Org", true);
    const align = document.getElementById("oAl").value;
    const j = await post(T.objectives, [{fields:{Title:t,
      Scope: f(u,"Type")==="Department" ? "Team" : f(u,"Type"),   // Scope is legacy; the unit is the truth
      "Org Unit":[uid], Area:f(u,"Name"), Alignment: align,
      Confidence:"Not started", Status:"Active",
      Owner:[document.getElementById("oO").value], Cycle:[document.getElementById("oC").value],
      ...(align===ALIGN.LADDER ? {"Parent Key Result":[document.getElementById("oP").value]} : {}),
      ...(align===ALIGN.SUPPORT ? {"Supports JV objective":[document.getElementById("oJ").value]} : {})}}]);
    await reload("objectives"); selObj = j.records[0].id; toast("Objective created"); render();
  };
}

/* ============================ COACHING CONSOLE ============================ */
let cSel = null, cTab = "notes", cShared = false, cFiles = [];
const cadence = p => f(p,"Coaching cadence (days)") || 21;
const cScore = p => {
  const objs = ownedBy(p.id);
  return objs.filter(o=>f(o,"Confidence")==="Off track").length*3
       + objs.filter(isStale).length*2
       + (f(p,"Overdue for a 1:1") ? 3 : 0)
       + (objs.length===0 && ["Country leader","Division leader","Team leader"].includes(f(p,"Role")) ? 4 : 0);
};
V.coaching = () => {
  const leaders = DB.people.filter(p=>["Country leader","Division leader","Team leader"].includes(f(p,"Role")));
  const pool = leaders.length ? leaders : DB.people;
  if(!cSel || !rec("people",cSel)) cSel = [...pool].sort((a,b)=>cScore(b)-cScore(a))[0]?.id;
  const P = rec("people", cSel);
  const notes = DB.notes.filter(n=>lnk(n,"Person").includes(cSel)).sort((a,b)=>new Date(f(b,"Date"))-new Date(f(a,"Date")));
  const shares = DB.shares.filter(s=>lnk(s,"Person").includes(cSel));
  const objs = P ? ownedBy(P.id) : [];
  const overdue = pool.filter(p=>f(p,"Overdue for a 1:1"));
  const follow = DB.notes.filter(n=>f(n,"Next step") && !f(n,"Follow-up done"));
  const noOkr = pool.filter(p=>!ownedBy(p.id).length);

  document.getElementById("view").innerHTML = `
    <div class="head"><div><h1>Coaching console</h1>
      <div class="sub">Who needs you, what you said, what you gave them. Notes are private unless you share them.</div></div></div>
    <div class="tiles">
      <div class="tile b-off"><div class="v">${overdue.length}</div><div class="l">Overdue for a 1:1</div></div>
      <div class="tile b-ind"><div class="v">${follow.length}</div><div class="l">Open follow-ups</div></div>
      <div class="tile b-risk"><div class="v">${noOkr.length}</div><div class="l">No objectives written</div></div>
      <div class="tile b-ok"><div class="v">${DB.shares.filter(s=>f(s,"Opened")).length}/${DB.shares.length}</div><div class="l">Resources opened</div></div>
    </div>

    <div class="side">
      <div class="card">
        <h2>Coaching queue</h2><div class="cap">Ranked by need, not alphabet.</div>
        ${[...pool].sort((a,b)=>cScore(b)-cScore(a)).map(p=>{
          const o = ownedBy(p.id), bits=[];
          if(!o.length) bits.push("no objectives written");
          if(f(p,"Overdue for a 1:1")) bits.push(`${f(p,"Days since 1:1")===999?"never":f(p,"Days since 1:1")+"d"} since last 1:1`);
          if(o.some(x=>f(x,"Confidence")==="Off track")) bits.push("off-track work");
          if(o.some(isStale)) bits.push("check-ins gone quiet");
          const s = cScore(p), c = s>=6?"var(--clay)":s>=3?"var(--amber)":"var(--moss)";
          return `<div class="qi" data-p="${p.id}" aria-current="${p.id===cSel}">
            <div style="display:flex;justify-content:space-between;gap:8px"><strong style="font-size:13.5px">${esc(f(p,"Name"))}</strong>
              <span style="width:7px;height:7px;border-radius:50%;background:${c};margin-top:6px;flex:none"></span></div>
            <div class="mono">${esc(areaName(p)||"")}</div>
            <div class="why">${bits.join(" · ")||"Healthy"}</div></div>`;}).join("")}
      </div>

      <div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline">
            <div><h2>${esc(P?f(P,"Name"):"—")}</h2>
              <div class="cap" style="margin:0">${esc(f(P,"Role")||"")} · ${esc(areaName(P)||"")} · last talked ${f(P,"Days since 1:1")===999?"never":f(P,"Days since 1:1")+"d ago"} (cadence ${cadence(P)}d)</div></div>
            <div class="mono">${objs.length} objectives · ${notes.length} notes · ${shares.length} files</div>
          </div>
          <div style="display:flex;gap:5px;border-bottom:1px solid var(--rule);margin:14px 0">
            ${[["notes","Coaching notes"],["files","Files & resources"],["okrs","Their OKRs"]].map(([k,l])=>
              `<button class="nv" data-t="${k}" style="border-radius:0;border-bottom:2px solid ${cTab===k?"var(--ink)":"transparent"};color:${cTab===k?"var(--ink)":"var(--ink-2)"};font-weight:600">${l}</button>`).join("")}
          </div>
          <div id="cpane"></div>
        </div>

        <div class="card">
          <h2>Coaching library</h2><div class="cap">Upload once, share with anyone. You can see who's actually opened it.</div>
          <div class="drop" id="libdrop"><b>Drop a file here, or click to upload</b>Guides, templates, recordings, decks.</div>
          <div class="lib" style="margin-top:12px">
            ${DB.resources.map(r=>{
              const sh = DB.shares.filter(s=>lnk(s,"Resource").includes(r.id));
              const op = sh.filter(s=>f(s,"Opened")).length;
              const url = (f(r,"File")||[])[0]?.url;
              return `<div class="res">
                <span class="mono">${esc(f(r,"Kind")||"File")}</span>
                <div style="font-weight:600;font-size:13.5px;margin:6px 0 3px">${url?`<a href="${url}" target="_blank">${esc(f(r,"Name"))}</a>`:esc(f(r,"Name"))}</div>
                <div class="mono">shared with ${sh.length} · <span class="${op?"seen":"unseen"}">${op} opened</span></div>
                <button class="btn dash" style="margin-top:8px;width:100%;font-size:12px;padding:5px" data-share="${r.id}">Share with ${esc(P?f(P,"Name").split(" ")[0]:"")}</button>
              </div>`;}).join("") || `<div class="empty">Library is empty.</div>`}
          </div>
        </div>

        <div class="card">
          <h2>Send a report</h2><div class="cap">Pulled live from the base — nobody retypes anything.</div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px">
            <select class="sm" id="rpKind"><option>Leadership summary</option><option>Coaching digest (private)</option><option>Nudge to owners who've gone quiet</option></select>
            <button class="btn ghost" id="rpGo">Preview</button>
          </div>
          <div class="report" id="rpOut">Pick a report and press Preview.</div>
        </div>
      </div>
    </div>`;

  document.querySelectorAll(".qi").forEach(q=>q.onclick=()=>{cSel=q.dataset.p; cFiles=[]; render();});
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{cTab=b.dataset.t; render();});
  document.querySelectorAll("[data-share]").forEach(b=>b.onclick=async()=>{
    await post(T.shares, [{fields:{Name:`${nm("resources",b.dataset.share)} → ${f(P,"Name")}`,
      "Shared on":iso(TODAY), Opened:false, Resource:[b.dataset.share], Person:[cSel]}}]);
    await reload("shares"); toast("Shared"); render();
  });
  dropzone(document.getElementById("libdrop"), async files=>{
    for(const file of files){
      const j = await post(T.resources, [{fields:{Name:file.name, Kind:"Guide", Uploaded:iso(TODAY)}}]);
      await upload(j.records[0].id, FIELD_IDS.resourceFile, file);
    }
    await reload("resources"); toast("Uploaded to library"); render();
  });
  document.getElementById("rpGo").onclick = () => buildReport();
  cPane(P, notes, shares, objs);
};

            <span class="mono"><b>${esc(f(n,"Title")||"Note")}</b> · ${fmt(f(n,"Date"))}</span>
            <span class="lock ${sh?"sh":""}">${sh?"Shared":"Private"}</span></div>
          <p style="margin:5px 0 0;font-size:13.5px">${esc(f(n,"Note")||"")}</p>
          ${f(n,"Next step")?`<div class="next">${f(n,"Follow-up done")?"✓":"→"} <strong>Next:</strong> ${esc(f(n,"Next step"))}
            ${f(n,"Follow-up due")?`<span class="mono">· due ${fmt(f(n,"Follow-up due"))}</span>`:""}
            ${!f(n,"Follow-up done")?`<button class="btn dash" style="margin-left:6px;font-size:11px;padding:3px 7px" data-done="${n.id}">Mark done</button>`:""}</div>`:""}
          ${files.length?`<div class="att">${files.map(x=>`<span class="file">📎 <a href="${x.url}" target="_blank">${esc(x.filename)}</a></span>`).join("")}</div>`:""}
        </div>`;}).join("") : `<div class="empty">No notes yet. The first conversation is the one that matters.</div>`}`;

    document.getElementById("nSw").onclick = ()=>{cShared=!cShared; cPane(P,notes,shares,objs);};
    document.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{cFiles.splice(+x.dataset.rm,1); cPane(P,notes,shares,objs);});
    dropzone(document.getElementById("nDrop"), files=>{ cFiles.push(...files); cPane(P,notes,shares,objs); });
    document.querySelectorAll("[data-done]").forEach(b=>b.onclick=async()=>{
      await patch(T.notes, [{id:b.dataset.done, fields:{"Follow-up done":true}}]);
      await reload("notes"); toast("Follow-up closed"); render();
    });
    document.getElementById("nSave").onclick = async()=>{
      const txt = document.getElementById("nTxt").value.trim();
      if(!txt) return toast("Write something first", true);
      const btn = document.getElementById("nSave"); btn.disabled=true; btn.textContent="Saving…";
      const j = await post(T.notes, [{fields:{
        Title:`${f(P,"Name")} — ${fmt(TODAY)}`, Date:iso(TODAY), Note:txt,
        Visibility: cShared?"Shared with leader":"Private",
        "Next step": document.getElementById("nNext").value.trim(),
        "Follow-up due": document.getElementById("nDue").value || null,
        Person:[P.id]}}]);
      for(const file of cFiles) await upload(j.records[0].id, FIELD_IDS.notesFiles, file);
      cFiles=[]; cShared=false;
      await reload("notes"); toast("Note saved"); render();
    };
  }

  if(cTab==="files"){
    el.innerHTML = `
      <div class="cap">Files you've given ${esc(f(P,"Name"))}. "Not opened yet" is the coaching conversation.</div>
      ${shares.length ? shares.map(s=>{
        const r = rec("resources", one(s,"Resource"));
        const url = r ? (f(r,"File")||[])[0]?.url : null;
        return `<div class="row">
          <div><strong style="font-size:13.5px">📎 ${url?`<a href="${url}" target="_blank">${esc(nm("resources",one(s,"Resource")))}</a>`:esc(nm("resources",one(s,"Resource")))}</strong>
            <div class="mono">shared ${fmt(f(s,"Shared on"))}</div></div>
          <span class="${f(s,"Opened")?"seen":"unseen"}">${f(s,"Opened")?"opened ✓":"not opened yet"}</span>
        </div>`;}).join("") : `<div class="empty">Nothing shared with ${esc(f(P,"Name"))} yet. Use the library below.</div>`}`;
  }

  if(cTab==="okrs"){
    el.innerHTML = objs.length ? objs.map(o=>{
      const p = pct(objProgress(o)), c = f(o,"Confidence")||"Not started";
      return `<div class="row" style="cursor:pointer" data-go="${o.id}">
        <div><strong style="font-size:13.5px">${esc(f(o,"Title"))}</strong>
          <div class="prog" style="width:220px"><span style="width:${p}%;background:${col(c)}"></span></div>
          <div class="mono">${p}% · ${esc(nm("cycles",one(o,"Cycle")))}</div></div>
        <span class="mono" style="color:${isStale(o)?"var(--clay)":"var(--ink-2)"}">check-in ${staleDays(o)===999?"never":staleDays(o)+"d ago"}</span>
      </div>`;}).join("")
      : `<div class="empty">${esc(f(P,"Name"))} hasn't written any objectives. That's the conversation.</div>`;
    document.querySelectorAll("[data-go]").forEach(r=>r.onclick=()=>openObjective(r.dataset.go));
  }
}

function buildReport(){
  const kind = document.getElementById("rpKind").value;
  const objs = DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year");
  const off = objs.filter(o=>f(o,"Confidence")==="Off track");
  const risk = objs.filter(o=>f(o,"Confidence")==="At risk");
  const on = objs.filter(o=>f(o,"Confidence")==="On track");
  const stale = objs.filter(isStale);
  const late = objs.flatMap(o=>objTasks(o.id)).filter(isLate).length;
  const orphanKrs = jvKrs().filter(k=>!childObjectives(k.id).length);
  const line = o => `• ${areaName(o)||""} — ${f(o,"Title")} (${pct(objProgress(o))}%)`;
  let out;

  if(kind==="Leadership summary"){
    out = `JV OKR — ${fmt(TODAY)}

WHERE WE ARE
${on.length} on track · ${risk.length} at risk · ${off.length} off track · ${late} overdue tasks.
${objs.length?Math.round(objs.filter(o=>staleDays(o)<=7).length/objs.length*100):0}% of objectives were checked in this week.

NEEDS A DECISION
${off.map(o=>`${line(o)} — off track, ${staleDays(o)}d since last check-in.`).join("\n") || "• Nothing off track."}

WATCH LIST
${risk.map(line).join("\n") || "• Nothing at risk."}

GONE QUIET (no check-in in ${STALE}+ days)
${stale.map(o=>`${line(o)} — ${staleDays(o)}d.`).join("\n") || "• None."}

DECISIONS MADE THIS CYCLE
${DB.decisions.slice(-6).map(d=>`• ${f(d,"Decision")} — ${(f(d,"Why")||"").slice(0,110)}`).join("\n") || "• None recorded."}

NOTHING POINTED AT THESE JV KEY RESULTS
${orphanKrs.map(k=>`• ${f(k,"Title")}`).join("\n") || "• Every JV key result has work laddering to it."}

WORK THAT DOESN'T LADDER (${unlanded().length})
${unlanded().map(o=>`• ${areaName(o)} — ${f(o,"Title")} (${supportsJv(o)?"supports JV":"standalone"})`).join("\n") || "• None."}`;
  } else if(kind==="Coaching digest (private)"){
    const pool = DB.people.filter(p=>["Country leader","Division leader","Team leader"].includes(f(p,"Role")));
    out = `COACHING DIGEST — private to the OKR director
${fmt(TODAY)}

OVERDUE FOR A CONVERSATION
${pool.filter(p=>f(p,"Overdue for a 1:1")).map(p=>`• ${f(p,"Name")} (${areaName(p)||""}) — ${f(p,"Days since 1:1")===999?"never talked":f(p,"Days since 1:1")+"d"}, cadence ${cadence(p)}d.`).join("\n") || "• Everyone's current."}

FOLLOW-UPS YOU COMMITTED TO
${DB.notes.filter(n=>f(n,"Next step") && !f(n,"Follow-up done"))
  .map(n=>`• ${nm("people",one(n,"Person"))} — ${f(n,"Next step")}${f(n,"Follow-up due")?` (due ${fmt(f(n,"Follow-up due"))})`:""}`).join("\n") || "• None open."}

NO OBJECTIVES WRITTEN
${pool.filter(p=>!ownedBy(p.id).length).map(p=>`• ${f(p,"Name")} (${areaName(p)||""})`).join("\n") || "• Everyone has objectives."}

RESOURCES SENT BUT NEVER OPENED
${DB.shares.filter(s=>!f(s,"Opened")).map(s=>`• ${nm("people",one(s,"Person"))} — ${nm("resources",one(s,"Resource"))} (sent ${fmt(f(s,"Shared on"))})`).join("\n") || "• None."}`;
  } else {
    out = `To: owners of objectives that have gone quiet
Subject: Quick OKR check-in

Hi —

Your objective hasn't had a check-in in over ${STALE} days, or has tasks past due. Two minutes:

• What moved since last time?
• What's in the way?
• Still on track, at risk, or off track?

[Log check-in →]

Going to: ${stale.map(o=>nm("people",one(o,"Owner"))).filter(Boolean).join(", ") || "nobody — everyone's current"}`;
  }
  document.getElementById("rpOut").textContent = out;
}

/* ============================ ARCHIVE ============================ */
// Finished work doesn't vanish and doesn't clutter. It comes here, by cycle,
// with what it achieved and why it ended the way it did.
let aCycle = "";
V.archive = () => {
  const done = DB.objectives.filter(o=>f(o,"Scope")!=="JV 5-year" && ARCHIVED(o));
  const shown = done.filter(o=>!aCycle || lnk(o,"Cycle").includes(aCycle));
  const cycles = DB.cycles.filter(c=>done.some(o=>lnk(o,"Cycle").includes(c.id)));
  const krsArch = DB.krs.filter(KR_ARCHIVED);

  const byCycle = {};
  shown.forEach(o=>{ const c = one(o,"Cycle") || "none"; (byCycle[c] ||= []).push(o); });

  document.getElementById("view").innerHTML = `
    <div class="head">
      <div><h1>Archive</h1>
        <div class="sub">Closed and abandoned work, by cycle. Nothing is deleted — this is what JV tried, and how it went.</div></div>
      <div class="filters">
        <select class="sm" id="ac"><option value="">All cycles</option>
          ${cycles.map(c=>`<option value="${c.id}" ${aCycle===c.id?"selected":""}>${esc(f(c,"Name"))}</option>`).join("")}</select>
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="v">${done.length}</div><div class="l">Archived objectives</div></div>
      <div class="tile b-ok"><div class="v">${done.filter(o=>f(o,"Status")==="Closed").length}</div><div class="l">Closed</div></div>
      <div class="tile b-off"><div class="v">${done.filter(o=>f(o,"Status")==="Abandoned").length}</div><div class="l">Abandoned</div></div>
      <div class="tile b-ind"><div class="v">${krsArch.length}</div><div class="l">Retired key results</div></div>
    </div>

    ${Object.entries(byCycle).map(([cid, list])=>`
      <div style="margin-bottom:22px">
        <div class="eyebrow" style="margin-bottom:8px">${esc(cid==="none" ? "NO CYCLE" : nm("cycles",cid).toUpperCase())}</div>
        ${list.map(o=>{
          const krs = objKrsAll(o.id);
          const decs = DB.decisions.filter(d=>lnk(d,"Objective").includes(o.id));
          const retro = DB.reviews.find(r=>lnk(r,"Objective").includes(o.id) && f(r,"Type")==="Retrospective");
          const hit = krs.length ? Math.round(krs.reduce((a,k)=>a+(f(k,"Progress")||0),0)/krs.length*100) : 0;
          return `<div class="card" style="opacity:.92">
            <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap">
              <div>
                <div class="eyebrow">${esc(areaName(o)||"")} · ${esc(nm("people",one(o,"Owner")))}</div>
                <h2 style="margin-top:3px">${esc(f(o,"Title"))}</h2>
              </div>
              <div style="display:flex;gap:6px;align-items:center">
                <span class="pill ${f(o,"Status")==="Abandoned"?"p-off":"p-none"}">${esc(f(o,"Status"))}</span>
                <button class="btn ghost" style="padding:5px 10px;font-size:12px" data-reopen="${o.id}">Reopen</button>
              </div>
            </div>
            <div class="mono">${alignLine(o)}</div>
            <div class="prog" style="margin-top:8px"><span style="width:${hit}%;background:#93A0AB"></span></div>
            <div class="mono" style="margin-top:4px">finished at ${hit}%</div>

            ${krs.length?`<div style="margin-top:11px">
              ${krs.map(k=>`<div class="task"><span class="t">${esc(f(k,"Title"))}</span>
                <span class="m">${f(k,"Current value")??0} / ${f(k,"Target value")??0}${esc(f(k,"Unit")||"")} · ${pct(f(k,"Progress"))}%</span></div>`).join("")}
            </div>`:""}

            ${decs.length?`<div style="margin-top:12px">
              <div class="eyebrow" style="margin-bottom:6px">Decisions along the way</div>
              ${decs.map(d=>`<div class="dec ${esc(f(d,"Type")||"")}" style="margin-bottom:7px">
                <div class="what" style="margin:0">${esc(f(d,"Decision"))}</div>
                <div class="why2">${esc(f(d,"Why")||"")}</div>
                <div class="mono" style="margin-top:5px">${esc(f(d,"Source")||"")} · ${fmt(f(d,"Date"))}</div>
              </div>`).join("")}
            </div>`:""}

            ${retro && f(retro,"Outcome")?`<div class="next" style="margin-top:10px">

    ${krsArch.length?`<div class="card">

          <div class="mono">${esc(nm("objectives", one(k,"Objective")))} · finished at ${pct(f(k,"Progress"))}%</div></div>

  document.querySelectorAll("[data-unarch]").forEach(b=>b.onclick=async()=>{
